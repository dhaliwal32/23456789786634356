// ---------- move engine (shared by Add/Drop and Advice) ----------
function computeMoves(s, o) {
  const K = s.blend, gw = s.gw ?? 1.3, protectTop = s.protectTop ?? 8;
  const mins = { F: s.minF ?? 10, D: s.minD ?? 5, G: s.minGo ?? 2 };
  const H = o.H ?? 1, pos = o.pos || "all", q = (o.q || "").toLowerCase();
  const myR = s.players.filter((p) => p.ft === s.me);
  const fas = s.players.filter((p) => p.ft === "fa");
  const wt = (p) => (p.p === "G" ? { ...p, gwMul: gw } : p);
  const n = H === 0 ? s.weeks.length - s.wk : H;
  const horizon = s.weeks.slice(s.wk, s.wk + n).map((w, i) => { const dw = deriveWeek(w, s.autoDone); return { wk: dw, from: i === 0 ? dw.done : 0 }; });
  const lineupAware = H !== 0;
  const total = (roster) => { const r = roster.map(wt); return horizon.reduce((t, h) => t + weekProj(r, h.wk, K, h.from).total, 0); };
  const gamesIn = (p) => { let g = 0; horizon.forEach((h) => (h.wk.games[p.t] || []).forEach((d) => { if (d >= h.from && !p.ir && avail(p, h.wk.dates ? h.wk.dates[d] : null)) g++; })); return g; };
  const rawPts = (p) => { let t = 0; horizon.forEach((h) => (h.wk.games[p.t] || []).forEach((d) => { const dt = h.wk.dates ? h.wk.dates[d] : null; if (d >= h.from && !p.ir && avail(p, dt)) t += effAvg(wt(p), K, dt) * p.prob; })); return t; };
  const ranked = myR.filter((p) => !p.ir).sort((a, b) => effAvg(wt(b), K) - effAvg(wt(a), K));
  const autoProt = new Set(ranked.slice(0, protectTop).map((p) => p.id));
  const protectedIds = new Set([...autoProt, ...myR.filter((p) => p.keep).map((p) => p.id)]);
  const cnt = { F: 0, D: 0, G: 0 }; myR.forEach((p) => { if (!p.ir) cnt[p.p]++; });
  const keepsMins = (d, f) => d.p === f.p || cnt[d.p] - 1 >= mins[d.p];
  const canDrop = (d, f) => !d.ir && !protectedIds.has(d.id) && keepsMins(d, f);
  const inTab = (f) => pos === "all" || (pos === "sk" ? f.p !== "G" : f.p === pos);
  const base = lineupAware ? total(myR) : 0;
  const pool = fas
    .filter((f) => f.prob > 0 && (f.proj !== false || f.gp > 0) && inTab(f) && f.n.toLowerCase().includes(q))
    .map((f) => ({ f, raw: rawPts(f) })).filter((x) => x.raw > 0)
    .sort((a, b) => b.raw - a.raw).slice(0, lineupAware ? o.pool || 120 : 500);
  const res = [];
  pool.forEach(({ f, raw }) => {
    let best = null;
    myR.forEach((d) => {
      if (!canDrop(d, f)) return;
      const gain = lineupAware ? total([...myR.filter((x) => x.id !== d.id), { ...f, ft: s.me }]) - base : raw - rawPts(d);
      if (!best || gain > best.gain) best = { gain, d };
    });
    if (best) res.push({ f, ...best });
  });
  res.sort((a, b) => b.gain - a.gain);
  return { res, total, gamesIn, rawPts, autoProt, protectedIds, cnt, mins, keepsMins, lineupAware, myR, fas, K, gw, protectTop };
}

// ---------- Trade analyzer ----------
const rosRaw = (p, K) => {
  if (p.ir && !effBack(p).d) return 0;
  const t = todayISO(); let v = 0;
  (SCHED[p.t] ? [...SCHED[p.t]] : []).forEach((d) => { if (d >= t) v += effAvg(p, K, d) * p.prob * avail(p, d); });
  return v;
};
const horizonTotal = (roster, s, n) => {
  let t = 0;
  s.weeks.slice(s.wk, s.wk + n).forEach((w, i) => { const dw = deriveWeek(w, s.autoDone); t += weekProj(roster, dw, s.blend, i === 0 ? dw.done : 0).total; });
  return t;
};
function TradeAnalyzer({ s }) {
  const K = s.blend;
  const others = s.teams.filter((t) => t.id !== s.me);
  const [partner, setPartner] = useState((others[0] || {}).id || "");
  const [give, setGive] = useState([]); const [get, setGet] = useState([]);
  const nm = (id) => (s.teams.find((t) => t.id === id) || {}).name || "";
  const mine = s.players.filter((p) => p.ft === s.me), theirs = s.players.filter((p) => p.ft === partner);
  const order = { F: 0, D: 1, G: 2 };
  const vals = useMemo(() => { const o = {}; [...mine, ...theirs].forEach((p) => (o[p.id] = rosRaw(p, K))); return o; }, [s.players, partner, K]);
  const toggle = (arr, set, id) => set(arr.includes(id) ? arr.filter((x) => x !== id) : [...arr, id]);
  const G = mine.filter((p) => give.includes(p.id)), R = theirs.filter((p) => get.includes(p.id));
  const ready = G.length > 0 && R.length > 0;
  const res = useMemo(() => {
    if (!ready) return null;
    const myAfter = [...mine.filter((p) => !give.includes(p.id)), ...R.map((p) => ({ ...p, ft: s.me }))];
    const thAfter = [...theirs.filter((p) => !get.includes(p.id)), ...G.map((p) => ({ ...p, ft: partner }))];
    const n4 = 4, nR = s.weeks.length - s.wk;
    return {
      my4: horizonTotal(myAfter, s, n4) - horizonTotal(mine, s, n4), myR: horizonTotal(myAfter, s, nR) - horizonTotal(mine, s, nR),
      th4: horizonTotal(thAfter, s, n4) - horizonTotal(theirs, s, n4), thR: horizonTotal(thAfter, s, nR) - horizonTotal(theirs, s, nR),
      myAfter, thAfter,
    };
  }, [ready, give.join(), get.join(), partner, s.players, s.wk]);
  const vGive = G.reduce((a, p) => a + (vals[p.id] || 0), 0), vGet = R.reduce((a, p) => a + (vals[p.id] || 0), 0);
  const edge = vGive > 0 ? (vGet - vGive) / vGive : 0;
  const mins = { F: s.minF ?? 10, D: s.minD ?? 5, G: s.minGo ?? 2 };
  const counts = (r) => { const c = { F: 0, D: 0, G: 0 }; r.forEach((p) => { if (!p.ir) c[p.p]++; }); return c; };
  const verdict = !ready ? null : Math.abs(edge) <= 0.1 ? ["Fair trade", "bg-green-100 text-green-800", "Values are within 10% — should pass a league vote."] : edge > 0.25 ? ["Lopsided in your favour", "bg-amber-100 text-amber-800", "You gain a lot more value — other managers may veto (4 votes needed). Consider adding a sweetener."] : edge > 0.1 ? ["Slightly in your favour", "bg-green-100 text-green-800", "A reasonable ask; most leagues let this through."] : edge < -0.25 ? ["Bad for you", "bg-red-100 text-red-800", "You give up much more value than you get back."] : ["Slightly against you", "bg-amber-100 text-amber-800", "Only worth it if it fixes a position need or wins you this week."];
  const Pick = ({ list, sel, set, title }) => (
    <div className={box}>
      <div className="font-semibold mb-2">{title}</div>
      {list.sort((a, b) => order[a.p] - order[b.p] || (vals[b.id] || 0) - (vals[a.id] || 0)).map((p) => (
        <label key={p.id} className={"flex items-center gap-2 py-0.5 text-sm " + (sel.includes(p.id) ? "bg-blue-50 rounded" : "")}>
          <input type="checkbox" checked={sel.includes(p.id)} onChange={() => toggle(sel, set, p.id)} />
          <span className="flex-1">{p.n} <span className="text-xs text-slate-400">{p.p} · {p.t}{p.ir ? " · IR" : ""}</span></span>
          <span className="text-xs text-slate-500">{f1(vals[p.id])} ROS</span>
        </label>
      ))}
    </div>
  );
  const Bal = ({ before, after, label, check }) => {
    const b = counts(before), a = counts(after);
    return (
      <div className="text-sm">{label}: {["F", "D", "G"].map((k) => (
        <span key={k} className={"mr-3 " + (check && a[k] < mins[k] ? "text-red-600 font-semibold" : a[k] !== b[k] ? "text-blue-700" : "")}>{k} {b[k]}→{a[k]}{check && a[k] < mins[k] ? " ⚠" : ""}</span>
      ))}<span className="text-xs text-slate-500">({after.filter((p) => !p.ir).length}/22 active)</span></div>
    );
  };
  const Delta = ({ v }) => <span className={"font-semibold " + (v >= 0 ? "text-green-700" : "text-red-700")}>{v >= 0 ? "+" : ""}{f1(v)}</span>;
  return (
    <div>
      <div className={box}>
        <div className="font-semibold mb-2">Trade analyzer</div>
        <div className="flex flex-wrap gap-2 items-center">
          <span>Trade with</span>
          <select className={inp} value={partner} onChange={(e) => { setPartner(e.target.value); setGet([]); }}>{others.map((t) => <option key={t.id} value={t.id}>{t.name}</option>)}</select>
          <button className="text-xs text-slate-500 underline ml-2" onClick={() => { setGive([]); setGet([]); }}>clear</button>
        </div>
        <div className="text-xs text-slate-500 mt-2">Tick the players you'd give and the players you'd get. "ROS" = projected fantasy points for the rest of the season (games left × projection, including injuries and return dates).</div>
      </div>
      <div className="grid md:grid-cols-2 gap-4">
        <Pick list={[...mine]} sel={give} set={setGive} title={`You give (${nm(s.me)})`} />
        <Pick list={[...theirs]} sel={get} set={setGet} title={`You get (${nm(partner)})`} />
      </div>
      {ready && res && (
        <div className={box}>
          <div className="flex flex-wrap items-center gap-3 mb-3">
            <span className={"px-3 py-1 rounded-full font-semibold " + verdict[1]}>{verdict[0]}</span>
            <span className="text-sm text-slate-600">{verdict[2]}</span>
          </div>
          <div className="grid md:grid-cols-3 gap-3 mb-4">
            <Card label="Player value (rest of season)" value={`${f1(vGive)} → ${f1(vGet)}`} sub={`You ${edge >= 0 ? "gain" : "lose"} ${Math.abs(edge * 100).toFixed(0)}% in raw player value`} />
            <Card label={`${nm(s.me)} — lineup impact`} value={<span><Delta v={res.myR} /> ROS</span>} sub={<span>Next 4 weeks: <Delta v={res.my4} /> · counts only games that fit your lineup</span>} />
            <Card label={`${nm(partner)} — lineup impact`} value={<span><Delta v={res.thR} /> ROS</span>} sub={<span>Next 4 weeks: <Delta v={res.th4} /></span>} />
          </div>
          <div className="space-y-1">
            <Bal before={mine} after={res.myAfter} label={`${nm(s.me)} roster`} check />
            <Bal before={theirs} after={res.thAfter} label={`${nm(partner)} roster`} />
          </div>
          <div className="text-xs text-slate-500 mt-3">
            {res.myAfter.filter((p) => !p.ir).length > 22 ? "⚠ You'd have more than 22 active players — you'll need to drop someone (the lineup impact assumes you keep everyone). " : ""}
            "Lineup impact" can differ from raw value: getting two good players for one great one can still lower your score if they'd sit on your bench. The best trades are green for you in lineup impact and close to fair in raw value.
          </div>
        </div>
      )}
    </div>
  );
}

function Matchup({ s, setS, wk, setWk }) {
  const K = s.blend, done = wk.done || 0;
  const pairOpp = oppOf(wk, s.me);
  const opp = pairOpp || s.opp;
  const nm = (id) => (s.teams.find((t) => t.id === id) || {}).name || "?";
  const A = weekProj(s.players.filter((p) => p.ft === s.me), wk, K, done), B = weekProj(s.players.filter((p) => p.ft === opp), wk, K, done);
  const aA = +((wk.act || {})[s.me]) || 0, aB = +((wk.act || {})[opp]) || 0;
  const fa = aA + A.total, fb = aB + B.total, margin = fa - fb;
  const final = done >= wk.days.length;
  let run = aA - aB;

function League({ s, wk, setWk }) {
  const K = s.blend, done = wk.done || 0;
  const nm = (id) => (s.teams.find((t) => t.id === id) || {}).name || "?";
  const P = {};
  s.teams.forEach((t) => { const r = weekProj(s.players.filter((p) => p.ft === t.id), wk, K, done); const a = +((wk.act || {})[t.id]) || 0; P[t.id] = { ...r, a, fin: a + r.total }; });
  const pairs = (wk.pairs || []).filter((p) => p[0] && p[1] && P[p[0]] && P[p[1]]);
  const rec = {}; s.teams.forEach((t) => (rec[t.id] = { w: 0, l: 0, t: 0, pf: 0 }));
  s.weeks.forEach((w) => {
    const len = (w.dates || w.days || []).length;
    if (!len || effDone(w, s.autoDone) < len) return;
    (w.pairs || []).forEach(([a, b]) => {
      if (!rec[a] || !rec[b]) return;
      const x = +((w.act || {})[a]) || 0, y = +((w.act || {})[b]) || 0;
      if (!x && !y) return;
      rec[a].pf += x; rec[b].pf += y;
      if (x > y) { rec[a].w++; rec[b].l++; } else if (y > x) { rec[b].w++; rec[a].l++; } else { rec[a].t++; rec[b].t++; }
    });
  });
  const stand = s.teams.map((t) => ({ t, ...rec[t.id] })).sort((a, b) => b.w - a.w || b.pf - a.pf);
  const setAct = (id, v) => setWk((w) => ({ act: { ...(w.act || {}), [id]: v } }));
  return (
    <div>
      <LiveBar s={s} wk={wk} setWk={setWk} ids={[]} nm={nm} />
      <div className={box}>

              <span className={m >= 0 ? "font-semibold" : ""}>{nm(a)} {f1(P[a].fin)}</span>
              <span className="text-slate-400">vs</span>
              <span className={m < 0 ? "font-semibold" : ""}>{f1(P[b].fin)} {nm(b)}</span>
              <span className="text-xs text-slate-500 w-full">{done >= wk.days.length ? "Final" : "Projected"} margin: {m >= 0 ? nm(a) : nm(b)} by {f1(Math.abs(m))}</span>
            </div>
          );
        })}
      </div>
      <div className="bg-white rounded-xl border border-slate-200 overflow-x-auto mb-4">
        <div className="font-semibold p-3">All teams this week</div>
        <table className="w-full text-sm">
          <thead className="bg-slate-50 text-left"><tr>{["Team", "Actual so far", "Remaining proj", "Projected final", "Usable games left", "Wasted"].map((h) => <th key={h} className="px-3 py-2">{h}</th>)}</tr></thead>
          <tbody>
            {s.teams.map((t) => ({ t, ...P[t.id] })).sort((a, b) => b.fin - a.fin).map((r) => (
              <tr key={r.t.id} className={"border-t border-slate-100 " + (r.t.id === s.me ? "bg-blue-50 font-semibold" : "")}>
                <td className="px-3 py-2">{r.t.name}</td>

              </tr>

        </table>
      </div>

function Bulk({ s, setS }) {
  const [mode, setMode] = useState("team"); const [txt, setTxt] = useState(""); const [msg, setMsg] = useState("");
  const help = {
    add: "Name | NHL | Pos | ProjAvg | Play% | Fantasy team (or FA)   e.g.  Connor Bedard | CHI | F | 9.5 | 100 | FA",
    avg: "Name | ProjAvg   e.g.  Viktor Arvidsson | 7.3",
    season: "Name | GP | Season total pts   e.g.  Nathan MacKinnon | 5 | 82.4",
    play: "Name | Play% (goalies: start %)   e.g.  Kevin Lankinen | 85",
    team: "Name | Fantasy team (or FA)   e.g.  Colton Parayko | FA",
  };
  const run = () => {
    const lines = txt.split("\n").map((l) => l.trim()).filter(Boolean);
    let players = [...s.players]; let upd = 0, add = 0; const miss = [];
    const find = (n) => players.findIndex((p) => p.n.toLowerCase() === n.toLowerCase());
    const teamId = (x) => { const v = (x || "").trim().toLowerCase(); if (!v || v === "fa" || v === "free agent") return "fa"; const t = s.teams.find((t) => t.name.toLowerCase() === v || t.id === v); return t ? t.id : null; };
    lines.forEach((l, k) => {
      const f = l.split(/\t|\|/).map((x) => x.trim());
      if (f.length < 2) { miss.push(l); return; }
      const i = find(f[0]);
      if (mode === "add") {
        const tid = teamId(f[5]); const pos = (f[2] || "F").toUpperCase(); const nhl = (f[1] || "").toUpperCase();
        if (tid === null || !NHL.includes(nhl) || !["F", "D", "G"].includes(pos)) { miss.push(l); return; }
        const rec = { n: f[0], t: nhl, p: pos, avg: parseFloat(f[3]) || 0, prob: f[4] === undefined || f[4] === "" ? 1 : (parseFloat(f[4]) || 0) / 100, ft: tid, est: false };
        if (i >= 0) { players[i] = { ...players[i], ...rec }; upd++; } else { players.push({ id: "p" + Date.now() + "_" + k, ir: false, gp: 0, tot: 0, ...rec }); add++; }
        return;
      }
      if (i < 0) { miss.push(f[0]); return; }
      if (mode === "avg") players[i] = { ...players[i], avg: parseFloat(f[1]) || 0, est: false };
      if (mode === "season") players[i] = { ...players[i], gp: parseInt(f[1]) || 0, tot: parseFloat(f[2]) || 0 };
      if (mode === "play") players[i] = { ...players[i], prob: Math.max(0, Math.min(100, parseFloat(f[1]) || 0)) / 100 };
      if (mode === "team") { const tid = teamId(f[1]); if (tid === null) { miss.push(l); return; } players[i] = { ...players[i], ft: tid, ir: false }; }
      upd++;
    });
    setS({ ...s, players });
    setMsg(`Updated ${upd}, added ${add}.` + (miss.length ? ` Not matched (${miss.length}): ${miss.slice(0, 8).join("; ")}${miss.length > 8 ? "…" : ""}` : ""));
  };
  return (
    <div className={box}>
      <div className="font-semibold mb-2">Bulk update (one player per line, fields separated by | or a tab)</div>
      <div className="flex flex-wrap gap-2 items-center mb-2">
        <select className={inp} value={mode} onChange={(e) => setMode(e.target.value)}>
          <option value="team">Move players (adds, drops, trades)</option>
          <option value="play">Update injuries / goalie start %</option>
          <option value="season">Update season GP & total</option>
          <option value="avg">Update projected averages</option>
          <option value="add">Add or replace full players</option>
        </select>
        <button className="bg-blue-600 text-white rounded px-3 py-1" onClick={run}>Apply</button>
      </div>
      <div className="text-xs text-slate-500 mb-2">Format: {help[mode]}</div>
      <textarea className={inp + " w-full h-32 font-mono text-xs"} value={txt} onChange={(e) => setTxt(e.target.value)} placeholder={help[mode]} />
      {msg && <div className="text-sm mt-2">{msg}</div>}
      <div className="text-xs text-slate-500 mt-2">The next ESPN sync overwrites manual roster moves with ESPN's real rosters.</div>
    </div>
  );
}

function InjuryPanel({ s, setS }) {
  const [showFA, setShowFA] = useState(false);
  const nm = (id) => (id === "fa" ? "Free agent" : (s.teams.find((t) => t.id === id) || {}).name || "");
  const list = s.players.filter((p) => (p.status && p.status !== "ACTIVE") || p.back || autoInj(p)).filter((p) => showFA || p.ft !== "fa").sort((a, b) => (a.ft === s.me ? 0 : 1) - (b.ft === s.me ? 0 : 1) || nm(a.ft).localeCompare(nm(b.ft)));
  const upd = (id, back) => setS((st) => ({ ...st, players: st.players.map((p) => (p.id === id ? { ...p, back } : p)) }));
  const today = todayISO();
  return (
    <div className={box}>
      <div className="flex items-center gap-3 mb-2">
        <div className="font-semibold">Injuries & return dates</div>
        <label className="text-xs flex items-center gap-1 ml-auto"><input type="checkbox" checked={showFA} onChange={(e) => setShowFA(e.target.checked)} /> include free agents</label>
      </div>
      <div className="text-xs text-slate-500 mb-2">Before the "Back on" date a player scores 0; from that date he counts as healthy even if ESPN still lists him out. Blank = out until ESPN clears him.</div>
      <div className="overflow-x-auto">
        <table className="w-full text-sm">
          <thead className="bg-slate-50 text-left"><tr>{["Player", "NHL", "Fantasy team", "ESPN status", "Back on", ""].map((h) => <th key={h} className="px-2 py-1">{h}</th>)}</tr></thead>
          <tbody>
            {list.map((p) => (
              <tr key={p.id} className={"border-t border-slate-100 " + (p.ft === s.me ? "bg-blue-50" : "")}>
                <td className="px-2 py-1">{p.n}</td><td className="px-2 py-1">{p.t}</td><td className="px-2 py-1">{nm(p.ft)}</td>
                <td className="px-2 py-1 text-red-600 text-xs">{(p.status || "").replace(/_/g, " ")}</td>
                <td className="px-2 py-1">{(() => { const eb = effBack(p); const a = autoInj(p); return (
                  <div>
                    <input type="date" className={inp} value={eb.d} onChange={(e) => upd(p.id, e.target.value)} />
                    {eb.src ? <span className={"text-xs ml-2 " + (eb.src === "you" ? "text-blue-700 font-semibold" : "text-slate-500")}>{eb.src === "you" ? "set by you" : "auto: " + eb.src}</span> : null}
                    {eb.d && eb.d <= today ? <span className="text-green-700 text-xs ml-2">{today < addDays(eb.d, 7) ? "back (easing in, 90%)" : "available"}</span> : null}
                    {a && a.note ? <div className="text-xs text-slate-500 mt-0.5 max-w-md">{a.type ? a.type + " — " : ""}{a.note}</div> : null}
                  </div>
                ); })()}</td>
                <td className="px-2 py-1">{p.back ? <button className="text-xs text-red-600" onClick={() => upd(p.id, "")}>Clear</button> : null}</td>
              </tr>
            ))}
            {list.length === 0 && <tr><td className="px-2 py-2 text-slate-400">No injured players.</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function Rosters(props) {
  const { s } = props;
  const [sub, setSub] = useState("mine");
  const subs = [["mine", "My team"], ["opp", "Opposing teams"], ["fa", "Free agents"], ["inj", "Injuries & return dates"], ["bulk", "Bulk update"]];
  return (
    <div>
      <div className="mb-4"><Pills items={subs} value={sub} onChange={setSub} /></div>
      {sub === "mine" && <RosterTable {...props} team={s.me} />}
      {sub === "opp" && <OppRosters {...props} />}
      {sub === "fa" && <RosterTable {...props} team="fa" />}
      {sub === "inj" && <InjuryPanel {...props} />}
      {sub === "bulk" && <div><Bulk s={props.s} setS={props.setS} /><AddOne {...props} /></div>}
    </div>
  );
}
function OppRosters(props) {
  const { s } = props;
  const opps = s.teams.filter((t) => t.id !== s.me);
  const [tm, setTm] = useState("all");
  return (
    <div>
      <div className="flex gap-2 items-center mb-3 text-sm">
        <span>Show</span>
        <select className={inp} value={tm} onChange={(e) => setTm(e.target.value)}>
          <option value="all">All opposing teams</option>
          {opps.map((t) => <option key={t.id} value={t.id}>{t.name}</option>)}
        </select>
      </div>
      {(tm === "all" ? opps : opps.filter((t) => t.id === tm)).map((t) => <RosterTable key={t.id} {...props} team={t.id} />)}
    </div>
  );
}
function RosterTable({ s, setS, wk, team }) {
  const [q, setQ] = useState("");
  const upd = (id, patch) => setS((st) => ({ ...st, players: st.players.map((p) => (p.id === id ? { ...p, ...patch } : p)) }));
  const del = (id) => setS((st) => ({ ...st, players: st.players.filter((p) => p.id !== id) }));
  const order = { F: 0, D: 1, G: 2 };
  const all = s.players.filter((p) => p.ft === team);
  const list = all.filter((p) => p.n.toLowerCase().includes(q.toLowerCase())).sort((a, b) => order[a.p] - order[b.p] || b.avg - a.avg).slice(0, team === "fa" ? 100 : 999);
  const cnt = { F: 0, D: 0, G: 0 }; all.forEach((p) => { if (!p.ir) cnt[p.p]++; });
  const active = all.filter((p) => !p.ir).length;
  const mins = { F: s.minF ?? 10, D: s.minD ?? 5, G: s.minGo ?? 2 };
  const low = team === s.me && (cnt.F < mins.F || cnt.D < mins.D || cnt.G < mins.G);
  const nm = team === "fa" ? "Free agents" : (s.teams.find((t) => t.id === team) || {}).name;
  return (
    <div className="bg-white rounded-xl border border-slate-200 mb-4">
      <div className="flex flex-wrap items-center gap-3 p-3">
        <div className="font-semibold">{nm}</div>
        {team !== "fa" && <span className={"text-xs " + (low ? "text-red-600 font-semibold" : "text-slate-500")}>{active}/22 active · F {cnt.F} · D {cnt.D} · G {cnt.G}{all.length - active ? ` · ${all.length - active} IR` : ""}{low ? " — below your minimums" : ""}</span>}
        <input className={inp + " ml-auto"} placeholder="Search" value={q} onChange={(e) => setQ(e.target.value)} />
      </div>
      <div className="overflow-x-auto">
        <table className="w-full text-sm">
          <thead className="bg-slate-50 text-left"><tr>{["Player", "NHL", "Pos", "Proj avg", "GP", "Season pts", "Play %", "IR", "Back on", "Games", "Fantasy team", ""].map((h) => <th key={h} className="px-2 py-2">{h}</th>)}</tr></thead>
          <tbody>
            {list.map((p) => (
              <tr key={p.id} className="border-t border-slate-100">
                <td className="px-2 py-1"><input className={inp + " w-44"} value={p.n} onChange={(e) => upd(p.id, { n: e.target.value })} />{p.status && p.status !== "ACTIVE" ? <span className="text-red-600 text-xs ml-1">{p.status.replace(/_/g, " ")}</span> : ""}</td>
                <td className="px-2 py-1"><select className={inp} value={p.t} onChange={(e) => upd(p.id, { t: e.target.value })}>{NHL.map((t) => <option key={t}>{t}</option>)}</select></td>
                <td className="px-2 py-1"><select className={inp} value={p.p} onChange={(e) => upd(p.id, { p: e.target.value })}><option>F</option><option>D</option><option>G</option></select></td>
                <td className="px-2 py-1"><input type="number" step="0.1" className={inp + " w-20"} value={p.avg} onChange={(e) => upd(p.id, { avg: parseFloat(e.target.value) || 0, est: false })} /></td>
                <td className="px-2 py-1"><input type="number" className={inp + " w-16"} value={p.gp || 0} onChange={(e) => upd(p.id, { gp: parseInt(e.target.value) || 0 })} /></td>
                <td className="px-2 py-1"><input type="number" step="0.1" className={inp + " w-20"} value={p.tot || 0} onChange={(e) => upd(p.id, { tot: parseFloat(e.target.value) || 0 })} /></td>
                <td className="px-2 py-1"><input type="number" min="0" max="100" className={inp + " w-16"} value={Math.round(p.prob * 100)} onChange={(e) => upd(p.id, { prob: Math.max(0, Math.min(100, parseFloat(e.target.value) || 0)) / 100 })} /></td>
                <td className="px-2 py-1"><input type="checkbox" checked={!!p.ir} onChange={(e) => upd(p.id, { ir: e.target.checked })} /></td>
                <td className="px-2 py-1"><input type="date" className={inp} value={p.back || ""} onChange={(e) => upd(p.id, { back: e.target.value })} /></td>
                <td className="px-2 py-1">{gms(wk, p.t)}</td>
                <td className="px-2 py-1"><select className={inp} value={p.ft} onChange={(e) => upd(p.id, { ft: e.target.value, ir: false })}>{s.teams.map((t) => <option key={t.id} value={t.id}>{t.name}</option>)}<option value="fa">Free agent</option></select></td>
                <td className="px-2 py-1"><button className="text-red-600 text-xs" onClick={() => del(p.id)}>Delete</button></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      {team === "fa" && all.length > 100 && <div className="text-xs text-slate-500 p-3">Showing 100 of {all.length} free agents — use search to find others.</div>}
    </div>
  );
}
function AddOne({ s, setS }) {
  const [nw, setNw] = useState({ n: "", t: "ANA", p: "F", avg: 6, prob: 100, ft: s.me });
  const addP = () => {
    if (!nw.n.trim()) return;
    setS((st) => ({ ...st, players: [...st.players, { id: "p" + Date.now(), n: nw.n.trim(), t: nw.t, p: nw.p, avg: +nw.avg, prob: +nw.prob / 100, ft: nw.ft, ir: false, est: false, gp: 0, tot: 0 }] }));
    setNw({ ...nw, n: "" });
  };
  return (
    <div className={box}>
      <div className="font-semibold mb-2">Add one player</div>
      <div className="flex flex-wrap gap-2 items-center">
        <input className={inp} placeholder="Name" value={nw.n} onChange={(e) => setNw({ ...nw, n: e.target.value })} />
        <select className={inp} value={nw.t} onChange={(e) => setNw({ ...nw, t: e.target.value })}>{NHL.map((t) => <option key={t}>{t}</option>)}</select>
        <select className={inp} value={nw.p} onChange={(e) => setNw({ ...nw, p: e.target.value })}><option>F</option><option>D</option><option>G</option></select>
        <label>Avg <input type="number" step="0.1" className={inp + " w-20"} value={nw.avg} onChange={(e) => setNw({ ...nw, avg: e.target.value })} /></label>
        <label>Play/start % <input type="number" className={inp + " w-16"} value={nw.prob} onChange={(e) => setNw({ ...nw, prob: e.target.value })} /></label>
        <select className={inp} value={nw.ft} onChange={(e) => setNw({ ...nw, ft: e.target.value })}>{s.teams.map((t) => <option key={t.id} value={t.id}>{t.name}</option>)}<option value="fa">Free agent</option></select>
        <button className="bg-blue-600 text-white rounded px-3 py-1" onClick={addP}>Add</button>
      </div>
    </div>
  );
}

function Schedule({ s, setS, wk, setWk }) {
  const [start, setStart] = useState(""); const [len, setLen] = useState(7);
  useEffect(() => { setStart((wk.dates && wk.dates[0]) || ""); setLen((wk.dates && wk.dates.length) || 7); }, [s.wk]);
  const relabel = (ws) => ws.map((w, i) => (w.dates && w.dates.length ? { ...w, label: lab(i, w.dates) } : w));
  const applyDates = () => { if (!start) return; const dates = [...Array(Math.max(1, +len || 1))].map((_, k) => addDays(start, k)); setS((st) => ({ ...st, weeks: relabel(st.weeks.map((w, i) => (i === st.wk ? { ...w, dates } : w))) })); };
  const mergeNext = () => {
    if (s.wk >= s.weeks.length - 1 || !confirm("Merge this week with the next one (e.g. for the All-Star break)?")) return;
    setS((st) => { const ws = [...st.weeks]; const a = ws[st.wk], b = ws[st.wk + 1]; ws[st.wk] = { ...a, dates: [...(a.dates || []), ...(b.dates || [])] }; ws.splice(st.wk + 1, 1); return { ...st, weeks: relabel(ws) }; });
  };
  const resetWeeks = () => { if (confirm("Reset all weeks to the default Monday–Sunday layout?")) setS((st) => ({ ...st, weeks: defaultWeeks(), wk: 0 })); };
  const pairs = [...(wk.pairs || [])]; while (pairs.length < 5) pairs.push(["", ""]);
  const setPair = (i, j, v) => setWk((w) => { const p = [...(w.pairs || [])].map((x) => [...x]); while (p.length < 5) p.push(["", ""]); p[i][j] = v; return { pairs: p }; });
  const perDay = wk.days.map((_, d) => NHL.filter((t) => (wk.games[t] || []).includes(d)).length / 2);
  return (
    <div>
      <div className={box}>
        <div className="font-semibold mb-2">{wk.label}</div>
        <div className="text-xs text-slate-500 mb-2">The full NHL schedule is built in. Matchups come from ESPN on every sync.</div>
        <div className="flex flex-wrap gap-2 items-center">
          <label>Starts <input type="date" className={inp} value={start} onChange={(e) => setStart(e.target.value)} /></label>
          <label>Days <input type="number" min="1" max="21" className={inp + " w-16"} value={len} onChange={(e) => setLen(e.target.value)} /></label>
          <button className="bg-slate-800 text-white rounded px-3 py-1" onClick={applyDates}>Update week dates</button>
          <button className="bg-slate-200 rounded px-3 py-1" onClick={mergeNext}>Merge with next week</button>
          <button className="text-red-600 ml-auto" onClick={resetWeeks}>Reset all weeks</button>
        </div>
      </div>
      <div className={box}>
        <div className="font-semibold mb-2">League matchups this week</div>
        {pairs.slice(0, 5).map((p, i) => (
          <div key={i} className="flex gap-2 items-center mb-1">
            <select className={inp} value={p[0]} onChange={(e) => setPair(i, 0, e.target.value)}><option value="">—</option>{s.teams.map((t) => <option key={t.id} value={t.id}>{t.name}</option>)}</select>
            <span>vs</span>
            <select className={inp} value={p[1]} onChange={(e) => setPair(i, 1, e.target.value)}><option value="">—</option>{s.teams.map((t) => <option key={t.id} value={t.id}>{t.name}</option>)}</select>
          </div>
        ))}
      </div>
      <div className="bg-white rounded-xl border border-slate-200 overflow-x-auto">
        <table className="text-sm w-full">
          <thead className="bg-slate-50"><tr><th className="px-2 py-2 text-left">Team</th>{wk.days.map((d, i) => <th key={i} className="px-2 py-2">{d}</th>)}<th className="px-2 py-2">Games</th></tr></thead>
          <tbody>
            {NHL.map((t) => (
              <tr key={t} className="border-t border-slate-100">
                <td className="px-2 py-1 font-medium">{t}</td>
                {wk.days.map((_, d) => { const on = (wk.games[t] || []).includes(d); return <td key={d} className="px-1 py-1 text-center"><span className={"inline-block w-8 h-5 rounded " + (on ? "bg-blue-600" : "bg-slate-100")}></span></td>; })}
                <td className={"px-2 py-1 text-center font-semibold " + (gms(wk, t) >= 4 ? "text-green-700" : gms(wk, t) <= 1 ? "text-red-600" : "")}>{gms(wk, t)}</td>
              </tr>
            ))}
            <tr className="border-t-2 border-slate-300 bg-slate-50"><td className="px-2 py-2 font-semibold">Games/day</td>{perDay.map((n, i) => <td key={i} className={"text-center font-semibold " + (n % 1 ? "text-red-600" : n <= 4 ? "text-green-700" : "")}>{n}</td>)}<td></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  );
}

function Settings({ s, setS }) {
  const E = window.ESPN_DATA;
  const [io, setIo] = useState("");
  const Sg = E && E.signals;
  return (
    <div className="grid md:grid-cols-2 gap-4">
      <div className={box + " md:col-span-2"}>
        <div className="font-semibold mb-2">ESPN sync & data sources</div>
        {E ? <div>ESPN file: <b>{E.leagueName || "your league"}</b> · created {fmtTime(E.generated)} · {(E.teams || []).length} teams · {(E.players || []).length} players</div>
          : <div className="text-red-600">No espn-data.js found next to this file. Run espn_sync.py, then refresh.</div>}
        <ul className="text-xs text-slate-600 mt-2 space-y-1">
          <li>GM model: {E && E.model ? `✓ ${Object.keys(E.model.base || {}).length} players projected (${fmtTime(E.model.asof)})` : "not loaded (add gm_model.py)"}</li>
          <li>Recent form (NHL stats, last 14 days): {Sg && Sg.recent ? `✓ ${Object.keys(Sg.recent).length} players` : "not loaded"}</li>
          <li>PP1 units (Daily Faceoff): {Sg && Sg.pp1 ? `✓ ${Object.keys(Sg.pp1.on || {}).length} players on PP1, checked ${Sg.pp1.asof}` : "not loaded"}</li>
          <li>News (ESPN): {Sg && Sg.news ? `✓ ${Object.keys(Sg.news).length} players mentioned` : "not loaded"}</li>
          <li>Starting goalies (Daily Faceoff): {E && E.goalies ? `✓ ${Object.keys(E.goalies).length} days` : "not loaded"}</li>
        </ul>
        {E && <button className="bg-blue-600 text-white rounded px-3 py-1 mt-2" onClick={() => { try { setS(applyESPN(s, E)); } catch (e) { alert(e.message); } }}>Apply ESPN data again</button>}
      </div>
      <div className={box}>
        <div className="font-semibold mb-2">Projection vs real results</div>
        <label className="flex items-center gap-2">ESPN projection weight (games)
          <input type="number" min="0" className={inp + " w-20"} value={s.blend} onChange={(e) => setS({ ...s, blend: Math.max(0, parseFloat(e.target.value) || 0) })} />
        </label>
        <div className="text-xs text-slate-500 mt-2">Blends ESPN's projection with season results. The GM model does its own blending.</div>
        <label className="flex items-center gap-2 mt-3"><input type="checkbox" checked={s.autoDone} onChange={(e) => setS({ ...s, autoDone: e.target.checked })} /> Count completed days automatically</label>
      </div>
      <div className={box}>
        <div className="font-semibold mb-2">Team names</div>
        {s.teams.map((t) => (
          <div key={t.id} className="flex gap-2 mb-1 items-center">
            <input className={inp + " flex-1"} value={t.name} onChange={(e) => setS({ ...s, teams: s.teams.map((x) => (x.id === t.id ? { ...x, name: e.target.value } : x)) })} />
            {t.id === s.me && <span className="text-xs text-blue-600">me</span>}
          </div>
        ))}
      </div>
      <div className={box + " md:col-span-2"}>
        <div className="font-semibold mb-2">Backup & restore</div>
        <div className="flex gap-2 mb-2">
          <button className="bg-slate-800 text-white rounded px-3 py-1" onClick={() => setIo(JSON.stringify(s))}>Export</button>
          <button className="bg-blue-600 text-white rounded px-3 py-1" onClick={() => { try { const v = JSON.parse(io); if (v.players && v.weeks) setS(migrate(v)); } catch (e) { alert("Invalid data"); } }}>Import</button>
          <button className="text-red-600 ml-auto" onClick={() => { if (confirm("Reset everything? Export a backup first!")) setS(init()); }}>Reset all</button>
        </div>
        <textarea className={inp + " w-full h-28 font-mono text-xs"} value={io} onChange={(e) => setIo(e.target.value)} placeholder="Export copies your whole league here; paste a backup and press Import to restore." />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
