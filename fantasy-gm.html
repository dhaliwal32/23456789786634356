}

  const aA = +((wk.act || {})[s.me]) || 0, aB = +((wk.act || {})[opp]) || 0;
  const fa = aA + A.total, fb = aB + B.total, margin = fa - fb;
  const today = todayISO();
  const dates = wk.dates || [];
  const di = dates.findIndex((d) => d >= today);
  const dday = di >= 0 ? dates[di] : null;
  const L = di >= 0 ? dayLineup(mine, wk, di, K) : null, OL = di >= 0 ? dayLineup(theirs, wk, di, K) : null;
  const checks = [];
  if (L) {
    mine.forEach((p) => { if (!p.ir && (wk.games[p.t] || []).includes(di) && avail(p, dday) === 0) checks.push(["bad", `${p.n} (${p.t}) is out — keep him out of your lineup`]); });
    mine.filter((p) => p.p === "G" && !p.ir && (wk.games[p.t] || []).includes(di)).forEach((p) => {
      const g = gStart(p, dday);
      if (g.l === "not starting") checks.push(["bad", `${p.n} is not starting — use another goalie`]);
      else if (g.l === "✓ confirmed") checks.push(["good", `${p.n} confirmed starting`]);
      else checks.push(["warn", `${p.n}: ${g.l || "starter not announced yet"} — check before lock`]);
    });
    if (L.bench.length) checks.push(["warn", `More players than slots — ${L.bench.map((p) => p.n).join(", ")} would sit`]);
    if (L.empty > 0) checks.push(["warn", `${L.empty} empty slot${L.empty > 1 ? "s" : ""} — a streamer could fill ${L.empty > 1 ? "them" : "it"}`]);
  }
  const outNow = mine.filter((p) => { const b = effBack(p).d; return (b && b > today) || (!b && avail(p, today) === 0); });
  const moves = useMemo(() => computeMoves(s, { H: 1, pool: 40 }).res.filter((r) => r.gain >= (s.minGain ?? 3)).slice(0, 3), [s]);
  const sameDrop = moves.length > 1 && moves.every((r) => r.d.id === moves[0].d.id);
  const trend = s.players.filter((p) => p.ft === "fa" && p.prob > 0 && ((formRatio(p, K) || 0) >= 1.25 || (p.chg || 0) >= 5)).sort((a, b) => (b.chg || 0) - (a.chg || 0)).slice(0, 2);
  const hot = mine.filter((p) => !p.ir && (formRatio(p, K) || 0) >= 1.25);
  const cold = mine.filter((p) => { const r = formRatio(p, K); return !p.ir && r !== null && r <= 0.7; });
  const lastName = (n) => nrm(n).split(" ").pop();
  const allNews = mine.map((p) => { const all = sigOf(p).news || []; return { p, all, items: newsOf(p) }; }).sort((a, b) => (a.items.length ? NEWS_RANK[a.items[0].kind] : 9) - (b.items.length ? NEWS_RANK[b.items[0].kind] : 9));
  const news = allNews.filter((x) => x.items.length).slice(0, 5);
  const hidden = allNews.reduce((a, x) => a + x.all.length - x.items.length, 0);
  const pct = Math.max(6, Math.min(94, 50 + margin / 2));
  const dot = { bad: "text-red-600", warn: "text-amber-600", good: "text-green-700" };
  const daysLeft = dates.length - done;
  const Row = ({ children }) => <div className="flex items-center gap-3 py-2.5 border-t border-slate-100">{children}</div>;
  return (
    <div className="space-y-4">
      <div className="bg-white rounded-xl border border-slate-200 p-4">
        <div className="flex flex-wrap items-center gap-2 text-xs text-slate-500">
          <span className="uppercase tracking-wide">{wk.label}</span><span>·</span><span>{done >= dates.length ? "Final" : `${daysLeft} day${daysLeft === 1 ? "" : "s"} left`}</span>
          <button className="ml-auto text-blue-600" onClick={() => go("matchup")}>All matchups →</button>
        </div>
        <div className="grid grid-cols-[1fr_auto_1fr] gap-4 items-end mt-4">
          <div className="min-w-0"><div className="text-xs text-slate-500 truncate"><TL s={s} id={s.me} /></div><div className="text-4xl">{f1(fa)}</div><div className="text-xs text-slate-500">{f1(aA)} actual + {f1(A.total)} proj</div></div>
          <div className="text-sm text-slate-400 pb-7">vs</div>
          <div className="min-w-0 text-right"><div className="text-xs text-slate-500 truncate"><TL s={s} id={opp} /></div><div className="text-4xl">{f1(fb)}</div><div className="text-xs text-slate-500">{f1(aB)} actual + {f1(B.total)} proj</div></div>
        </div>
        <div className="h-1.5 rounded-full bg-slate-200 mt-5 overflow-hidden"><div className={"h-full rounded-full " + (margin >= 0 ? "bg-green-500" : "bg-red-500")} style={{ width: pct + "%" }}></div></div>
        <div className="flex flex-wrap items-baseline gap-2 mt-3 text-sm"><span className={"font-semibold " + (margin >= 0 ? "text-green-700" : "text-red-600")}>{margin >= 0 ? "Ahead" : "Behind"} by {f1(Math.abs(margin))}</span><span className="text-slate-500">projected · {wpTxt(winProb(A, B, aA, aB))} chance to win</span></div>{done < dates.length ? <StrategyLine p={winProb(A, B, aA, aB)} /> : null}
      </div>
      <div className="grid md:grid-cols-2 gap-4">
        <Section title={dday ? (dday === today ? "Tonight" : `Next game day · ${dayLabel(dday)}`) : "No games left this week"} sub={L ? `${L.start.length} of your players play · projected ${f1(L.total)} vs ${f1(OL.total)}` : ""} link={["Matchup", () => go("matchup")]}>
          {checks.length ? checks.map(([k, t], i) => <Row key={i}><span className={dot[k]}>●</span><span className="text-slate-700">{t}</span></Row>) : <div className="text-green-700">Lineup looks good.</div>}
        </Section>
        <Section title="Best moves this week" sub={sameDrop ? `All free up ${moves[0].d.n}'s spot` : ""} link={["All moves", () => go("moves", "adddrop")]}>
          {moves.length ? moves.map((r) => { const sd = effAvg(r.f, K) - effAvg(r.d, K); const [v, c] = verdict(r.gain, sd); return (
            <Row key={r.f.id}><span className={"text-xs px-2 py-0.5 rounded whitespace-nowrap " + c}>{v}</span><span className="flex-1">Add <PN p={r.f} className="font-semibold" /> <span className="text-xs text-slate-400">{r.f.p} · <TeamLogo t={r.f.t} /></span>{sameDrop ? null : <> · drop <PN p={r.d} className="font-semibold" /></>}</span><WinDelta s={s} add={r.f} drop={r.d} /><span className="text-green-700 font-semibold">+{f1(r.gain)}</span></Row>
          ); }) : <div className="text-slate-400">No move worth an acquisition right now.</div>}
        </Section>
      </div>
      {L && (
        <Section title={`Your lineup · ${dday === today ? "tonight" : dayLabel(dday)}`} sub={`${L.start.length} starting · ${L.bench.length} would sit · ${L.empty} empty slot${L.empty === 1 ? "" : "s"}`} link={["My Team", () => go("myteam")]}>
          <div className="flex flex-wrap gap-2 mt-1">{L.start.map((p) => <span key={p.id} className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg border border-slate-200 text-sm"><span className="text-xs text-slate-400">{p.slot}</span><PN p={p} className="" /><span className="text-xs text-slate-500">{f1(p.x)}</span></span>)}</div>
          {hot.length || cold.length ? (
            <div className="text-sm mt-3 flex flex-wrap gap-x-6 gap-y-1">
              {hot.length ? <span><span className="text-orange-600 font-medium">Hot</span> {hot.map((p, i) => <span key={p.id}>{i ? ", " : " "}<PN p={p} className="" /></span>)}</span> : null}
              {cold.length ? <span><span className="text-sky-600 font-medium">Cold</span> {cold.map((p, i) => <span key={p.id}>{i ? ", " : " "}<PN p={p} className="" /></span>)}</span> : null}
            </div>
          ) : <div className="text-xs text-slate-400 mt-3">Hot and cold streaks show up once players have 3+ games.</div>}
        </Section>
      )}
      {window.LinesSummary ? <window.LinesSummary s={s} wk={wk} go={go} trend={trend} H={{ Section, teamName, f1, TL }} /> : null}
      <div className="grid md:grid-cols-2 gap-4">
        <Section title="Injuries" link={["My Team", () => go("myteam")]}>
          {outNow.length ? outNow.map((p) => { const b = effBack(p); const soon = b.d && dates.length && b.d <= dates[dates.length - 1]; return (
            <Row key={p.id}><PN p={p} /><span className="text-xs text-slate-400">{p.p} · <TeamLogo t={p.t} />{p.ir ? " · IR" : ""}</span><span className={"ml-auto text-xs " + (soon ? "text-green-700 font-semibold" : "text-slate-500")}>{b.d ? "Back " + mdL(b.d) : "No return date"}</span></Row>
          ); }) : <div className="text-green-700">Everyone healthy.</div>}
        </Section>
        <Section title="News on your players" link={["All news", () => go("news")]}>
          {news.length ? news.map(({ p, items }) => (
            <div key={p.id} className="py-2.5 border-t border-slate-100">
              <div><PN p={p} /> <span className="text-xs text-slate-400">{p.p} · <TeamLogo t={p.t} /></span></div>
              {items.slice(0, 2).map((n, i) => <NewsItem key={i} n={n} />)}
            </div>
          )) : <div className="text-slate-400">No headlines about your players right now.</div>}
          {hidden > 0 && <div className="text-xs text-slate-400 mt-2">{hidden} old or minor headline{hidden === 1 ? "" : "s"} hidden</div>}
        </Section>
      </div>
    </div>
  );
}

// ---------- Advice ----------
function AdvicePanel({ s }) {
  const K = s.blend;
  const minGain = s.minGain ?? 3;
  const now = useMemo(() => computeMoves(s, { H: 1, pool: 60 }), [s]);
  const later = useMemo(() => computeMoves(s, { H: 4, pool: 40 }), [s]);
  const sdOf = (r) => effAvg(r.f, K) - effAvg(r.d, K);
  const topNow = now.res.filter((r) => r.gain >= minGain).slice(0, 5);
  const topLong = later.res.filter((r) => r.gain >= minGain && sdOf(r) >= 0).slice(0, 5);
  const mine = s.players.filter((p) => p.ft === s.me);
  const hotFA = s.players.filter((p) => p.ft === "fa" && p.prob > 0 && ((formRatio(p, K) || 0) >= 1.25 || (p.chg || 0) >= 5 || sigOf(p).ppChg === "added"))
    .sort((a, b) => ((sigOf(b).rec || {}).ppg || effAvg(b, K)) - ((sigOf(a).rec || {}).ppg || effAvg(a, K))).slice(0, 12);
  const myHot = mine.filter((p) => (formRatio(p, K) || 0) >= 1.3);
  const myCold = mine.filter((p) => { const r = formRatio(p, K); return r !== null && r <= 0.7; });
  const buyLow = s.players.filter((p) => p.ft !== s.me && p.ft !== "fa" && effAvg(p, K) >= 7 && (formRatio(p, K) ?? 9) <= 0.75).sort((a, b) => effAvg(b, K) - effAvg(a, K)).slice(0, 8);
  const strength = (tid) => { const r = s.players.filter((p) => p.ft === tid && !p.ir); const top = (pos, n) => r.filter((p) => p.p === pos).map((p) => effAvg(p, K) * (pos === "G" ? p.prob || 0.5 : 1)).sort((a, b) => b - a).slice(0, n).reduce((a, b) => a + b, 0); return { F: top("F", 10), D: top("D", 5), G: top("G", 2) }; };
  const all = s.teams.map((t) => ({ id: t.id, ...strength(t.id) }));
  const meS = all.find((x) => x.id === s.me) || { F: 0, D: 0, G: 0 };
  const ranks = { F: 1 + all.filter((t) => t.F > meS.F).length, D: 1 + all.filter((t) => t.D > meS.D).length, G: 1 + all.filter((t) => t.G > meS.G).length };
  const order = Object.entries(ranks).sort((a, b) => b[1] - a[1]);
  const weak = order[0], strong = order[order.length - 1];
  const posName = { F: "forwards", D: "defence", G: "goalies" };
  const depth = (pos) => mine.filter((p) => p.p === pos && !p.ir).sort((a, b) => effAvg(b, K) - effAvg(a, K)).slice(pos === "F" ? 10 : pos === "D" ? 5 : 2);
  const MoveRow = ({ r }) => { const sd = sdOf(r); const [v, c] = verdict(r.gain, sd); return (
    <div className="flex flex-wrap items-baseline gap-2 border-t border-slate-100 py-2">
      <span className={"text-xs px-2 py-0.5 rounded " + c}>{v}</span>
      <span>Add <b>{r.f.n}</b> <span className="text-xs text-slate-400">{r.f.p} <TeamLogo t={r.f.t} /></span> · drop <b>{r.d.n}</b> <span className="text-xs text-slate-400">{r.d.p}</span></span>
      <WinDelta s={s} add={r.f} drop={r.d} advice={1} /><span className="text-green-700 font-semibold">+{f1(r.gain)}</span>
      <span className={"text-xs " + (sd >= 0 ? "text-green-700" : "text-red-600")}>{sd >= 0 ? "+" : ""}{f1(sd)}/game long-term</span>
      <Tags p={r.f} K={K} />
    </div>
  ); };
  return (
    <div className="space-y-4">
      {!window.__SIG && <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 text-sm">Form, PP1 and news signals appear once gm_signals.py runs in the sync.</div>}
      <Section title="Best moves this week" sub={'Lineup-aware; respects your roster minimums and protected players. "Stream only" = helps now, worse player long-term.'}>
        {topNow.length ? topNow.map((r) => <MoveRow key={r.f.id} r={r} />) : <div className="text-slate-400">No move clears your {minGain}-pt minimum this week — save your acquisitions.</div>}
      </Section>
      <Section title="Best long-term upgrades" sub="Next 4 weeks, and a better player per game.">
        {topLong.length ? topLong.map((r) => <MoveRow key={r.f.id} r={r} />) : <div className="text-slate-400">No free agent is a clear long-term upgrade right now.</div>}
      </Section>
      <Section title="Hot & trending free agents" sub="Scoring well above projection (last 14 days), gaining ownership fast, or newly on PP1.">
        {hotFA.length ? hotFA.map((p) => <PlayerLine key={p.id} s={s} p={p} />) : <div className="text-slate-400">Nothing yet — needs a couple of weeks of games or a fresh PP1 change.</div>}
      </Section>
      <ToiMovers s={s} />
      <Section title="Your players — form check">
        {myHot.map((p) => <PlayerLine key={p.id} s={s} p={p} extra={<span className="text-xs text-orange-600">hot — start every game; sell-high if his role hasn't changed</span>} />)}
        {myCold.map((p) => <PlayerLine key={p.id} s={s} p={p} extra={<span className="text-xs text-sky-600">cold — check ice time/PP role before dropping</span>} />)}
        {!myHot.length && !myCold.length && <div className="text-slate-400">Everyone is playing close to projection (or not enough games yet).</div>}
      </Section>
      <Section title="Trade advice" sub={`Your lineup ranks #${ranks.F} in forwards, #${ranks.D} in defence and #${ranks.G} in goalies (of ${s.teams.length}).`}>
        <div className="mb-2">{weak[1] > strong[1] ? <>Trade from <b>{posName[strong[0]]}</b> depth to improve your <b>{posName[weak[0]]}</b>.</> : "Your roster is balanced — trade only for clear upgrades."}</div>
        {depth(strong[0]).length > 0 && weak[1] > strong[1] && <div className="text-xs text-slate-500 mb-2">Trade chips (your {posName[strong[0]]} beyond the starters): {depth(strong[0]).map((p) => p.n).join(", ")}</div>}
        <div className="font-medium mt-2">Buy-low targets (good players in a slump)</div>
        {buyLow.length ? buyLow.map((p) => <PlayerLine key={p.id} s={s} p={p} />) : <div className="text-slate-400 text-xs">None yet — needs recent-form data.</div>}
        {myHot.length > 0 && <><div className="font-medium mt-3">Sell-high candidates</div>{myHot.map((p) => <PlayerLine key={p.id} s={s} p={p} />)}</>}
      </Section>
    </div>
  );
}

function NewsView({ s, wk }) {
  const [f, setF] = useState("all");
  const [open, setOpen] = useState({});
  const opp = wk ? oppOf(wk, s.me) : null;
  const pass = (n) => f === "all" || (f === "inj" ? NEWS_OUT.has(n.kind) : f === "moves" ? n.kind === "trade" || n.kind === "roster" : n.kind === "hot");
  const rows = s.players.map((p) => ({ p, items: newsOf(p).filter(pass) })).filter((x) => x.items.length)
    .sort((a, b) => NEWS_RANK[a.items[0].kind] - NEWS_RANK[b.items[0].kind] || a.items[0].age - b.items[0].age);
  const only = (list, keep) => list.map((x) => ({ ...x, items: x.items.filter(keep) })).filter((x) => x.items.length);
  const groups = [
    ["mine", "Your players", "Regular news shows for a day, hot streaks for 3 days, and injuries, scratches, trades and roster moves for a week.", rows.filter((x) => x.p.ft === s.me), true],
    ["opp", opp ? "Your opponent · " + teamName(s, opp) : "", "Everything current on the team you play this week.", opp ? rows.filter((x) => x.p.ft === opp) : [], false],
    ["league", "Around your league", "Other fantasy teams: important news and hot streaks only.", only(rows.filter((x) => x.p.ft !== s.me && x.p.ft !== opp && x.p.ft !== "fa"), (n) => n.kind !== "news"), false],
    ["fa", "Free agents", "Only important news: injuries, scratches, trades and roster moves.", only(rows.filter((x) => x.p.ft === "fa"), (n) => NEWS_BIG.has(n.kind)), false],
  ];
  return (
    <div className="space-y-4">
      <Pills items={[["all", "All"], ["inj", "Injuries & scratches"], ["moves", "Trades & roster moves"], ["hot", "Hot"]]} value={f} onChange={setF} />
      {!window.__SIG && <div className={box + " text-slate-400"}>No news loaded yet.</div>}
      {groups.filter((g) => g[4] || g[3].length).map(([k, title, sub, list]) => {
        const shown = open[k] ? list : list.slice(0, 8);
        return (
          <Section key={k} title={title + " (" + list.length + ")"} sub={sub}>
            {shown.length ? shown.map(({ p, items }) => (
              <div key={p.id} className="flex gap-3 py-2.5 border-t border-slate-100">
                <div className="pt-0.5"><TeamLogo t={p.t} size={36} /></div>
                <div className="min-w-0 flex-1">
                  <div className="flex flex-wrap items-baseline gap-2"><PN p={p} /><span className="text-xs text-slate-400">{p.p} · <TL s={s} id={p.ft} /></span></div>
                  {items.slice(0, 2).map((n, i) => <NewsItem key={i} n={n} />)}
                </div>
              </div>
            )) : <div className="text-slate-400 text-xs">Nothing current.</div>}
            {list.length > shown.length && <button className="text-sm text-blue-600 mt-2" onClick={() => setOpen({ ...open, [k]: true })}>Show all {list.length}</button>}
          </Section>
        );
      })}
    </div>
  );
}

// ---------- PP1 ----------
const ppKey = (x) => nrm(x).replace(/\./g, "").replace(/-/g, " ");
function ppData(s) {
  const pp = (window.__SIG || {}).pp1 || {};
  const units = pp.units || {};
  const byName = {}; s.players.forEach((p) => (byName[ppKey(p.n)] = p));
  const onPP = new Set(); Object.values(units).forEach((arr) => (arr || []).forEach((n) => onPP.add(ppKey(n))));
  const has = Object.values(units).some((a) => a && a.length);
  const tp = (window.__SIG || {}).teampp || {};
  const hasTP = Object.keys(tp).length > 0;
  const order = hasTP ? [...NHL].sort((a, b) => ((tp[b] || {}).pct ?? 0) - ((tp[a] || {}).pct ?? 0)) : NHL;
  const rank = {}; order.forEach((t, i) => (rank[t] = i + 1));
  return { pp, units, byName, onPP, has, w: deriveWeek(s.weeks[s.wk] || s.weeks[0], s.autoDone), tp, hasTP, order, rank };
}
const rankCls = (r) => (r <= 8 ? "text-green-700" : r > 24 ? "text-red-600" : "text-slate-500");
function AvailPP({ s }) {
  const K = s.blend;
  const D = ppData(s);
  const [pos, setPos] = useState("all");
  const fa = s.players.filter((p) => p.ft === "fa" && D.onPP.has(ppKey(p.n)) && (pos === "all" || p.p === pos)).sort((a, b) => effAvg(b, K) - effAvg(a, K));
  return (
    <Section title="Free agents on a PP1 right now" sub={D.has ? `Daily Faceoff lines, checked ${D.pp.asof}. PP1 time drives power-play points (+2 each in your league).` : ""}>
      {!D.has ? <div className="text-slate-400">No PP1 data yet — run the sync.</div> : (
        <div>
          <div className="mb-3"><Pills items={[["all", "All"], ["F", "Forwards"], ["D", "Defense"]]} value={pos} onChange={setPos} /></div>
          {fa.length ? (
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead className="text-left"><tr>{["Player", "Pos", "NHL", "Team PP", "Avg", "Games this wk", "Signals"].map((h) => <th key={h} className="px-2 py-2">{h}</th>)}</tr></thead>
                <tbody>
                  {fa.map((p) => (
                    <tr key={p.id} className="border-t border-slate-100 align-top">
                      <td className="px-2 py-2 font-medium text-green-800">{p.n}{p.status && p.status !== "ACTIVE" ? <span className="text-red-600 text-xs ml-1">{p.status.replace(/_/g, " ")}</span> : ""}</td>
                      <td className="px-2 py-2">{p.p}</td><td className="px-2 py-2">{p.t}</td>
                      <td className={"px-2 py-2 " + rankCls(D.rank[p.t])}>{D.hasTP ? `#${D.rank[p.t]} · ${(D.tp[p.t] || {}).pct ?? "–"}%` : "–"}</td>
                      <td className="px-2 py-2">{f1(effAvg(p, K))}</td><td className="px-2 py-2">{gms(D.w, p.t)}</td><td className="px-2 py-2"><Tags p={p} K={K} /></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          ) : <div className="text-slate-400 text-xs">Every PP1 player is already rostered.</div>}
        </div>
      )}
    </Section>
  );
}
function PPView({ s }) {
  const D = ppData(s);
  const chg = D.pp.changes || {};
  const moves = s.players.filter((p) => sigOf(p).ppChg);
  return (
    <div className="space-y-4">
      <Section title="PP1 changes since yesterday">
        {moves.length ? moves.map((p) => <PlayerLine key={p.id} s={s} p={p} extra={<span className={"text-xs font-semibold " + (sigOf(p).ppChg === "added" ? "text-green-700" : "text-red-600")}>{sigOf(p).ppChg === "added" ? (p.ft === "fa" ? "→ pickup target" : p.ft === s.me ? "→ start him" : "→ trade target") : p.ft === s.me ? "→ expect fewer points" : ""}</span>} />) : <div className="text-slate-400">No PP1 changes since the last daily check.</div>}

// ---------- Weekly acquisition planner ----------
function buildPlan(s, wk, d0, M) {
  const K = s.blend, nD = wk.days.length;
  const mins = { F: s.minF ?? 10, D: s.minD ?? 5, G: s.minGo ?? 2 };
  const minGain = s.minGain ?? 3;
  const myR = s.players.filter((p) => p.ft === s.me);
  const ranked = myR.filter((p) => !p.ir).sort((a, b) => effAvg(b, K) - effAvg(a, K));
  const prot = new Set([...ranked.slice(0, s.protectTop ?? 8).map((p) => p.id), ...myR.filter((p) => p.keep).map((p) => p.id)]);
  const val = (p, a) => (wk.games[p.t] || []).filter((d) => d >= a).reduce((t, d) => { const dt = wk.dates[d]; return t + effAvg(p, K, dt) * (p.p === "G" ? gStart(p, dt).v : p.prob) * avail(p, dt); }, 0);
  const dayTotal = (tl, d) => dayLineup(tl.filter((x) => x.from <= d && x.to >= d).map((x) => x.p), wk, d, K).total;
  let tl = myR.map((p) => ({ p, from: 0, to: nD - 1, orig: true }));
  const fas = s.players.filter((p) => p.ft === "fa" && p.prob > 0 && (p.proj !== false || p.gp > 0))
    .map((p) => ({ p, v: val(p, d0) })).filter((x) => x.v > 0).sort((a, b) => b.v - a.v).slice(0, 45).map((x) => x.p);
  let base0 = 0; for (let d = d0; d < nD; d++) base0 += dayTotal(tl, d);
  const steps = [], usedFA = new Set();
  for (let k = 0; k < M; k++) {
    const cur = []; for (let d = d0; d < nD; d++) cur[d] = dayTotal(tl, d);
    const suffix = (a) => { let t = 0; for (let d = a; d < nD; d++) t += cur[d]; return t; };
    let best = null;
    for (let d = d0; d < nD; d++) {
      const active = tl.filter((x) => x.from <= d && x.to >= d);
      const cnt = { F: 0, D: 0, G: 0 }; active.forEach((x) => { if (!x.p.ir) cnt[x.p.p]++; });
      const drops = active.filter((x) => !x.p.ir && x.from < d + (x.orig ? 1 : 0) && !(x.orig && prot.has(x.p.id)) && !(!x.orig && x.from >= d))
        .map((x) => ({ x, v: val(x.p, d) })).sort((a, b) => a.v - b.v);
      const cand = []; ["F", "D", "G"].forEach((ps) => drops.filter((y) => y.x.p.p === ps).slice(0, 4).forEach((y) => cand.push(y.x)));
      const before = suffix(d);
      for (const f of fas) {
        if (usedFA.has(f.id) || !(wk.games[f.t] || []).includes(d)) continue;
        for (const x of cand) {
          if (x.p.p !== f.p && cnt[x.p.p] - 1 < mins[x.p.p]) continue;
          const tl2 = tl.map((y) => (y === x ? { ...y, to: d - 1 } : y)).concat([{ p: { ...f, ft: s.me }, from: d, to: nD - 1, orig: false }]);
          let after = 0; for (let dd = d; dd < nD; dd++) after += dayTotal(tl2, dd);
          const gain = after - before;
          if (!best || gain > best.gain) best = { gain, d, f, x, tl2 };
        }
      }
    }
    if (!best || best.gain < minGain) break;
    steps.push({ day: best.d, add: best.f, drop: best.x.p, dropWasStream: !best.x.orig, gain: best.gain });
    usedFA.add(best.f.id); tl = best.tl2;
  }
  let final = 0; for (let d = d0; d < nD; d++) final += dayTotal(tl, d);
  return { steps: steps.sort((a, b) => a.day - b.day), gain: final - base0, base: base0, final, pool: fas.length, d0 };
}
function AcqPlanner({ s, setS, wk }) {
  const K = s.blend;
  const espnUsed = movesUsedESPN(s, wk); const used = espnUsed != null ? espnUsed : ((s.movesUsed || {})[s.wk]) || 0;

  const left = Math.max(0, 3 - used);
  const opp = oppOf(wk, s.me) || s.opp;
  const oppProj = weekProj(s.players.filter((p) => p.ft === opp), wk, K, d0).total;
  const aA = +((wk.act || {})[s.me]) || 0, aB = +((wk.act || {})[opp]) || 0;
  useEffect(() => { setPlan(null); }, [s.wk, used, fromTomorrow, s.players]);
  const run = () => { setBusy(true); setTimeout(() => { setPlan(buildPlan(s, wk, d0, left)); setBusy(false); }, 30); };

  return (
    <div className="space-y-4">
      <Section title="Weekly acquisition planner" sub="Plans all your remaining pickups together — which player, which day, and who to drop — to squeeze the most points out of this week's lineup slots.">
        <div className="flex flex-wrap gap-3 items-center">
          {espnUsed != null ? <span>Moves used this week: <b>{used} of 3</b> <span className="text-xs text-slate-500">from ESPN</span></span> : <label>Moves already used this week <select className={inp} value={used} onChange={(e) => setUsed(+e.target.value)}>{[0, 1, 2, 3].map((n) => <option key={n} value={n}>{n}</option>)}</select></label>}

          <button className="bg-blue-600 rounded-lg px-4 py-1.5 font-semibold" disabled={busy || !left || d0 >= dates.length} onClick={run}>{busy ? "Planning…" : `Build my plan (${left} move${left === 1 ? "" : "s"} left)`}</button>
        </div>
        <div className="text-xs text-slate-500 mt-2">Planning from {dates[d0] ? dayLabel(dates[d0]) : "—"} · uses your roster minimums, protected players and minimum gain from Add / Drop settings · counts only games that fit your daily lineup · goalies use Daily Faceoff starters, back-to-back logic and betting odds.</div>
      </Section>
      {!left && <div className={box + " text-slate-400"}>No moves left this week.</div>}
      {plan && (
        <Section title={plan.steps.length ? `Your plan: +${f1(plan.gain)} points this week` : "No move is worth it this week"} sub={`${teamName(s, s.me)} ${f1(aA + plan.base)} → ${f1(aA + plan.final)} projected vs ${teamName(s, opp)} ${f1(aB + oppProj)} · margin ${aA + plan.base - aB - oppProj >= 0 ? "+" : ""}${f1(aA + plan.base - aB - oppProj)} → ${aA + plan.final - aB - oppProj >= 0 ? "+" : ""}${f1(aA + plan.final - aB - oppProj)}`}>
          {plan.steps.length ? plan.steps.map((st, i) => { const sd = effAvg(st.add, K) - effAvg(st.drop, K); return (
            <div key={i} className="border-t border-slate-100 py-3">
              <div className="flex flex-wrap items-baseline gap-2">
                <span className="text-xs px-2 py-0.5 rounded bg-blue-600">{i + 1}</span>
                <span className="font-semibold">{wk.days[st.day]}</span>
                <span>Add <b>{st.add.n}</b> <span className="text-xs text-slate-400">{st.add.p} · <TeamLogo t={st.add.t} /></span></span>
                <span>· drop <b>{st.drop.n}</b>{st.dropWasStream ? <span className="text-xs text-slate-400"> (streamer from step {plan.steps.findIndex((x) => x.add.id === st.drop.id) + 1})</span> : <span className="text-xs text-slate-400"> {st.drop.p}</span>}</span>
                <span className="text-green-700 font-semibold ml-auto">+{f1(st.gain)}</span>
              </div>
              <div className="text-xs text-slate-500 mt-1 ml-8">{st.add.n} plays: {gamesFrom(st.add, st.day) || "—"}{!st.dropWasStream && sd < 0 ? <span className="text-amber-600"> · stream only: {f1(Math.abs(sd))}/game worse long-term than {st.drop.n}</span> : ""} <Tags p={st.add} K={K} /></div>
            </div>
          ); }) : <div className="text-slate-400">No pickup adds at least {s.minGain ?? 3} points this week — save your moves (or lower the minimum gain in Add / Drop settings).</div>}
          {plan.steps.length > 0 && <div className="text-xs text-slate-500 mt-2">Make each move on ESPN on the day shown, before that day's first game. Re-run the plan after each move (and each morning) — injuries, goalie announcements and your opponent's moves change the best plan. {espnUsed != null ? "Your moves count updates from ESPN at the next sync." : 'Set "moves already used" after each one.'}</div>}
        </Section>
      )}
    </div>
  );
}

// ---------- Edges: line promotions, luck, model vs ESPN ----------
function EdgesPanel({ s }) {
  const K = s.blend; const S = window.__SIG || {}; const M = window.__MODEL;
  const pid = (p) => (typeof p.id === "string" && p.id[0] === "e" ? p.id.slice(1) : null);
  const ln = (p) => sigOf(p).lines || {};
  const promoFA = s.players.filter((p) => p.ft === "fa" && ln(p).chg === "up");
  const promoOther = s.players.filter((p) => p.ft !== "fa" && p.ft !== s.me && ln(p).chg === "up").slice(0, 10);
  const mineChg = s.players.filter((p) => p.ft === s.me && ln(p).chg);
  const lk = (p) => sigOf(p).luck;
  const lucky = (p) => { const l = lk(p); return l && (l.t === "s" ? l.d >= 2 : l.d >= 4); };
  const unlucky = (p) => { const l = lk(p); return l && (l.t === "s" ? l.d <= -2 : l.d <= -4); };
  const byLuck = (a, b) => Math.abs(lk(b).d) - Math.abs(lk(a).d);
  const sellHigh = s.players.filter((p) => p.ft === s.me && lucky(p)).sort(byLuck);
  const myUnlucky = s.players.filter((p) => p.ft === s.me && unlucky(p)).sort(byLuck);
  const buyLow = s.players.filter((p) => p.ft !== s.me && p.ft !== "fa" && unlucky(p) && effAvg(p, K) >= 5).sort(byLuck).slice(0, 12);
  const buyFA = s.players.filter((p) => p.ft === "fa" && unlucky(p)).sort(byLuck).slice(0, 10);
  const luckInfo = (p) => { const l = lk(p); return <span className="text-xs text-slate-500">{l.t === "s" ? `${l.g} G on ${l.sh} shots (${l.pct}% vs career ${l.cpct}%) · ${l.d > 0 ? "+" : ""}${f1(l.d)} goals vs expected ≈ ${l.d > 0 ? "+" : ""}${f1(l.d * 6)} pts` : `SV% ${l.sv.toFixed(3)} vs career ${l.csv.toFixed(3)} · ${l.d > 0 ? "+" : ""}${f1(l.d)} goals vs normal ≈ ${l.d > 0 ? "+" : ""}${f1(l.d * 3.6)} pts`}</span>; };
  const mv = (p) => { const id = pid(p); const mb = M && id ? (M.base || {})[id] : null; return mb != null && p.proj && p.avg > 0 ? { mb, e: p.avg, d: mb - p.avg, r: mb / p.avg } : null; };
  const under = (p) => { const x = mv(p); return x && x.d >= 1 && x.r >= 1.15; };
  const over = (p) => { const x = mv(p); return x && x.d <= -1 && x.r <= 0.85; };
  const uFA = s.players.filter((p) => p.ft === "fa" && under(p)).sort((a, b) => mv(b).d - mv(a).d).slice(0, 12);
  const uOther = s.players.filter((p) => p.ft !== "fa" && p.ft !== s.me && under(p)).sort((a, b) => mv(b).d - mv(a).d).slice(0, 12);
  const oMine = s.players.filter((p) => p.ft === s.me && over(p)).sort((a, b) => mv(a).d - mv(b).d);
  const uMine = s.players.filter((p) => p.ft === s.me && under(p));
  const mvInfo = (p) => { const x = mv(p); return <span className={"text-xs " + (x.d > 0 ? "text-green-700" : "text-red-600")}>GM model {f1(x.mb)}/g vs ESPN {f1(x.e)}/g ({x.d > 0 ? "+" : ""}{f1(x.d)})</span>; };
  const Sub = ({ t }) => <div className="font-medium mt-3 mb-1">{t}</div>;
  const None = ({ t }) => <div className="text-slate-400 text-xs">{t}</div>;
  return (
    <div className="space-y-4">
      <Section title="↑ Line promotions" sub={`Daily Faceoff even-strength lines${S.lines ? `, checked ${S.lines.asof}` : ""}. Top-6 forwards and top-4 D get more minutes and better linemates — points usually follow within a week.`}>
        {!S.lines ? <None t="Line data appears after the next sync (needs the updated gm_signals.py)." /> : (<>
          <Sub t="Free agents just promoted (pickup targets)" />
          {promoFA.length ? promoFA.map((p) => <PlayerLine key={p.id} s={s} p={p} />) : <None t="No free-agent promotions since yesterday." />}
          <Sub t="Your players" />
          {mineChg.length ? mineChg.map((p) => <PlayerLine key={p.id} s={s} p={p} extra={<span className={"text-xs " + (ln(p).chg === "up" ? "text-green-700" : "text-red-600")}>{ln(p).chg === "up" ? "↑ start him" : "↓ moved down the lineup — watch his minutes"}</span>} />) : <None t="No line changes for your players." />}
          {promoOther.length > 0 && <><Sub t="Promoted on other fantasy teams (trade targets)" />{promoOther.map((p) => <PlayerLine key={p.id} s={s} p={p} />)}</>}
        </>)}

        {!S.luck ? <None t="Luck data appears after the next sync (needs the updated gm_signals.py)." /> : !Object.keys(S.luck).length ? <None t="Needs about 25 shots per skater / 150 shots against per goalie — usually by late October." /> : (<>
          <Sub t="Sell high — your lucky players (points will likely drop)" />
          {sellHigh.length ? sellHigh.map((p) => <PlayerLine key={p.id} s={s} p={p} extra={luckInfo(p)} />) : <None t="None of your players are running unusually hot." />}
          <Sub t="Buy low — unlucky players on other teams (points are coming)" />
          {buyLow.length ? buyLow.map((p) => <PlayerLine key={p.id} s={s} p={p} extra={luckInfo(p)} />) : <None t="None right now." />}
          <Sub t="Unlucky free agents (cheap upside)" />
          {buyFA.length ? buyFA.map((p) => <PlayerLine key={p.id} s={s} p={p} extra={luckInfo(p)} />) : <None t="None right now." />}
          {myUnlucky.length > 0 && <><Sub t="Your unlucky players — don't sell low" />{myUnlucky.map((p) => <PlayerLine key={p.id} s={s} p={p} extra={luckInfo(p)} />)}</>}
        </>)}
      </Section>
      <Section title="Model vs ESPN" sub="Where your GM model (usage, ice time, betting lines, matchups) disagrees with ESPN's projection by 15%+. Most managers only see ESPN's number — so these players are mispriced in your league.">
        {!M ? <None t="Needs the GM model in the sync." /> : (<>
          <Sub t="Undervalued free agents" />

          <Sub t="Undervalued on other teams (trade targets — their owner thinks they're worth less)" />
          {uOther.length ? uOther.map((p) => <PlayerLine key={p.id} s={s} p={p} extra={mvInfo(p)} />) : <None t="None right now." />}

          {uMine.length > 0 && <><Sub t="Your players ESPN underrates (keep — they're worth more than they look)" />{uMine.map((p) => <PlayerLine key={p.id} s={s} p={p} extra={mvInfo(p)} />)}</>}
          <div className="text-xs text-slate-500 mt-3">Early in the season the model leans on last year's stats, so check the tags (PP1, ice time, lines) to see <i>why</i> it disagrees before acting.</div>
        </>)}
      </Section>
    </div>
  );
}

// ---------- Bench fixer ----------
function BenchFixer({ s }) {
  const K = s.blend;
  const [H, setH] = useState(4);
  const mine = s.players.filter((p) => p.ft === s.me);
  const mins = { F: s.minF ?? 10, D: s.minD ?? 5, G: s.minGo ?? 2 };
  const ranked = mine.filter((p) => !p.ir).sort((a, b) => effAvg(b, K) - effAvg(a, K));
  const prot = new Set([...ranked.slice(0, s.protectTop ?? 8).map((p) => p.id), ...mine.filter((p) => p.keep).map((p) => p.id)]);
  const cnt = { F: 0, D: 0, G: 0 }; mine.forEach((p) => { if (!p.ir) cnt[p.p]++; });
  const res = useMemo(() => {
    const wks = s.weeks.slice(s.wk, s.wk + H).map((w, i) => { const dw = deriveWeek(w, s.autoDone); return { dw, from: i === 0 ? dw.done : 0 }; });
    const tot = (roster, a) => wks.slice(a).reduce((t, x) => t + weekProj(roster, x.dw, K, x.from).total, 0);
    const chronic = {};
    const out = wks.map(({ dw, from }, i) => {
      const wasted = {}; const empty = { F: 0, D: 0, UTIL: 0, G: 0 }; let total = 0;
      dw.days.forEach((dl, d) => {
        if (d < from) return;

        L.bench.forEach((p) => { const w = (wasted[p.id] = wasted[p.id] || { p, g: 0, pts: 0, days: [] }); w.g++; w.pts += p.x; w.days.push(dl.split(",")[0]); const c = (chronic[p.id] = chronic[p.id] || { p, g: 0, pts: 0, wk: 0 }); c.g++; c.pts += p.x; });
        const c = { F: 0, D: 0, UTIL: 0, G: 0 }; L.start.forEach((x) => c[x.slot]++);
        empty.F += 9 - c.F; empty.D += 5 - c.D; empty.UTIL += 1 - c.UTIL; empty.G += 2 - c.G;
      });
      Object.values(wasted).forEach((w) => chronic[w.p.id].wk++);
      const wl = Object.values(wasted).sort((a, b) => b.pts - a.pts);
      let fix = null;
      const openPos = ["F", "D", "G"].filter((k) => (k === "F" ? empty.F + empty.UTIL : k === "D" ? empty.D + empty.UTIL : empty.G) > 0);
      if (wl.length && openPos.length) {
        const drops = wl.map((w) => w.p).filter((p) => !p.ir && !prot.has(p.id)).slice(0, 5);
        const weekPts = (p) => (dw.games[p.t] || []).filter((d) => d >= from).reduce((t, d) => { const dt = dw.dates[d]; return t + effAvg(p, K, dt) * (p.p === "G" ? gStart(p, dt).v : p.prob) * avail(p, dt); }, 0);
        const pool = s.players.filter((p) => p.ft === "fa" && p.prob > 0 && openPos.includes(p.p) && (p.proj !== false || p.gp > 0)).map((p) => ({ p, v: weekPts(p) })).filter((x) => x.v > 0).sort((a, b) => b.v - a.v).slice(0, 25).map((x) => x.p);
        const base = weekProj(mine, dw, K, from).total, baseRest = tot(mine, i);
        drops.forEach((d) => pool.forEach((f) => {
          if (d.p !== f.p && cnt[d.p] - 1 < mins[d.p]) return;

  const totP = res.weeks.reduce((a, w) => a + w.wl.reduce((x, y) => x + y.pts, 0), 0);
  const totE = res.weeks.reduce((a, w) => ({ F: a.F + w.empty.F, D: a.D + w.empty.D, UTIL: a.UTIL + w.empty.UTIL, G: a.G + w.empty.G }), { F: 0, D: 0, UTIL: 0, G: 0 });

  return (
    <div className="space-y-4">

        </div>

          <Card label="Empty lineup slots" value={totE.F + totE.D + totE.UTIL + totE.G} sub={slotTxt(totE)} />

              {w.wl.map((x) => <div key={x.p.id} className="flex flex-wrap gap-2 py-1 border-t border-slate-100"><span className="font-medium">{x.p.n}</span><span className="text-xs text-slate-400">{x.p.p} · <TeamLogo t={x.p.t} /></span><span className="text-xs text-red-600">{x.g} game{x.g > 1 ? "s" : ""} wasted ({x.days.join(", ")}) ≈ {f1(x.pts)} pts</span>{prot.has(x.p.id) && <span className="text-xs text-slate-500">protected</span>}</div>)}
            </div>

        </Section>

  const [who, setWho] = useState("fa"); const [pos, setPos] = useState("all"); const [q, setQ] = useState(""); const [showTeams, setShowTeams] = useState(false);

  const dates = weeks.flatMap((w) => w.dates || []);
  const perDay = {}; dates.forEach((d) => (perDay[d] = NHL.filter((t) => SCHED[t] && SCHED[t].has(d)).length / 2));
  const light = new Set(dates.filter((d) => perDay[d] > 0 && perDay[d] <= 5));
  const teamRows = NHL.map((t) => { const per = weeks.map((w) => gms(w, t)); const tot = per.reduce((a, b) => a + b, 0); const off = dates.filter((d) => light.has(d) && SCHED[t].has(d)).length; return { t, per, tot, off }; }).sort((a, b) => b.tot - a.tot || b.off - a.off);
  const avgGames = teamRows.reduce((a, r) => a + r.tot, 0) / teamRows.length;
  const tg = {}; teamRows.forEach((r) => (tg[r.t] = r));
  const val = (p) => { let v = 0; dates.forEach((d) => { if (SCHED[p.t] && SCHED[p.t].has(d)) v += effAvg(p, K, d) * p.prob * avail(p, d); }); return v; };
  const rows = useMemo(() => s.players

    .map((p) => { const v = val(p); const r = tg[p.t] || { tot: 0, off: 0, per: [] }; return { p, v, g: r.tot, off: r.off, per: r.per, bonus: (r.tot - avgGames) * effAvg(p, K) * p.prob }; })
    .sort((a, b) => b.v - a.v).slice(0, 100), [s.players, who, pos, q, st, nW, K]);
  const league = useMemo(() => s.teams.map((t) => { const r = s.players.filter((p) => p.ft === t.id); return { t, tot: weeks.reduce((a, w) => a + weekProj(r, w, K, 0).total, 0) }; }).sort((a, b) => b.tot - a.tot), [s.players, weeks, K]);
  const myRank = league.findIndex((x) => x.t.id === s.me) + 1;

  const today = todayISO();

  return (

      </Section>

// ---------- 2-for-1 builder ----------
function TwoForOne({ s, initPartner }) {
  const K = s.blend;
  const today = todayISO();
  const others = s.teams.filter((t) => t.id !== s.me);
  const [partner, setPartner] = useState(initPartner || (others[0] || {}).id || "");
  const [give, setGive] = useState([]); const [get, setGet] = useState([]);
  const [faPick, setFaPick] = useState({});
  const [sugg, setSugg] = useState(null); const [busy, setBusy] = useState(false);
  const mins = { F: s.minF ?? 10, D: s.minD ?? 5, G: s.minGo ?? 2 };
  const nR = s.weeks.length - s.wk;
  const gl = (p) => [...(SCHED[p.t] || [])].filter((d) => d >= today && avail(p, d) > 0).length;
  const tv = useMemo(() => { const o = {}; s.players.forEach((p) => { if (p.ft !== "fa" || p.proj !== false || p.gp > 0) o[p.id] = rosRaw(p, K); }); return o; }, [s.players, K, window.__PMODE]);
  const vv = (p) => effAvg0(p, K) * (p.p === "G" ? p.prob : 1);
  const rep = useMemo(() => { const o = {}; ["F", "D", "G"].forEach((k) => { const l = s.players.filter((p) => p.ft === "fa" && p.p === k && p.prob > 0 && (p.proj !== false || p.gp > 0)).map(vv).sort((a, b) => b - a).slice(0, 5); o[k] = l.length ? l.reduce((a, b) => a + b, 0) / l.length : 0; }); return o; }, [s.players, K]);
  const pe = (p) => Math.max(0, vv(p) - (rep[p.p] || 0)) * gl(p);
  const mine = s.players.filter((p) => p.ft === s.me);
  const theirs = s.players.filter((p) => p.ft === partner);
  const fas = useMemo(() => s.players.filter((p) => p.ft === "fa" && p.prob > 0 && tv[p.id] > 0).sort((a, b) => tv[b.id] - tv[a.id]).slice(0, 40), [tv]);
  const posOK = (roster) => { const c = { F: 0, D: 0, G: 0 }; roster.forEach((p) => { if (!p.ir) c[p.p]++; }); return ["F", "D", "G"].every((k) => c[k] >= mins[k]); };
  const valueFlags = (p) => {
    const f = [], g = sigOf(p), l = g.luck, id = typeof p.id === "string" && p.id[0] === "e" ? p.id.slice(1) : null;
    const mb = window.__MODEL && id ? (window.__MODEL.base || {})[id] : null;
    if (mb != null && p.proj && p.avg > 0) {
      if (mb / p.avg <= 0.85 && p.avg - mb >= 1) f.push({ t: "ESPN overrates", sell: true });
      else if (mb / p.avg >= 1.15 && mb - p.avg >= 1) f.push({ t: "underrated", sell: false });
    }
    if (l && ((l.t === "s" && l.d >= 2) || (l.t === "g" && l.d >= 4))) f.push({ t: "lucky", sell: true });
    if (l && ((l.t === "s" && l.d <= -2) || (l.t === "g" && l.d <= -4))) f.push({ t: "unlucky", sell: false });
    if ((formRatio(p, K) || 0) >= 1.25) f.push({ t: "hot streak", sell: true });
    const t = g.toi;
    if (t && (t.d >= 90 || t.pd >= 45)) f.push({ t: "more ice time", sell: false });
    if (g.lines && g.lines.chg === "up") f.push({ t: "↑ promoted", sell: false });
    if (g.ppChg === "added") f.push({ t: "↑ new on PP1", sell: false });
    return f;
  };
  const sellFlags = (p) => valueFlags(p).filter((x) => x.sell).map((x) => x.t);
  const buyFlags = (p) => valueFlags(p).filter((x) => !x.sell).map((x) => x.t);
  const toggle = (arr, set, id) => set(arr.includes(id) ? arr.filter((x) => x !== id) : [...arr, id]);
  const G = mine.filter((p) => give.includes(p.id)), Rr = theirs.filter((p) => get.includes(p.id));
  const extra = Math.max(0, G.length - Rr.length);
  const manual = useMemo(() => {
    if (!G.length || !Rr.length) return null;
    let after = [...mine.filter((p) => !give.includes(p.id)), ...Rr.map((p) => ({ ...p, ft: s.me }))];
    const base = horizonTotal(mine, s, nR), base4 = horizonTotal(mine, s, 4);
    const noFill = horizonTotal(after, s, nR) - base;
    const fills = [];
    for (let k = 0; k < extra; k++) {
      let ch = faPick[k] && faPick[k] !== "auto" ? fas.find((f) => f.id === faPick[k]) : null;
      if (!ch) { let best = null; fas.filter((f) => !fills.includes(f)).slice(0, 15).forEach((f) => { const v = horizonTotal([...after, { ...f, ft: s.me }], s, nR); if (!best || v > best.v) best = { f, v }; }); ch = best && best.f; }
      if (ch) { fills.push(ch); after = [...after, { ...ch, ft: s.me }]; }
    }
    const thAfter = [...theirs.filter((p) => !get.includes(p.id)), ...G.map((p) => ({ ...p, ft: partner }))];
    return { fills, myR: horizonTotal(after, s, nR) - base, my4: horizonTotal(after, s, 4) - base4, noFill, thR: horizonTotal(thAfter, s, nR) - horizonTotal(theirs, s, nR), ok: posOK(after) };
  }, [give.join(), get.join(), partner, JSON.stringify(faPick), s.players, s.wk]);
  const findTrades = () => {
    setBusy(true);
    setTimeout(() => {
      const mineR = mine.filter((p) => !p.ir);
      const keep = new Set([...mineR].sort((a, b) => tv[b.id] - tv[a.id]).slice(0, 2).map((p) => p.id));
      const bestFA = {}; ["F", "D", "G"].forEach((k) => (bestFA[k] = fas.find((f) => f.p === k)));
      const cands = [];
      others.forEach((t) => {
        s.players.filter((p) => p.ft === t.id && !p.ir).sort((a, b) => (tv[b.id] || 0) - (tv[a.id] || 0)).slice(0, 4).forEach((T) => {

// ---------- Trade analyzer ----------
const rosRaw = (p, K) => {

  const t = todayISO(); let v = 0;

  return v;
};
const horizonTotal = (roster, s, n) => { let t = 0; s.weeks.slice(s.wk, s.wk + n).forEach((w, i) => { const dw = deriveWeek(w, s.autoDone); t += weekProj(roster, dw, s.blend, i === 0 ? dw.done : 0).total; }); return t; };
function TradeAnalyzer({ s, initPartner }) {

  const mine = s.players.filter((p) => p.ft === s.me), theirs = s.players.filter((p) => p.ft === partner);
  const order = { F: 0, D: 1, G: 2 };

  const G = mine.filter((p) => give.includes(p.id)), Rr = theirs.filter((p) => get.includes(p.id));
  const ready = G.length > 0 && Rr.length > 0;
  const res = useMemo(() => {
    if (!ready) return null;
    const myAfter = [...mine.filter((p) => !give.includes(p.id)), ...Rr.map((p) => ({ ...p, ft: s.me }))];
    const thAfter = [...theirs.filter((p) => !get.includes(p.id)), ...G.map((p) => ({ ...p, ft: partner }))];
    const nR = s.weeks.length - s.wk;
    return { my4: horizonTotal(myAfter, s, 4) - horizonTotal(mine, s, 4), myR: horizonTotal(myAfter, s, nR) - horizonTotal(mine, s, nR), th4: horizonTotal(thAfter, s, 4) - horizonTotal(theirs, s, 4), thR: horizonTotal(thAfter, s, nR) - horizonTotal(theirs, s, nR), myAfter, thAfter };
  }, [ready, give.join(), get.join(), partner, s.players, s.wk]);

  const edge = vGive > 0 ? (vGet - vGive) / vGive : 0;
  const mins = { F: s.minF ?? 10, D: s.minD ?? 5, G: s.minGo ?? 2 };
  const counts = (r) => { const c = { F: 0, D: 0, G: 0 }; r.forEach((p) => { if (!p.ir) c[p.p]++; }); return c; };
  const vd = !ready ? null : Math.abs(edge) <= 0.1 ? ["Fair trade", "bg-green-100 text-green-800", "Within 10% — should pass a league vote."] : edge > 0.25 ? ["Lopsided in your favour", "bg-amber-100 text-amber-800", "Other managers may veto (4 votes needed). Consider a sweetener."] : edge > 0.1 ? ["Slightly in your favour", "bg-green-100 text-green-800", "A reasonable ask."] : edge < -0.25 ? ["Bad for you", "bg-red-100 text-red-800", "You give up much more than you get."] : ["Slightly against you", "bg-amber-100 text-amber-800", "Only worth it if it fixes a position need."];
  const Pick = ({ list, sel, set, title }) => (
    <Section title={title}>
      {list.sort((a, b) => order[a.p] - order[b.p] || (vals[b.id] || 0) - (vals[a.id] || 0)).map((p) => (
        <label key={p.id} className={"flex items-center gap-2 py-1 px-1 rounded " + (sel.includes(p.id) ? "bg-blue-50" : "")}>
          <input type="checkbox" checked={sel.includes(p.id)} onChange={() => toggle(sel, set, p.id)} />
          <span className="flex-1">{p.n} <span className="text-xs text-slate-400">{p.p} · <TeamLogo t={p.t} />{p.ir ? " · IR" : ""}</span></span>
          <span className="text-xs text-slate-500">{f1(vals[p.id])}</span>
        </label>

    <div>{label}: {["F", "D", "G"].map((k) => <span key={k} className={"mr-3 " + (check && a[k] < mins[k] ? "text-red-600 font-semibold" : a[k] !== b[k] ? "text-blue-700" : "")}>{k} {b[k]}→{a[k]}{check && a[k] < mins[k] ? " " : ""}</span>)}<span className="text-xs text-slate-500">({after.filter((p) => !p.ir).length}/22 active)</span></div>

          </div>

          <Bal before={theirs} after={res.thAfter} label={teamName(s, partner)} />
          <div className="text-xs text-slate-500 mt-2">{res.myAfter.filter((p) => !p.ir).length > 22 ? "Over 22 active players — you'd need a drop. " : ""}Best trades: green lineup impact for you, close to fair in raw value.</div>
        </Section>
      )}
      <div className="grid md:grid-cols-2 gap-4">
        <Pick list={[...mine]} sel={give} set={setGive} title={`You give (${teamName(s, s.me)})`} />
        <Pick list={[...theirs]} sel={get} set={setGet} title={`You get (${teamName(s, partner)})`} />

      <div className="h-1 rounded-full bg-slate-200 mt-2 overflow-hidden"><div className="h-full bg-green-500" style={{ width: Math.round(winProb(X.r, Y.r, X.act, Y.act) * 100) + "%" }}></div></div><div className="flex justify-between text-xs text-slate-500 mt-1.5"><span>{wpTxt(winProb(X.r, Y.r, X.act, Y.act))} to win</span><span>{wpTxt(1 - winProb(X.r, Y.r, X.act, Y.act))}</span></div>
      {X.act || Y.act ? <div className="text-xs text-slate-500 mt-1">Actual so far {f1(X.act)} – {f1(Y.act)}</div> : null}
    </div>
  );
}
function Matchup({ s, setS, wk, setWk }) {
  const K = s.blend, done = wk.done || 0;
  const pairOpp = oppOf(wk, s.me);
  const myPair = [s.me, pairOpp || s.opp];
  const others = (wk.pairs || []).filter((p) => p[0] && p[1] && p[0] !== s.me && p[1] !== s.me);
  const all = [myPair, ...others];
  const [sel, setSel] = useState(0);
  const cur = all[Math.min(sel, all.length - 1)];
  const P = useMemo(() => {
    const o = {};
    all.forEach((pr) => pr.forEach((id) => { if (!id || o[id]) return; o[id] = { r: weekProj(s.players.filter((p) => p.ft === id), wk, K, done), act: +((wk.act || {})[id]) || 0 }; }));
    return o;
  }, [s.players, wk, K, done, s.opp]);
  const [a, b] = cur;
  const A = P[a].r, B = P[b].r, aA = P[a].act, aB = P[b].act;
  const fa = aA + A.total, fb = aB + B.total, margin = fa - fb;
  const final = done >= wk.days.length;
  let run = aA - aB;
  return (
    <div>
      {all.length > 1 && <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3 mb-4">{all.map(([x, y], i) => <MatchCard key={x + "-" + y} s={s} a={x} b={y} P={P} on={i === sel} mine={i === 0} onSel={() => setSel(i)} />)}</div>}
      <div className="flex flex-wrap gap-2 items-center mb-3 text-sm">
        <TL s={s} id={a} className="font-semibold" /><span className="text-slate-500">vs</span>
        {sel === 0 && !pairOpp ? <select className={inp} value={s.opp} onChange={(e) => setS({ ...s, opp: e.target.value })}>{s.teams.filter((t) => t.id !== s.me).map((t) => <option key={t.id} value={t.id}>{t.name}</option>)}</select> : <TL s={s} id={b} className="font-semibold" />}
      </div>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-3">
        <Card label={teamName(s, a)} value={f1(fa)} sub={<>{f1(aA)} actual + {f1(A.total)} proj<br />{gamesMoves(s, a, wk, A)}</>} />
        <Card label={teamName(s, b)} value={f1(fb)} sub={<>{f1(aB)} actual + {f1(B.total)} proj<br />{gamesMoves(s, b, wk, B)}</>} />
        <Card label={final ? "Final margin" : "Projected margin"} value={(margin >= 0 ? "+" : "") + f1(margin)} tone={margin >= 0 ? "bg-green-50 border-green-200" : "bg-red-50 border-red-200"} />
        <Card label={"Win chance · " + teamName(s, a)} value={final ? (margin > 0 ? "WIN" : margin < 0 ? "LOSS" : "TIE") : wpTxt(winProb(A, B, aA, aB))} sub={final ? "Week complete" : `${wk.days.length - done} day(s) left · ${A.wasted} games wasted`} />
      </div>
      <LiveBar s={s} wk={wk} setWk={setWk} ids={[a, b]} />
      {wk.days.map((dl, d) => {
        if (d < done) return <div key={d} className="bg-slate-200 rounded-lg px-3 py-2 mb-2 text-sm text-slate-500">{dl} — completed</div>;
        const x = A.days[d], y = B.days[d]; run += x.total - y.total;
        return (
          <div key={d} className="bg-white rounded-xl border border-slate-200 mb-3">
            <div className="flex justify-between items-center px-3 py-2 border-b border-slate-200 text-sm">
              <span className="font-semibold">{dl}</span>
              {/* day header: running total removed */}
            </div>
            <div className="grid grid-cols-1 md:grid-cols-2 divide-y md:divide-y-0 md:divide-x divide-slate-200">
              <Side l={x} s={s} id={a} wk={wk} d={d} /><Side l={y} s={s} id={b} wk={wk} d={d} />
            </div>
            <div data-v="daydiff2" data-w="daydiff3" className="border-t border-slate-200 px-3 py-2">
              {[["Day difference", x.total - y.total], ["Total so far", run]].map(([lab, v]) => (
                <div key={lab} className="flex justify-between items-center py-1.5 font-semibold">
                  <span>{lab}</span>
                  <span className="flex items-center gap-3">
                    <span className="text-sm text-slate-500 font-normal">{Math.abs(v) < 0.05 ? "even" : (v > 0 ? teamName(s, a) : teamName(s, b)) + " ahead"}</span>
                    <span className={"min-w-[64px] text-center px-2.5 py-0.5 rounded-md " + (v >= 0 ? "bg-green-100 text-green-700" : "bg-red-100 text-red-600")}>{v >= 0 ? "+" : ""}{f1(v)}</span>
                  </span>
                </div>
              ))}
            </div>
          </div>
        );
      })}
      <div className="text-xs text-slate-500">Lineups auto-optimized (9 F, 5 D, 1 UTIL, 2 G). W % / xG = betting line for that game. Tap any matchup above to switch.</div>
    </div>
  );
}

// ---------- Power rankings ----------
function PowerRankings({ s, setS }) {
  const K = s.blend;
  const today = todayISO();
  const data = useMemo(() => {
    const rows = s.teams.map((t) => {
      const r = s.players.filter((p) => p.ft === t.id);
      let ros = 0, n4 = 0, days = 0;
      s.weeks.slice(s.wk).forEach((w, i) => {
        const dw = deriveWeek(w, s.autoDone); const from = i === 0 ? dw.done : 0;
        const v = weekProj(r, dw, K, from).total; ros += v; if (i < 4) n4 += v; days += Math.max(0, dw.days.length - from);
      });
      const perGame = (pos, n) => r.filter((p) => p.p === pos && !p.ir && avail(p, today) > 0).map((p) => effAvg(p, K) * (pos === "G" ? p.prob : 1)).sort((a, b) => b - a).slice(0, n).reduce((a, b) => a + b, 0);
      const grp = { F: perGame("F", 10), D: perGame("D", 5), G: perGame("G", 2) };
      const out = r.filter((p) => p.ir || avail(p, today) === 0).length;
      return { t, ros, n4, strength: days ? (ros / days) * 7 : 0, grp, out };
    });
    const rec = {}; s.teams.forEach((t) => (rec[t.id] = { w: 0, l: 0, t: 0, pf: 0, n: 0 }));
    s.weeks.forEach((w) => {
      const len = (w.dates || []).length;
      if (!len || effDone(w, s.autoDone) < len) return;
      (w.pairs || []).forEach(([a, b]) => {
        if (!rec[a] || !rec[b]) return;
        const x = +((w.act || {})[a]) || 0, y = +((w.act || {})[b]) || 0;
        if (!x && !y) return;
        rec[a].pf += x; rec[b].pf += y; rec[a].n++; rec[b].n++;
        if (x > y) { rec[a].w++; rec[b].l++; } else if (y > x) { rec[b].w++; rec[a].l++; } else { rec[a].t++; rec[b].t++; }
      });
    });
    rows.forEach((x) => (x.rec = rec[x.t.id]));
    rows.sort((a, b) => b.strength - a.strength);
    const avg = rows.reduce((a, x) => a + x.strength, 0) / Math.max(1, rows.length);
    const grpRank = {}; ["F", "D", "G"].forEach((k) => { [...rows].sort((a, b) => b.grp[k] - a.grp[k]).forEach((x, i) => { grpRank[x.t.id] = { ...(grpRank[x.t.id] || {}), [k]: i + 1 }; }); });
    return { rows, avg, grpRank, max: rows.length ? rows[0].strength : 1 };
  }, [s.players, s.weeks, s.wk, K, s.autoDone, window.__PMODE]);
  const ranks = {}; data.rows.forEach((x, i) => (ranks[x.t.id] = i + 1));
  const hist = s.prHist || {};
  useEffect(() => { if (!hist[s.wk] && data.rows.length) setS((x) => ({ ...x, prHist: { ...(x.prHist || {}), [x.wk]: ranks } })); }, [s.wk, data.rows.length]);
  const prevKey = Object.keys(hist).map(Number).filter((k) => k < s.wk).sort((a, b) => b - a)[0];
  const prev = prevKey !== undefined ? hist[prevKey] : null;
  const tier = (x) => { const d = (x.strength - data.avg) / (data.avg || 1); return d >= 0.06 ? ["Title contender", "bg-green-100 text-green-800"] : d >= 0 ? ["Playoff team", "bg-blue-50 text-blue-700"] : d >= -0.06 ? ["Bubble", "bg-amber-100 text-amber-800"] : ["Long shot", "bg-red-100 text-red-800"]; };
  const games = data.rows.reduce((a, x) => Math.max(a, x.rec.n), 0);
  return (
    <div className="space-y-4">
      <Section title="Power rankings" sub={`Every team measured the same way: projected points per 7 days for the rest of the season, with optimized daily lineups, real NHL schedules, injuries and return dates, goalie start chances and your projection mode (${window.__PMODE === "model" ? "GM model" : window.__PMODE === "blend" ? "Blend" : "ESPN"}). As games are played, projections shift to players' actual averages automatically.`}>
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead className="text-left"><tr>{["#", "", "Team", "Strength / wk", "", "Next 4 wks", "Rest of season", "F / D / G rank", "Out", "Record", "Actual / wk"].map((h, i) => <th key={i} className="px-2 py-2 whitespace-nowrap">{h}</th>)}</tr></thead>
            <tbody>
              {data.rows.map((x, i) => {
                const mv = prev && prev[x.t.id] ? prev[x.t.id] - (i + 1) : 0;
                const [tl, tc] = tier(x); const gr = data.grpRank[x.t.id] || {};
                return (
                  <tr key={x.t.id} className={"border-t border-slate-100 " + (x.t.id === s.me ? "bg-blue-50 font-semibold" : "")}>
                    <td className="px-2 py-2 text-lg font-bold">{i + 1}</td>
                    <td className="px-2 py-2 text-xs whitespace-nowrap">{mv > 0 ? <span className="text-green-700">▲{mv}</span> : mv < 0 ? <span className="text-red-600">▼{-mv}</span> : <span className="text-slate-400">–</span>}</td>
                    <td className="px-2 py-2"><div className="whitespace-nowrap"><TL s={s} id={x.t.id} /></div><span className={"text-xs px-2 py-0.5 rounded " + tc}>{tl}</span></td>
                    <td className="px-2 py-2 font-semibold">{f1(x.strength)}</td>
                    <td className="px-2 py-2 min-w-[90px]"><div className="h-2 rounded-full bg-slate-200 overflow-hidden"><div className={"h-full rounded-full " + (x.t.id === s.me ? "bg-blue-500" : "bg-slate-400")} style={{ width: Math.max(4, (x.strength / (data.max || 1)) * 100) + "%" }}></div></div></td>
                    <td className="px-2 py-2">{f1(x.n4)}</td>
                    <td className="px-2 py-2">{f1(x.ros)}</td>
                    <td className="px-2 py-2 whitespace-nowrap">{["F", "D", "G"].map((k) => <span key={k} className={"mr-2 " + (gr[k] <= 3 ? "text-green-700" : gr[k] >= 8 ? "text-red-600" : "")}>#{gr[k]}</span>)}</td>
                    <td className={"px-2 py-2 " + (x.out >= 3 ? "text-red-600" : "")}>{x.out}</td>
                    <td className="px-2 py-2 whitespace-nowrap">{x.rec.n ? `${x.rec.w}-${x.rec.l}${x.rec.t ? "-" + x.rec.t : ""}` : "–"}</td>
                    <td className="px-2 py-2">{x.rec.n ? f1(x.rec.pf / x.rec.n) : "–"}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
        <div className="text-xs text-slate-500 mt-3 space-y-1">
          <div><b>Strength / wk</b> = the ranking: projected fantasy points per 7 days from today to season's end. Tiers compare each team with the league average (±6%).</div>
          <div><b>F / D / G rank</b> = per-game strength of each team's top 10 F, top 5 D and top 2 G (goalies × start %) among healthy players. <b>Out</b> = injured or on IR right now.</div>
          <div><b>Record / Actual</b> = real results from {games} completed week{games === 1 ? "" : "s"} — shown for context only; they don't change the ranking, because schedules and luck make early records noisy. ▲▼ = movement since the previous week.</div>
        </div>
      </Section>
      <ClimbPanel s={s} data={data} ranks={ranks} />
    </div>
  );
}
function ClimbPanel({ s, data, ranks }) {
  const K = s.blend;
  const today = todayISO();
  const me = data.rows.find((x) => x.t.id === s.me);
  const moves = useMemo(() => computeMoves(s, { H: 4, pool: 40 }).res.filter((r) => r.gain >= (s.minGain ?? 3) && effAvg(r.f, K) >= effAvg(r.d, K)).slice(0, 5), [s]);
  const wasted = useMemo(() => {
    const r = s.players.filter((p) => p.ft === s.me); let w = 0, pts = 0;
    s.weeks.slice(s.wk, s.wk + 4).forEach((w0, i) => { const dw = deriveWeek(w0, s.autoDone); const res = weekProj(r, dw, K, i === 0 ? dw.done : 0); w += res.wasted; res.days.forEach((d) => d && d.bench.forEach((p) => (pts += p.x))); });
    return { w, pts };
  }, [s.players, s.wk, K]);
  if (!me) return null;
  const rank = ranks[s.me], n = data.rows.length;
  const above = rank > 1 ? data.rows[rank - 2] : null, below = rank < n ? data.rows[rank] : null;
  const gr = data.grpRank[s.me] || {};
  const posName = { F: "forwards", D: "defence", G: "goalies" };
  const need = { F: 10, D: 5, G: 2 };
  const order = ["F", "D", "G"].sort((a, b) => gr[b] - gr[a]);
  const weak = order[0], strong = order[2];
  const pv = (p) => effAvg(p, K) * (p.p === "G" ? p.prob : 1);
  const byVal = (a, b) => pv(b) - pv(a);
  const mine = s.players.filter((p) => p.ft === s.me && !p.ir);
  const myWeak = mine.filter((p) => p.p === weak).sort(byVal);
  const worstStarter = myWeak[Math.min(need[weak], myWeak.length) - 1];
  const chips = mine.filter((p) => p.p === strong).sort(byVal).slice(need[strong]);
  const partners = s.teams.filter((t) => t.id !== s.me).map((t) => {
    const g = data.grpRank[t.id] || {};
    const tp = s.players.filter((p) => p.ft === t.id && !p.ir && p.p === weak && worstStarter && pv(p) > pv(worstStarter)).sort(byVal).slice(0, 3);
    return { t, g, tp, fit: (g[weak] <= 4 ? 1 : 0) + (g[strong] >= 6 ? 1 : 0) };
  }).filter((x) => x.tp.length && x.fit >= 1).sort((a, b) => b.fit - a.fit).slice(0, 4);
  const outNow = s.players.filter((p) => p.ft === s.me && (p.ir || avail(p, today) === 0));
  const irUsed = s.players.some((p) => p.ft === s.me && p.ir);
  const irCandidate = outNow.find((p) => !p.ir && !effBack(p).d || (!p.ir && effBack(p).d > addDays(today, 10)));
  const Sub = ({ t }) => <div className="font-semibold mt-4 mb-1">{t}</div>;
  return (
    <Section title="How to climb the rankings" sub="Specific moves for your team, based on the same projections as the ranking.">
      <div className="text-base">
        You're <b>#{rank} of {n}</b> at <b>{f1(me.strength)}</b> pts/week.{" "}
        {above ? <>You're <b className="text-red-600">{f1(above.strength - me.strength)} pts/week</b> behind #{rank - 1} {above.t.name}{rank > 2 ? <> and {f1(data.rows[0].strength - me.strength)} behind #1</> : null}.</>
          : <>You lead #2 {below ? below.t.name : ""} by <b className="text-green-700">{f1(me.strength - (below ? below.strength : 0))} pts/week</b> — a small edge, so keep improving.</>}
      </div>
      <div className="text-xs text-slate-500 mt-1">Your group ranks: forwards #{gr.F}, defence #{gr.D}, goalies #{gr.G}. Weakest: <b>{posName[weak]}</b>. Strongest: <b>{posName[strong]}</b>.</div>

      <Sub t={`1 · Pickups that raise your strength (next 4 weeks)`} />
      {moves.length ? moves.map((r) => (
        <div key={r.f.id} className="flex flex-wrap items-baseline gap-2 border-t border-slate-100 py-1.5">
          <span>Add <b>{r.f.n}</b> <span className="text-xs text-slate-400">{r.f.p} · <TeamLogo t={r.f.t} /></span> · drop <b>{r.d.n}</b> <span className="text-xs text-slate-400">{r.d.p}</span></span>
          <span className="text-green-700 font-semibold">+{f1(r.gain / 4)}/wk</span><span className="text-xs text-slate-500">(+{f1(r.gain)} over 4 weeks)</span><Tags p={r.f} K={K} />
        </div>
      )) : <div className="text-slate-400 text-xs">No free agent is a clear long-term upgrade right now — improvement will come from trades.</div>}

      <Sub t={`2 · Trade from ${posName[strong]} to fix ${posName[weak]}`} />
      {chips.length ? <div className="text-sm">Your trade chips (beyond your starting {posName[strong]}): {chips.map((p) => <b key={p.id} className="mr-2">{p.n} <span className="text-xs text-slate-400 font-normal">{f1(pv(p))}/g</span></b>)}</div>
        : <div className="text-xs text-slate-500">You have no spare {posName[strong]} beyond your starters — a 2-for-1 trade (two good players for one great one) is the way to upgrade.</div>}
      {partners.length ? partners.map((x) => (
        <div key={x.t.id} className="border-t border-slate-100 py-1.5">
          <TL s={s} id={x.t.id} className="font-semibold" /> <span className="text-xs text-slate-500">({posName[weak]} #{x.g[weak]}, {posName[strong]} #{x.g[strong]}{x.fit === 2 ? " — ideal partner: strong where you're weak, weak where you're strong" : ""})</span>
          <div className="text-xs mt-0.5">Targets: {x.tp.map((p) => <span key={p.id} className="mr-3">{p.n} <span className="text-slate-400">{p.p} · {f1(pv(p))}/g</span></span>)}{worstStarter ? <span className="text-slate-500"> — better than your #{need[weak]} {weak} ({worstStarter.n}, {f1(pv(worstStarter))}/g)</span> : null}</div>
        </div>
      )) : <div className="text-slate-400 text-xs">No obvious trade partner — check Moves → Trade analyzer with a few teams.</div>}
      <div className="text-xs text-slate-500 mt-1">Test any idea in Moves → Trade analyzer before sending it.</div>

      <Sub t="3 · Stop wasting games" />
      {wasted.w > 0 ? <div className="text-sm">About <b>{wasted.w} games</b> (≈ <b>{f1(wasted.pts)} pts</b>) will sit on your bench over the next 4 weeks because you have more players than lineup slots on busy nights. Trade two of those depth players for one better player (2-for-1), or swap one for a position you're short on.</div>
        : <div className="text-green-700 text-sm">Almost no games wasted — your roster fits your lineup slots well.</div>}

      <Sub t="4 · Injuries & IR" />
      {outNow.length ? <div className="text-sm">{outNow.map((p) => { const b = effBack(p).d; return <div key={p.id}>{p.n} <span className="text-xs text-slate-400">{p.p} · <TeamLogo t={p.t} />{p.ir ? " · on IR" : ""}</span> <span className="text-xs text-slate-500">— {b ? "back " + mdL(b) : "no return date"}</span></div>; })}</div> : <div className="text-green-700 text-sm">Everyone healthy.</div>}
      {!irUsed && irCandidate ? <div className="text-amber-600 text-sm mt-1">Your IR slot is empty — move {irCandidate.n} there (if ESPN lists him as IR-eligible) to free a roster spot for a pickup.</div> : null}
      {outNow.length >= 3 ? <div className="text-xs text-slate-500 mt-1">With {outNow.length} players out, stream the open spots with Moves → Weekly planner each week until they return.</div> : null}

      {weak === "G" && <><Sub t="5 · Goalies" /><div className="text-sm">Goalies are your weakest group. Wins (5 pts) and saves drive goalie scoring, so target a <b>true starter</b> (60%+ of starts) on a good team rather than a third timeshare goalie. Stream backups on back-to-back second nights (amber in Setup → Schedule) to cover the gaps.</div></>}
    </Section>
  );
}

function League({ s, wk }) {
  const K = s.blend, done = wk.done || 0;

  s.teams.forEach((t) => { const r = weekProj(s.players.filter((p) => p.ft === t.id), wk, K, done); const a = +((wk.act || {})[t.id]) || 0; P[t.id] = { ...r, a, fin: a + r.total }; });
  const rec = {}; s.teams.forEach((t) => (rec[t.id] = { w: 0, l: 0, ties: 0, pf: 0 }));

    const len = (w.dates || w.days || []).length;
    if (!len || effDone(w, s.autoDone) < len) return;

      if (!rec[a] || !rec[b]) return;
      const x = +((w.act || {})[a]) || 0, y = +((w.act || {})[b]) || 0;
      if (!x && !y) return;
      rec[a].pf += x; rec[b].pf += y;
      if (x > y) { rec[a].w++; rec[b].l++; } else if (y > x) { rec[b].w++; rec[a].l++; } else { rec[a].ties++; rec[b].ties++; }
    });
  });
  const stand = s.teams.map((t) => ({ team: t, ...rec[t.id] })).sort((a, b) => b.w - a.w || b.pf - a.pf);
  return (
    <div className="space-y-4">
      <Section title="Standings" sub="Completed weeks. Top 6 make the playoffs. This week's matchups are on the Matchup tab.">
        <div className="overflow-x-auto"><table className="w-full text-sm">
          <thead className="text-left"><tr>{["#", "Team", "W", "L", "T", "PF"].map((h) => <th key={h} className="px-2 py-2">{h}</th>)}</tr></thead>

// ---------- Setup ----------
function Bulk({ s, setS }) {
  const [mode, setMode] = useState("team"); const [txt, setTxt] = useState(""); const [msg, setMsg] = useState("");
  const help = {
    add: "Name | NHL | Pos | ProjAvg | Play% | Fantasy team (or FA)", avg: "Name | ProjAvg", season: "Name | GP | Season total pts",
    play: "Name | Play% (goalies: start %)   e.g.  Kevin Lankinen | 85", team: "Name | Fantasy team (or FA)   e.g.  Colton Parayko | FA",
  };
  const run = () => {
    const lines = txt.split("\n").map((l) => l.trim()).filter(Boolean);
    let players = [...s.players]; let upd = 0, add = 0; const miss = [];
    const find = (n) => players.findIndex((p) => p.n.toLowerCase() === n.toLowerCase());
    const teamId = (x) => { const v = (x || "").trim().toLowerCase(); if (!v || v === "fa" || v === "free agent") return "fa"; const t = s.teams.find((t) => t.name.toLowerCase() === v || t.id === v); return t ? t.id : null; };
    lines.forEach((l, k) => {
      const f = l.split(/\t|\|/).map((x) => x.trim());
      if (f.length < 2) { miss.push(l); return; }
      const i = find(f[0]);
      if (mode === "add") {
        const tid = teamId(f[5]); const pos = (f[2] || "F").toUpperCase(); const nhl = (f[1] || "").toUpperCase();
        if (tid === null || !NHL.includes(nhl) || !["F", "D", "G"].includes(pos)) { miss.push(l); return; }
        const rec = { n: f[0], t: nhl, p: pos, avg: parseFloat(f[3]) || 0, prob: f[4] === undefined || f[4] === "" ? 1 : (parseFloat(f[4]) || 0) / 100, ft: tid, est: false };
        if (i >= 0) { players[i] = { ...players[i], ...rec }; upd++; } else { players.push({ id: "p" + Date.now() + "_" + k, ir: false, gp: 0, tot: 0, ...rec }); add++; }
        return;
      }
      if (i < 0) { miss.push(f[0]); return; }
      if (mode === "avg") players[i] = { ...players[i], avg: parseFloat(f[1]) || 0, est: false };
      if (mode === "season") players[i] = { ...players[i], gp: parseInt(f[1]) || 0, tot: parseFloat(f[2]) || 0 };
      if (mode === "play") players[i] = { ...players[i], prob: Math.max(0, Math.min(100, parseFloat(f[1]) || 0)) / 100 };
      if (mode === "team") { const tid = teamId(f[1]); if (tid === null) { miss.push(l); return; } players[i] = { ...players[i], ft: tid, ir: false }; }
      upd++;
    });
    setS({ ...s, players });
    setMsg(`Updated ${upd}, added ${add}.` + (miss.length ? ` Not matched (${miss.length}): ${miss.slice(0, 8).join("; ")}` : ""));
  };
  return (
    <div className={box}>
      <div className="font-semibold text-base mb-2">Bulk update</div>
      <div className="flex flex-wrap gap-2 items-center mb-2">
        <select className={inp} value={mode} onChange={(e) => setMode(e.target.value)}>
          <option value="team">Move players (adds, drops, trades)</option>
          <option value="play">Injuries / goalie start %</option>
          <option value="season">Season GP & total</option>
          <option value="avg">Projected averages</option>
          <option value="add">Add or replace players</option>
        </select>
        <button className="bg-blue-600 rounded-lg px-3 py-1.5" onClick={run}>Apply</button>
      </div>
      <div className="text-xs text-slate-500 mb-2">One per line: {help[mode]}</div>
      <textarea className={inp + " w-full h-32 font-mono text-xs"} value={txt} onChange={(e) => setTxt(e.target.value)} />
      {msg && <div className="text-sm mt-2">{msg}</div>}
      <div className="text-xs text-slate-500 mt-2">The next ESPN sync replaces manual roster moves with ESPN's real rosters.</div>
    </div>
  );
}

function leagueTable(s) {
  const key = [s.players, s.weeks, s.wk, s.blend, s.autoDone, window.__PMODE];
  if (__LT && __LT.key.every((v, i) => v === key[i])) return __LT.v;
  const K = s.blend, today = todayISO();
  const rows = s.teams.map((t) => {
    const r = s.players.filter((p) => p.ft === t.id);

    s.weeks.slice(s.wk).forEach((w, i) => { const dw = deriveWeek(w, s.autoDone); const from = i === 0 ? dw.done : 0; const v = weekProj(r, dw, K, from).total; ros += v; if (i < 4) n4 += v; days += Math.max(0, dw.days.length - from); });

    const grp = { F: perGame("F", 10), D: perGame("D", 5), G: perGame("G", 2) };

    if (!len || effDone(w, s.autoDone) < len) return;

const NHL_LOGO = { LA: "LAK", NJ: "NJD", SJ: "SJS", TB: "TBL" };
function TeamLogo({ t, size }) {

const NEWS_JUNK = /highlights|draft board|rankings|mailbag|podcast|give me a reason|league-winners|sleepers|\bbusts\b|best bets|predictions|betting|\bodds\b|takeaways|\bgrades\b|cheat sheet|start.?sit|waiver wire|what we learned/i;
const NEWS_KINDS = [
  ["trade", "Trade", /\btrade|traded|acquir|deal sends/i],

  ["susp", "Suspended", /suspen/i],

];
const NEWS_DAYS = { trade: 7, scratch: 7, susp: 7, injury: 7, roster: 7, hot: 3, news: 1 };
const NEWS_RANK = { injury: 0, scratch: 0, susp: 0, trade: 1, roster: 2, hot: 3, news: 4 };
const NEWS_BIG = new Set(["trade", "scratch", "susp", "injury", "roster"]);
const NEWS_OUT = new Set(["injury", "scratch", "susp"]);
const NEWS_CLS = { injury: "text-red-600", scratch: "text-red-600", susp: "text-red-600", trade: "text-blue-600", roster: "text-blue-600", hot: "text-orange-600" };
const NEWS_BADGE = { injury: "bg-red-100 text-red-600", scratch: "bg-red-100 text-red-600", susp: "bg-red-100 text-red-600", trade: "bg-blue-50 text-blue-600", roster: "bg-slate-200 text-slate-600", hot: "bg-amber-100 text-orange-600" };
const newsAge = (d) => { if (!d) return 0; const a = Math.round((fromIso(todayISO()) - fromIso(String(d).slice(0, 10))) / 864e5); return isNaN(a) ? 0 : Math.max(0, a); };
const newsOf = (p) => {
