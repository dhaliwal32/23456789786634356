  const rawPts = (p) => { let t = 0; horizon.forEach((h) => (h.wk.games[p.t] || []).forEach((d) => { const dt = h.wk.dates ? h.wk.dates[d] : null; if (d >= h.from && !p.ir && avail(p, dt)) t += effAvg(wt(p), K, dt) * p.prob; })); return t; };
  const ranked = myR.filter((p) => !p.ir).sort((a, b) => effAvg(wt(b), K) - effAvg(wt(a), K));
  const autoProt = new Set(ranked.slice(0, protectTop).map((p) => p.id));
  const protectedIds = new Set([...autoProt, ...myR.filter((p) => p.keep).map((p) => p.id)]);
  const cnt = { F: 0, D: 0, G: 0 }; myR.forEach((p) => { if (!p.ir) cnt[p.p]++; });
  const keepsMins = (d, f) => d.p === f.p || cnt[d.p] - 1 >= mins[d.p];
  const canDrop = (d, f) => !d.ir && !protectedIds.has(d.id) && keepsMins(d, f);
  const inTab = (f) => pos === "all" || (pos === "sk" ? f.p !== "G" : f.p === pos);
  const base = lineupAware ? total(myR) : 0;
  const pool = fas
    .filter((f) => f.prob > 0 && (f.proj !== false || f.gp > 0) && inTab(f) && f.n.toLowerCase().includes(q))
    .map((f) => ({ f, raw: rawPts(f) })).filter((x) => x.raw > 0)
    .sort((a, b) => b.raw - a.raw).slice(0, lineupAware ? o.pool || 120 : 500);
  const res = [];
  pool.forEach(({ f, raw }) => {
    let best = null;
    myR.forEach((d) => {
      if (!canDrop(d, f)) return;
      const gain = lineupAware ? total([...myR.filter((x) => x.id !== d.id), { ...f, ft: s.me }]) - base : raw - rawPts(d);
      if (!best || gain > best.gain) best = { gain, d };
    });
    if (best) res.push({ f, ...best });
  });
  res.sort((a, b) => b.gain - a.gain);
  return { res, total, gamesIn, rawPts, autoProt, protectedIds, cnt, mins, keepsMins, lineupAware, myR, fas, K, gw, protectTop };
}

  const [, tick] = useState(0);
  useEffect(() => {
    let st = init();
    try { const v = JSON.parse(localStorage.getItem(KEY) || "null"); if (v && v.players && v.weeks) st = migrate(v); } catch (e) {}

      try { st = applyESPN(st, E); setSyncMsg("Updated"); } catch (e) { setSyncMsg("ESPN file problem: " + e.message); }
    }
    setS(st); setLoaded(true);
  }, []);
  useEffect(() => {
    if (!loaded) return;
    const id = setInterval(() => {
      const sc = document.createElement("script");

        sc.remove();

        tick((x) => x + 1);
        if (!E || !E.generated) return;
        setS((st) => { if (E.generated === st.lastSync) return st; try { const n = applyESPN(st, E); setSyncMsg("Auto-updated " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })); return n; } catch (e) { return st; } });
      };

  else if (tab === "league") content = sub === "odds" ? <OddsBoard s={s} /> : sub === "pp" ? <PPView s={s} /> : sub === "news" ? <NewsView s={s} /> : <League {...P} />;
  else if (tab === "setup") content = sub === "opp" ? <OppRosters {...P} /> : sub === "fa" ? <RosterTable {...P} team="fa" /> : sub === "inj" ? <InjuryPanel {...P} /> : sub === "bulk" ? <div><Bulk s={s} setS={setS} /><AddOne {...P} /></div> : sub === "sched" ? <Schedule {...P} /> : sub === "settings" ? <Settings {...P} /> : <RosterTable {...P} team={s.me} />;
  return (

            <option value="model" disabled={!window.__MODEL}>Proj: GM model</option>
          </select>
          <span className={"text-xs px-2 py-1 rounded-full " + (s.lastSync ? (ageH !== null && ageH > 2 ? "bg-red-100 text-red-600" : "bg-green-100 text-green-700") : "bg-slate-200 text-slate-500")}>{s.lastSync ? "● Synced " + fmtTime(s.lastSync) : "Not synced yet"}</span>

        {content}
      </div>
    </div>
  );
}

// ---------- Today ----------
function Today({ s, wk, go }) {
  const K = s.blend;
  const opp = oppOf(wk, s.me) || s.opp;
  const done = wk.done || 0;
  const mine = s.players.filter((p) => p.ft === s.me), theirs = s.players.filter((p) => p.ft === opp);
  const A = weekProj(mine, wk, K, done), B = weekProj(theirs, wk, K, done);
  const aA = +((wk.act || {})[s.me]) || 0, aB = +((wk.act || {})[opp]) || 0;
  const fa = aA + A.total, fb = aB + B.total, margin = fa - fb;
  const today = todayISO();
  const dates = wk.dates || [];
  const di = dates.findIndex((d) => d >= today);
  const dday = di >= 0 ? dates[di] : null;
  const L = di >= 0 ? dayLineup(mine, wk, di, K) : null, OL = di >= 0 ? dayLineup(theirs, wk, di, K) : null;
  const checks = [];
  if (L) {
    mine.forEach((p) => { if (!p.ir && (wk.games[p.t] || []).includes(di) && avail(p, dday) === 0) checks.push(["bad", `${p.n} (${p.t}) is out — keep him out of your lineup`]); });
    mine.filter((p) => p.p === "G" && !p.ir && (wk.games[p.t] || []).includes(di)).forEach((p) => {
      const g = gStart(p, dday);
      if (g.l === "not starting") checks.push(["bad", `${p.n} is not starting — use another goalie`]);
      else if (g.l === "✓ confirmed") checks.push(["good", `${p.n} confirmed starting`]);
      else checks.push(["warn", `${p.n}: ${g.l || "starter not announced yet"} — check before lock`]);
    });
    if (L.bench.length) checks.push(["warn", `More players than slots — ${L.bench.map((p) => p.n).join(", ")} would sit`]);
    if (L.empty > 0) checks.push(["warn", `${L.empty} empty slot${L.empty > 1 ? "s" : ""} — a streamer could fill ${L.empty > 1 ? "them" : "it"}`]);
  }
  const outNow = mine.filter((p) => { const b = effBack(p).d; return (b && b > today) || (!b && avail(p, today) === 0); });
  const moves = useMemo(() => computeMoves(s, { H: 1, pool: 40 }).res.filter((r) => r.gain >= (s.minGain ?? 3)).slice(0, 3), [s]);
  const ppAdds = s.players.filter((p) => p.ft === "fa" && sigOf(p).ppChg === "added");
  const hot = s.players.filter((p) => p.ft === "fa" && p.prob > 0 && ((formRatio(p, K) || 0) >= 1.25 || (p.chg || 0) >= 5));
  const intel = [...ppAdds, ...hot.filter((p) => !ppAdds.includes(p))].slice(0, 6);
  const news = mine.filter((p) => (sigOf(p).news || []).length).slice(0, 5);
  const pct = Math.max(6, Math.min(94, 50 + margin / 2));
  const icon = { bad: "⛔", warn: "⚠️", good: "✅" };
  return (
    <div className="space-y-4">
      <div className="bg-white rounded-xl border border-slate-200 p-4">
        <div className="flex flex-wrap items-center gap-2 text-xs text-slate-500 mb-3">
          <span className="uppercase tracking-wide">{wk.label}</span><span>·</span><span>{done >= dates.length ? "Final" : `${dates.length - done} day${dates.length - done === 1 ? "" : "s"} left`}</span>
          <button className="ml-auto text-blue-600" onClick={() => go("matchup")}>Full matchup →</button>
        </div>
        <div className="grid grid-cols-2 gap-4 items-end">
          <div><div className="text-xs uppercase text-slate-500 truncate">{teamName(s, s.me)}</div><div className="text-4xl font-bold">{f1(fa)}</div><div className="text-xs text-slate-500">{f1(aA)} actual + {f1(A.total)} proj</div></div>
          <div className="text-right"><div className="text-xs uppercase text-slate-500 truncate">{teamName(s, opp)}</div><div className="text-4xl font-bold">{f1(fb)}</div><div className="text-xs text-slate-500">{f1(aB)} actual + {f1(B.total)} proj</div></div>
        </div>
        <div className="h-2 rounded-full bg-slate-200 mt-4 overflow-hidden"><div className={"h-full rounded-full " + (margin >= 0 ? "bg-green-500" : "bg-red-500")} style={{ width: pct + "%" }}></div></div>
        <div className={"text-sm mt-2 font-semibold " + (margin >= 0 ? "text-green-700" : "text-red-600")}>{margin >= 0 ? "Ahead" : "Behind"} by {f1(Math.abs(margin))} projected{Math.abs(margin) < 15 ? " — close, every move matters" : ""}</div>
      </div>
      <div className="grid md:grid-cols-2 gap-4">
        <Section title={dday ? (dday === today ? "Today's lineup check" : `Next game day — ${dayLabel(dday)}`) : "No games left this week"} link={["Matchup", () => go("matchup")]}>
          {checks.length ? checks.map(([k, t], i) => <div key={i} className={"py-1.5 border-t border-slate-100 " + (k === "bad" ? "text-red-600" : k === "warn" ? "text-amber-600" : "text-green-700")}>{icon[k]} {t}</div>) : <div className="text-green-700">✅ Lineup looks good.</div>}
          {L && <div className="text-xs text-slate-500 mt-2">{L.start.length} of your players play · projected {f1(L.total)} vs {f1(OL.total)}</div>}
        </Section>
        <Section title="Top moves this week" link={["All moves", () => go("moves", "adddrop")]}>
          {moves.length ? moves.map((r) => { const sd = effAvg(r.f, K) - effAvg(r.d, K); const [v, c] = verdict(r.gain, sd); return (
            <div key={r.f.id} className="py-2 border-t border-slate-100"><span className={"text-xs px-2 py-0.5 rounded mr-2 " + c}>{v}</span>Add <b>{r.f.n}</b> <span className="text-xs text-slate-400">{r.f.p} {r.f.t}</span> · drop <b>{r.d.n}</b> <span className="text-green-700 font-semibold ml-1">+{f1(r.gain)}</span></div>
          ); }) : <div className="text-slate-400">No move worth an acquisition right now.</div>}
        </Section>
        <Section title="PP1 changes & trending free agents" link={["PP1 free agents", () => go("moves", "ppfa")]}>
          {intel.length ? intel.map((p) => <PlayerLine key={p.id} s={s} p={p} />) : <div className="text-slate-400">Nothing new — shows up here as lines and form change.</div>}
        </Section>
        <Section title="Injuries on your team" link={["Injuries", () => go("setup", "inj")]}>
          {outNow.length ? outNow.map((p) => { const b = effBack(p); const soon = b.d && dates.length && b.d <= dates[dates.length - 1]; return (
            <div key={p.id} className="py-1.5 border-t border-slate-100 flex gap-2"><span className="font-medium">{p.n}</span><span className="text-xs text-slate-400">{p.p} · {p.t}{p.ir ? " · IR" : ""}</span><span className={"ml-auto text-xs " + (soon ? "text-green-700 font-semibold" : "text-slate-500")}>{b.d ? (soon ? "back this week · " : "back ") + mdL(b.d) : "no return date"}</span></div>
          ); }) : <div className="text-green-700">✅ Everyone healthy.</div>}
        </Section>
      </div>
      <Section title="News on your players" link={["All news", () => go("league", "news")]}>
        {news.length ? news.map((p) => <PlayerLine key={p.id} s={s} p={p} />) : <div className="text-slate-400">No recent headlines about your players.</div>}
      </Section>
    </div>
  );
}

// ---------- Advice ----------
function AdvicePanel({ s }) {
  const K = s.blend;
  const minGain = s.minGain ?? 3;
  const now = useMemo(() => computeMoves(s, { H: 1, pool: 60 }), [s]);
  const later = useMemo(() => computeMoves(s, { H: 4, pool: 40 }), [s]);
  const sdOf = (r) => effAvg(r.f, K) - effAvg(r.d, K);
  const topNow = now.res.filter((r) => r.gain >= minGain).slice(0, 5);
  const topLong = later.res.filter((r) => r.gain >= minGain && sdOf(r) >= 0).slice(0, 5);
  const mine = s.players.filter((p) => p.ft === s.me);
  const hotFA = s.players.filter((p) => p.ft === "fa" && p.prob > 0 && ((formRatio(p, K) || 0) >= 1.25 || (p.chg || 0) >= 5 || sigOf(p).ppChg === "added"))
    .sort((a, b) => ((sigOf(b).rec || {}).ppg || effAvg(b, K)) - ((sigOf(a).rec || {}).ppg || effAvg(a, K))).slice(0, 12);
  const myHot = mine.filter((p) => (formRatio(p, K) || 0) >= 1.3);
  const myCold = mine.filter((p) => { const r = formRatio(p, K); return r !== null && r <= 0.7; });
  const buyLow = s.players.filter((p) => p.ft !== s.me && p.ft !== "fa" && effAvg(p, K) >= 7 && (formRatio(p, K) ?? 9) <= 0.75).sort((a, b) => effAvg(b, K) - effAvg(a, K)).slice(0, 8);
  const strength = (tid) => { const r = s.players.filter((p) => p.ft === tid && !p.ir); const top = (pos, n) => r.filter((p) => p.p === pos).map((p) => effAvg(p, K) * (pos === "G" ? p.prob || 0.5 : 1)).sort((a, b) => b - a).slice(0, n).reduce((a, b) => a + b, 0); return { F: top("F", 10), D: top("D", 5), G: top("G", 2) }; };
  const all = s.teams.map((t) => ({ id: t.id, ...strength(t.id) }));
  const meS = all.find((x) => x.id === s.me) || { F: 0, D: 0, G: 0 };
  const ranks = { F: 1 + all.filter((t) => t.F > meS.F).length, D: 1 + all.filter((t) => t.D > meS.D).length, G: 1 + all.filter((t) => t.G > meS.G).length };
  const order = Object.entries(ranks).sort((a, b) => b[1] - a[1]);
  const weak = order[0], strong = order[order.length - 1];
  const posName = { F: "forwards", D: "defence", G: "goalies" };
  const depth = (pos) => mine.filter((p) => p.p === pos && !p.ir).sort((a, b) => effAvg(b, K) - effAvg(a, K)).slice(pos === "F" ? 10 : pos === "D" ? 5 : 2);
  const MoveRow = ({ r }) => { const sd = sdOf(r); const [v, c] = verdict(r.gain, sd); return (
    <div className="flex flex-wrap items-baseline gap-2 border-t border-slate-100 py-2">
      <span className={"text-xs px-2 py-0.5 rounded " + c}>{v}</span>
      <span>Add <b>{r.f.n}</b> <span className="text-xs text-slate-400">{r.f.p} {r.f.t}</span> · drop <b>{r.d.n}</b> <span className="text-xs text-slate-400">{r.d.p}</span></span>
      <span className="text-green-700 font-semibold">+{f1(r.gain)}</span>
      <span className={"text-xs " + (sd >= 0 ? "text-green-700" : "text-red-600")}>{sd >= 0 ? "+" : ""}{f1(sd)}/game long-term</span>
      <Tags p={r.f} K={K} />
    </div>
  ); };
  return (
    <div className="space-y-4">
      {!window.__SIG && <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 text-sm">Form, PP1 and news signals appear once gm_signals.py runs in the sync.</div>}
      <Section title="Best moves this week" sub={'Lineup-aware; respects your roster minimums and protected players. "Stream only" = helps now, worse player long-term.'}>

// ---------- PP1 ----------
const ppKey = (x) => nrm(x).replace(/\./g, "").replace(/-/g, " ");
function ppData(s) {
  const pp = (window.__SIG || {}).pp1 || {};
  const units = pp.units || {};
  const byName = {}; s.players.forEach((p) => (byName[ppKey(p.n)] = p));
  const onPP = new Set(); Object.values(units).forEach((arr) => (arr || []).forEach((n) => onPP.add(ppKey(n))));
  const has = Object.values(units).some((a) => a && a.length);
  const tp = (window.__SIG || {}).teampp || {};
  const hasTP = Object.keys(tp).length > 0;
  const order = hasTP ? [...NHL].sort((a, b) => ((tp[b] || {}).pct ?? 0) - ((tp[a] || {}).pct ?? 0)) : NHL;
  const rank = {}; order.forEach((t, i) => (rank[t] = i + 1));
  return { pp, units, byName, onPP, has, w: deriveWeek(s.weeks[s.wk] || s.weeks[0], s.autoDone), tp, hasTP, order, rank };
}
const rankCls = (r) => (r <= 8 ? "text-green-700" : r > 24 ? "text-red-600" : "text-slate-500");

// ---------- Betting lines ----------
const oddsFor = (t, dt) => { const O = ((window.ESPN_DATA || {}).model || {}).odds || {}; return dt && O[dt] ? O[dt][t] || null : null; };
function OddsBoard({ s }) {
  const O = ((window.ESPN_DATA || {}).model || {}).odds || null;
  const today = todayISO();
  const w = deriveWeek(s.weeks[s.wk] || s.weeks[0], s.autoDone);

  const count = (tid, team) => s.players.filter((p) => p.ft === tid && p.t === team && !p.ir).length;
  if (!O || !Object.keys(O).length) return <div className={box + " text-slate-400"}>No betting lines in the data yet — run the sync.</div>;
  const days = Object.keys(O).filter((d) => d >= today).sort();
  return (
    <div className="space-y-4">
      <div className="text-xs text-slate-500">Win chance (bookmaker margin removed) and expected goals per team, refreshed every 4 hours. Used by the GM model and shown on the Matchup tab as "W %" (goalies) and "xG" (skaters). Rows with your players are highlighted.</div>
      {days.map((d) => {
        const games = Object.entries(O[d]).filter(([, v]) => v.home);

          <div key={d} className="bg-white rounded-xl border border-slate-200 overflow-x-auto">

              <tbody>
                {games.map(([home, v]) => {
                  const a = O[d][v.opp] || {};
                  const mineN = count(s.me, home) + count(s.me, v.opp), oppN = opp ? count(opp, home) + count(opp, v.opp) : 0;
                  const fav = v.win >= 0.5 ? home : v.opp;
                  return (
                    <tr key={home} className={"border-t border-slate-100 " + (mineN ? "bg-blue-50" : "")}>

                      <td className="px-3 py-2 whitespace-nowrap">{v.opp} {(a.gf ?? v.ga).toFixed(1)} · {home} {v.gf.toFixed(1)}</td>
                      <td className="px-3 py-2">{(v.gf + v.ga).toFixed(1)}</td>
                      <td className="px-3 py-2">{mineN ? <span className="text-blue-700 font-semibold">{mineN}</span> : "–"}</td>

                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        );
      })}
    </div>
  );
}

// ---------- Playoff planner ----------
function PlayoffPlanner({ s, setS }) {
  const K = s.blend;
  const st = s.poStart ?? 24, nW = s.poWeeks ?? 3;
  const [who, setWho] = useState("fa"); const [pos, setPos] = useState("all"); const [q, setQ] = useState(""); const [showTeams, setShowTeams] = useState(false);
  const weeks = useMemo(() => s.weeks.slice(st, st + nW).map((w) => deriveWeek(w, false)), [s.weeks, st, nW]);
  const dates = weeks.flatMap((w) => w.dates || []);
  const perDay = {}; dates.forEach((d) => (perDay[d] = NHL.filter((t) => SCHED[t] && SCHED[t].has(d)).length / 2));
  const light = new Set(dates.filter((d) => perDay[d] > 0 && perDay[d] <= 5));
  const teamRows = NHL.map((t) => { const per = weeks.map((w) => gms(w, t)); const tot = per.reduce((a, b) => a + b, 0); const off = dates.filter((d) => light.has(d) && SCHED[t].has(d)).length; return { t, per, tot, off }; }).sort((a, b) => b.tot - a.tot || b.off - a.off);
  const avgGames = teamRows.reduce((a, r) => a + r.tot, 0) / teamRows.length;
  const tg = {}; teamRows.forEach((r) => (tg[r.t] = r));
  const val = (p) => { let v = 0; dates.forEach((d) => { if (SCHED[p.t] && SCHED[p.t].has(d)) v += effAvg(p, K, d) * p.prob * avail(p, d); }); return v; };
  const rows = useMemo(() => s.players
    .filter((p) => (who === "all" || (who === "fa" ? p.ft === "fa" : who === "mine" ? p.ft === s.me : p.ft !== "fa" && p.ft !== s.me)) && (pos === "all" || p.p === pos) && p.n.toLowerCase().includes(q.toLowerCase()) && p.prob > 0)
    .map((p) => { const v = val(p); const r = tg[p.t] || { tot: 0, off: 0, per: [] }; return { p, v, g: r.tot, off: r.off, per: r.per, bonus: (r.tot - avgGames) * effAvg(p, K) * p.prob }; })
    .sort((a, b) => b.v - a.v).slice(0, 100), [s.players, who, pos, q, st, nW, K]);
  const league = useMemo(() => s.teams.map((t) => { const r = s.players.filter((p) => p.ft === t.id); return { t, tot: weeks.reduce((a, w) => a + weekProj(r, w, K, 0).total, 0) }; }).sort((a, b) => b.tot - a.tot), [s.players, weeks, K]);
  const myRank = league.findIndex((x) => x.t.id === s.me) + 1;
  const mine = s.players.filter((p) => p.ft === s.me && !p.ir).map((p) => ({ p, g: (tg[p.t] || {}).tot || 0 })).sort((a, b) => a.g - b.g);
  const weakSched = mine.filter((x) => x.g <= avgGames - 1.5);
  const set = (k, v) => setS((x) => ({ ...x, [k]: v }));
  const gCls = (g, avg) => (g >= avg + 1.5 ? "text-green-700 font-semibold" : g <= avg - 1.5 ? "text-red-600" : "");
  const today = todayISO();
  const deadline = "2027-02-26";
  return (
    <div className="space-y-4">
      <Section title="Fantasy playoff planner" sub={`${weeks.length ? `${mdL(weeks[0].dates[0])} – ${mdL(dates[dates.length - 1])}` : ""} · trade deadline ${mdL(deadline)}${today <= deadline ? ` (${Math.round((fromIso(deadline) - fromIso(today)) / 864e5)} days away)` : " (passed)"}`}>
        <div className="flex flex-wrap gap-2 items-center">
          <label>Playoffs start <select className={inp} value={st} onChange={(e) => set("poStart", +e.target.value)}>{s.weeks.map((w, i) => <option key={i} value={i}>{w.label}</option>)}</select></label>
          <label>Weeks <select className={inp} value={nW} onChange={(e) => set("poWeeks", +e.target.value)}>{[1, 2, 3, 4].map((n) => <option key={n} value={n}>{n}</option>)}</select></label>
        </div>
        <div className="text-xs text-slate-500 mt-2">Players are valued on <b>games in your playoff weeks × projection</b>. Average team plays {avgGames.toFixed(1)} games in this window. "Light nights" = 5 or fewer NHL games — easier to fit everyone into your lineup.</div>
      </Section>
      <div className="grid md:grid-cols-2 gap-4">
        <Section title="Your playoff outlook">
          <div className="text-2xl font-bold">#{myRank} <span className="text-sm font-normal text-slate-500">of {league.length} in projected playoff-week points</span></div>
          <div className="mt-2">{league.map((x, i) => <div key={x.t.id} className={"flex justify-between py-1 border-t border-slate-100 " + (x.t.id === s.me ? "text-blue-700 font-semibold" : "")}><span>{i + 1}. {x.t.name}</span><span>{f1(x.tot)}</span></div>)}</div>
          <div className="text-xs text-slate-500 mt-2">Lineup-aware totals for all {nW} weeks with current rosters and projections.</div>
        </Section>
        <Section title="Your players with weak playoff schedules">
          {weakSched.length ? weakSched.map(({ p, g }) => (
            <div key={p.id} className="flex gap-2 py-1.5 border-t border-slate-100"><span className="font-medium">{p.n}</span><span className="text-xs text-slate-400">{p.p} · {p.t}</span><span className="ml-auto text-red-600 text-xs">{g} games ({(g - avgGames).toFixed(1)} vs avg)</span></div>
          )) : <div className="text-green-700">✅ None of your players have a clearly light playoff schedule.</div>}
          <div className="text-xs text-slate-500 mt-2">Trade candidates before the deadline — swap them for similar players with more games.</div>
        </Section>
      </div>
      <Section title="Playoff targets" sub="Ranked by projected points in your playoff weeks. Schedule bonus = extra points from games above the average.">
        <div className="flex flex-wrap gap-2 mb-3">
          <Pills items={[["fa", "Free agents (stash)"], ["other", "Other teams (trade)"], ["mine", "My team"], ["all", "Everyone"]]} value={who} onChange={setWho} />
          <select className={inp} value={pos} onChange={(e) => setPos(e.target.value)}><option value="all">All positions</option><option>F</option><option>D</option><option>G</option></select>
          <input className={inp + " flex-1 min-w-[140px]"} placeholder="Search" value={q} onChange={(e) => setQ(e.target.value)} />
        </div>
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead className="text-left"><tr>{["Player", "", "Owner", ...weeks.map((w, i) => `Wk ${st + i + 1}`), "Games", "Light", "Avg", "Playoff pts", "Sched bonus"].map((h, i) => <th key={i} className="px-2 py-2">{h}</th>)}</tr></thead>
            <tbody>
              {rows.map(({ p, v, g, off, per, bonus }) => (
                <tr key={p.id} className={"border-t border-slate-100 " + (p.ft === s.me ? "bg-blue-50" : "")}>
                  <td className="px-2 py-2 font-medium whitespace-nowrap">{p.n}{p.ir ? <span className="text-red-600 text-xs ml-1">IR</span> : ""}</td>
                  <td className="px-2 py-2 text-xs text-slate-500 whitespace-nowrap">{p.p} · {p.t}</td>
                  <td className="px-2 py-2 text-xs text-slate-500">{teamName(s, p.ft)}</td>
                  {per.map((n, i) => <td key={i} className={"px-2 py-2 " + (n >= 4 ? "text-green-700 font-semibold" : n <= 2 ? "text-red-600" : "")}>{n}</td>)}
                  <td className={"px-2 py-2 " + gCls(g, avgGames)}>{g}</td>
                  <td className="px-2 py-2">{off}</td>
                  <td className="px-2 py-2">{f1(effAvg(p, K))}</td>
                  <td className="px-2 py-2 font-semibold">{f1(v)}</td>
                  <td className={"px-2 py-2 " + (bonus >= 0 ? "text-green-700" : "text-red-600")}>{bonus >= 0 ? "+" : ""}{f1(bonus)}</td>
                </tr>
              ))}
              {rows.length === 0 && <tr><td className="px-2 py-3 text-slate-400">No players match.</td></tr>}
            </tbody>
          </table>
        </div>
      </Section>
      <Section title="NHL team schedules in your playoff weeks" link={[showTeams ? "Hide" : "Show all 32 teams", () => setShowTeams(!showTeams)]}>
        <div className="text-xs text-slate-500 mb-2">Best: {teamRows.slice(0, 5).map((r) => `${r.t} (${r.tot})`).join(", ")} · Worst: {teamRows.slice(-5).reverse().map((r) => `${r.t} (${r.tot})`).join(", ")}</div>
        {showTeams && (
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead className="text-left"><tr>{["Team", ...weeks.map((w, i) => `Wk ${st + i + 1}`), "Total", "Light-night games"].map((h) => <th key={h} className="px-2 py-2">{h}</th>)}</tr></thead>
              <tbody>
                {teamRows.map((r) => (
                  <tr key={r.t} className="border-t border-slate-100">
                    <td className="px-2 py-1.5 font-medium">{r.t}</td>
                    {r.per.map((n, i) => <td key={i} className={"px-2 py-1.5 " + (n >= 4 ? "text-green-700 font-semibold" : n <= 2 ? "text-red-600" : "")}>{n}</td>)}
                    <td className={"px-2 py-1.5 " + gCls(r.tot, avgGames)}>{r.tot}</td>
                    <td className="px-2 py-1.5">{r.off}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </Section>
    </div>
  );
}

// ---------- Trade analyzer ----------
const rosRaw = (p, K) => {
  if (p.ir && !effBack(p).d) return 0;
  const t = todayISO(); let v = 0;
  (SCHED[p.t] ? [...SCHED[p.t]] : []).forEach((d) => { if (d >= t) v += effAvg(p, K, d) * p.prob * avail(p, d); });

function Bulk({ s, setS }) {
  const [mode, setMode] = useState("team"); const [txt, setTxt] = useState(""); const [msg, setMsg] = useState("");
  const help = {
    add: "Name | NHL | Pos | ProjAvg | Play% | Fantasy team (or FA)", avg: "Name | ProjAvg", season: "Name | GP | Season total pts",
    play: "Name | Play% (goalies: start %)   e.g.  Kevin Lankinen | 85", team: "Name | Fantasy team (or FA)   e.g.  Colton Parayko | FA",
  };
  const run = () => {
    const lines = txt.split("\n").map((l) => l.trim()).filter(Boolean);
    let players = [...s.players]; let upd = 0, add = 0; const miss = [];
    const find = (n) => players.findIndex((p) => p.n.toLowerCase() === n.toLowerCase());
    const teamId = (x) => { const v = (x || "").trim().toLowerCase(); if (!v || v === "fa" || v === "free agent") return "fa"; const t = s.teams.find((t) => t.name.toLowerCase() === v || t.id === v); return t ? t.id : null; };
    lines.forEach((l, k) => {
      const f = l.split(/\t|\|/).map((x) => x.trim());
      if (f.length < 2) { miss.push(l); return; }
      const i = find(f[0]);
      if (mode === "add") {
        const tid = teamId(f[5]); const pos = (f[2] || "F").toUpperCase(); const nhl = (f[1] || "").toUpperCase();
        if (tid === null || !NHL.includes(nhl) || !["F", "D", "G"].includes(pos)) { miss.push(l); return; }
        const rec = { n: f[0], t: nhl, p: pos, avg: parseFloat(f[3]) || 0, prob: f[4] === undefined || f[4] === "" ? 1 : (parseFloat(f[4]) || 0) / 100, ft: tid, est: false };
        if (i >= 0) { players[i] = { ...players[i], ...rec }; upd++; } else { players.push({ id: "p" + Date.now() + "_" + k, ir: false, gp: 0, tot: 0, ...rec }); add++; }
        return;
      }
      if (i < 0) { miss.push(f[0]); return; }
      if (mode === "avg") players[i] = { ...players[i], avg: parseFloat(f[1]) || 0, est: false };
      if (mode === "season") players[i] = { ...players[i], gp: parseInt(f[1]) || 0, tot: parseFloat(f[2]) || 0 };
      if (mode === "play") players[i] = { ...players[i], prob: Math.max(0, Math.min(100, parseFloat(f[1]) || 0)) / 100 };
      if (mode === "team") { const tid = teamId(f[1]); if (tid === null) { miss.push(l); return; } players[i] = { ...players[i], ft: tid, ir: false }; }
      upd++;
    });
    setS({ ...s, players });
    setMsg(`Updated ${upd}, added ${add}.` + (miss.length ? ` Not matched (${miss.length}): ${miss.slice(0, 8).join("; ")}` : ""));
  };
  return (
    <div className={box}>
      <div className="font-semibold text-base mb-2">Bulk update</div>
      <div className="flex flex-wrap gap-2 items-center mb-2">
        <select className={inp} value={mode} onChange={(e) => setMode(e.target.value)}>
          <option value="team">Move players (adds, drops, trades)</option>
          <option value="play">Injuries / goalie start %</option>
          <option value="season">Season GP & total</option>
          <option value="avg">Projected averages</option>
          <option value="add">Add or replace players</option>
        </select>
        <button className="bg-blue-600 rounded-lg px-3 py-1.5" onClick={run}>Apply</button>
      </div>
      <div className="text-xs text-slate-500 mb-2">One per line: {help[mode]}</div>
      <textarea className={inp + " w-full h-32 font-mono text-xs"} value={txt} onChange={(e) => setTxt(e.target.value)} />
      {msg && <div className="text-sm mt-2">{msg}</div>}
      <div className="text-xs text-slate-500 mt-2">The next ESPN sync replaces manual roster moves with ESPN's real rosters.</div>
    </div>
  );
}

                <td className="px-2 py-1 font-medium">{t}</td>
                {wk.days.map((_, d) => { const on = (wk.games[t] || []).includes(d); const b2 = on && wk.dates && SCHED[t] && SCHED[t].has(addDays(wk.dates[d], -1)); return <td key={d} className="px-1 py-1 text-center"><span title={b2 ? "2nd night of a back-to-back — backup goalie likely" : ""} className={"inline-block w-7 h-4 rounded " + (b2 ? "bg-amber-500" : on ? "bg-blue-600" : "bg-slate-200")}></span></td>; })}
                <td className={"px-2 py-1 text-center font-semibold " + (gms(wk, t) >= 4 ? "text-green-700" : gms(wk, t) <= 1 ? "text-red-600" : "")}>{gms(wk, t)}</td>
              </tr>
            ))}
            <tr className="border-t-2 border-slate-300"><td className="px-2 py-2 font-semibold">Games/day</td>{perDay.map((n, i) => <td key={i} className={"text-center font-semibold " + (n <= 4 ? "text-green-700" : "")}>{n}</td>)}<td></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  );
}
function Settings({ s, setS }) {
  const E = window.ESPN_DATA;
  const [io, setIo] = useState(""); const [msg, setMsg] = useState("");
  const Sg = E && E.signals;
  const download = () => { const blob = new Blob([JSON.stringify(s)], { type: "application/json" }); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `fantasy-gm-backup-${todayISO()}.json`; a.click(); setMsg("Backup file downloaded — keep it somewhere safe."); };
  const upload = (e) => { const f = e.target.files && e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { const v = JSON.parse(r.result); if (v.players && v.weeks) { setS(migrate(v)); setMsg("Backup restored."); } else setMsg("That file isn't a backup."); } catch (ex) { setMsg("Couldn't read that file."); } }; r.readAsText(f); };
  const row = (ok, label, detail) => <div className="flex gap-2 py-1 border-t border-slate-100"><span>{ok ? "✅" : "⚪"}</span><span className="font-medium">{label}</span><span className="text-slate-500 text-xs ml-auto text-right">{detail}</span></div>;
  return (
    <div className="grid md:grid-cols-2 gap-4">
      <Section title="Data sources" sub={E ? `${E.leagueName || "Your league"} · synced ${fmtTime(E.generated)}` : "No data file found."}>
        {row(!!E, "ESPN league", E ? `${(E.teams || []).length} teams · ${(E.players || []).length} players` : "")}
        {row(!!(E && E.model), "GM model", E && E.model ? `${Object.keys(E.model.base || {}).length} players` : "")}
        {row(!!(E && E.model && E.model.odds && Object.keys(E.model.odds).length), "Betting lines", E && E.model && E.model.odds ? `${Object.keys(E.model.odds).length} days` : "")}
        {row(!!(Sg && Sg.recent), "Recent form", Sg && Sg.recent ? `${Object.keys(Sg.recent).length} players` : "")}
        {row(!!(Sg && Sg.pp1), "PP1 units", Sg && Sg.pp1 ? `checked ${Sg.pp1.asof}` : "")}
        {row(!!(Sg && Sg.news), "News", Sg && Sg.news ? `${Object.keys(Sg.news).length} players` : "")}
        {row(!!(Sg && Sg.injuries), "Injuries", Sg && Sg.injuries ? `${Object.keys(Sg.injuries).length} players` : "")}
        {row(!!(E && E.goalies), "Starting goalies", E && E.goalies ? `${Object.keys(E.goalies).length} days` : "")}
        {E && <button className="border border-slate-300 rounded-lg px-3 py-1.5 mt-3 text-xs" onClick={() => { try { setS(applyESPN(s, E)); setMsg("ESPN data re-applied."); } catch (e) { setMsg(e.message); } }}>Re-apply ESPN data</button>}
      </Section>
      <Section title="Backup & restore" sub="Your settings (goalie start %, return dates, protected players, minimums) live in this browser. Back them up.">
        <div className="flex flex-wrap gap-2">
          <button className="bg-blue-600 rounded-lg px-3 py-1.5" onClick={download}>⬇ Download backup file</button>
          <label className="border border-slate-300 rounded-lg px-3 py-1.5 cursor-pointer">⬆ Restore from file<input type="file" accept=".json,application/json" className="hidden" onChange={upload} /></label>
        </div>
        {msg && <div className="text-xs text-green-700 mt-2">{msg}</div>}
        <details className="mt-3 text-xs text-slate-500">
          <summary className="cursor-pointer">Copy / paste instead</summary>
          <div className="flex gap-2 my-2">
            <button className="border border-slate-300 rounded px-2 py-1" onClick={() => setIo(JSON.stringify(s))}>Export text</button>
            <button className="border border-slate-300 rounded px-2 py-1" onClick={() => { try { const v = JSON.parse(io); if (v.players && v.weeks) { setS(migrate(v)); setMsg("Imported."); } } catch (e) { setMsg("Invalid data"); } }}>Import text</button>
          </div>
          <textarea className={inp + " w-full h-24 font-mono text-xs"} value={io} onChange={(e) => setIo(e.target.value)} />
        </details>
        <button className="text-red-600 text-xs mt-3" onClick={() => { if (confirm("Reset everything? Download a backup first!")) setS(init()); }}>Reset all</button>
      </Section>
      <Section title="Projection settings">
        <label className="flex items-center gap-2">ESPN projection weight (games) <input type="number" min="0" className={inp + " w-20"} value={s.blend} onChange={(e) => setS({ ...s, blend: Math.max(0, parseFloat(e.target.value) || 0) })} /></label>
        <div className="text-xs text-slate-500 mt-1">How fast real results replace ESPN's projection (10 = half-and-half after 10 games).</div>
        <label className="flex items-center gap-2 mt-3"><input type="checkbox" checked={s.autoDone} onChange={(e) => setS({ ...s, autoDone: e.target.checked })} /> Count completed days automatically</label>
      </Section>
      <Section title="Team names">
        {s.teams.map((t) => <div key={t.id} className="flex gap-2 mb-1 items-center"><input className={inp + " flex-1"} value={t.name} onChange={(e) => setS({ ...s, teams: s.teams.map((x) => (x.id === t.id ? { ...x, name: e.target.value } : x)) })} />{t.id === s.me && <span className="text-xs text-blue-700">you</span>}</div>)}
      </Section>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
