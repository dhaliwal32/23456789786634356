function buildPlan(s, wk, d0, M) {

  const minGain = s.minGain ?? 3;

  const val = (p, a) => (wk.games[p.t] || []).filter((d) => d >= a).reduce((t, d) => { const dt = wk.dates[d]; return t + effAvg(p, K, dt) * (p.p === "G" ? gStart(p, dt).v : p.prob) * avail(p, dt); }, 0);

  let tl = myR.map((p) => ({ p, from: 0, to: nD - 1, orig: true }));
  const fas = s.players.filter((p) => p.ft === "fa" && p.prob > 0 && (p.proj !== false || p.gp > 0))
    .map((p) => ({ p, v: val(p, d0) })).filter((x) => x.v > 0).sort((a, b) => b.v - a.v).slice(0, 45).map((x) => x.p);
  let base0 = 0; for (let d = d0; d < nD; d++) base0 += dayTotal(tl, d);
  const steps = [], usedFA = new Set();
  for (let k = 0; k < M; k++) {
    const cur = []; for (let d = d0; d < nD; d++) cur[d] = dayTotal(tl, d);
    const suffix = (a) => { let t = 0; for (let d = a; d < nD; d++) t += cur[d]; return t; };
    let best = null;
    for (let d = d0; d < nD; d++) {
      const active = tl.filter((x) => x.from <= d && x.to >= d);
      const cnt = { F: 0, D: 0, G: 0 }; active.forEach((x) => { if (!x.p.ir) cnt[x.p.p]++; });
      const drops = active.filter((x) => !x.p.ir && x.to === nD - 1 && x.from < d + (x.orig ? 1 : 0) && !(x.orig && prot.has(x.p.id)) && !(!x.orig && x.from >= d))
        .map((x) => ({ x, v: val(x.p, d) })).sort((a, b) => a.v - b.v);
      const cand = []; ["F", "D", "G"].forEach((ps) => drops.filter((y) => y.x.p.p === ps).slice(0, 4).forEach((y) => cand.push(y.x)));
      const before = suffix(d);
      for (const f of fas) {
        if (usedFA.has(f.id) || !(wk.games[f.t] || []).includes(d) || wk.dates[d] < pickStart(f)) continue;
        for (const x of cand) {
          if (x.p.p !== f.p && cnt[x.p.p] - 1 < mins[x.p.p]) continue;
          const tl2 = tl.map((y) => (y === x ? { ...y, to: d - 1 } : y)).concat([{ p: { ...f, ft: s.me }, from: d, to: nD - 1, orig: false }]);

        }
      }
    }

}

      </Section>
      {!left && <div className={box + " text-slate-400"}>No moves left this week.</div>}
      {plan && (
        <Section title={plan.steps.length ? `Your plan: +${f1(plan.gain)} points this week` : "No move is worth it this week"} sub={`${teamName(s, s.me)} ${f1(aA + plan.base)} → ${f1(aA + plan.final)} projected vs ${teamName(s, opp)} ${f1(aB + oppProj)} · margin ${aA + plan.base - aB - oppProj >= 0 ? "+" : ""}${f1(aA + plan.base - aB - oppProj)} → ${aA + plan.final - aB - oppProj >= 0 ? "+" : ""}${f1(aA + plan.final - aB - oppProj)}${wins && wins.after.length ? ` · win chance ${wpTxt(wins.b)} → ${wpTxt(wins.after[wins.after.length - 1])}` : ""}`}>
          {plan.steps.length ? plan.steps.map((st, i) => { const sd = effAvg(st.add, K) - effAvg(st.drop, K); return (
            <div key={i} className="border-t border-slate-100 py-3">
              <div className="flex flex-wrap items-baseline gap-2">
                <span className="text-xs px-2 py-0.5 rounded bg-blue-600">{i + 1}</span>
                <span className="font-semibold">{wk.days[st.day]}</span>
                <span>Add <b>{st.add.n}</b> <span className="text-xs text-slate-400">{st.add.p} · <TeamLogo t={st.add.t} /></span></span>
                <span>· drop <b>{st.drop.n}</b>{st.dropWasStream ? <span className="text-xs text-slate-400"> (streamer from step {plan.steps.findIndex((x) => x.add.id === st.drop.id) + 1})</span> : <span className="text-xs text-slate-400"> {st.drop.p}</span>}</span>
                <span className="ml-auto flex items-baseline gap-3">{wins ? <PlanWin a={i ? wins.after[i - 1] : wins.b} b={wins.after[i]} /> : null}<span className="text-green-700 font-semibold">+{f1(st.gain)}</span></span>
              </div>
              <div className="text-xs text-slate-500 mt-1 ml-8">{st.add.n} plays: {gamesFrom(st.add, st.day) || "—"}{!st.dropWasStream && sd < 0 ? <span className="text-amber-600"> · stream only: {f1(Math.abs(sd))}/game worse long-term than {st.drop.n}</span> : ""} <Tags p={st.add} K={K} /></div>
            </div>
          ); }) : <div className="text-slate-400">No pickup adds at least {s.minGain ?? 3} points this week — save your moves (or lower the minimum gain in Add / Drop settings).</div>}
          {plan.steps.length > 0 && <div className="text-xs text-slate-500 mt-2">Make each move on ESPN on the day shown, before that day's first game. Re-run the plan after each move (and each morning) — injuries, goalie announcements and your opponent's moves change the best plan. {espnUsed != null ? "Your moves count updates from ESPN at the next sync." : 'Set "moves already used" after each one.'}</div>}
        </Section>
      )}
    </div>
  );
}

// ---------- Edges: line promotions, luck, model vs ESPN ----------
function EdgesPanel({ s }) {
  // edges v15: only groups with players, 5 each (news_logos.py)
  const K = s.blend, S = window.__SIG || {}, M = window.__MODEL;
  const pid = (p) => (typeof p.id === "string" && p.id[0] === "e" ? p.id.slice(1) : null);
  const top5 = (l) => l.slice(0, 5);
  const byAvg = (a, b) => effAvg(b, K) - effAvg(a, K);
  const ln = (p) => sigOf(p).lines || {};
  const promoFA = top5(s.players.filter((p) => p.ft === "fa" && ln(p).chg === "up").sort(byAvg));
  const promoOther = top5(s.players.filter((p) => p.ft !== "fa" && p.ft !== s.me && ln(p).chg === "up").sort(byAvg));
  const mineChg = s.players.filter((p) => p.ft === s.me && ln(p).chg);
  const lk = (p) => sigOf(p).luck;
  const lucky = (p) => { const l = lk(p); return l && (l.t === "s" ? l.d >= 2 : l.d >= 4); };
  const unlucky = (p) => { const l = lk(p); return l && (l.t === "s" ? l.d <= -2 : l.d <= -4); };
  const byLuck = (a, b) => Math.abs(lk(b).d) - Math.abs(lk(a).d);
  const sellHigh = top5(s.players.filter((p) => p.ft === s.me && lucky(p)).sort(byLuck));
  const myUnlucky = top5(s.players.filter((p) => p.ft === s.me && unlucky(p)).sort(byLuck));
  const buyLow = top5(s.players.filter((p) => p.ft !== s.me && p.ft !== "fa" && unlucky(p) && effAvg(p, K) >= 5).sort(byLuck));
  const buyFA = top5(s.players.filter((p) => p.ft === "fa" && unlucky(p)).sort(byLuck));
  const luckInfo = (p) => { const l = lk(p); return <span>· {l.t === "s" ? `${l.g} G on ${l.sh} shots, ${l.pct}% vs ${l.cpct}% career` : `SV% ${l.sv.toFixed(3)} vs ${l.csv.toFixed(3)} career`}</span>; };
  const mv = (p) => { const id = pid(p); const mb = M && id ? (M.base || {})[id] : null; return mb != null && p.proj && p.avg > 0 ? { mb, e: p.avg, d: mb - p.avg, r: mb / p.avg } : null; };
  const under = (p) => { const x = mv(p); return x && x.d >= 1 && x.r >= 1.15; };
  const over = (p) => { const x = mv(p); return x && x.d <= -1 && x.r <= 0.85; };
  const uFA = top5(s.players.filter((p) => p.ft === "fa" && under(p)).sort((a, b) => mv(b).d - mv(a).d));
  const uOther = top5(s.players.filter((p) => p.ft !== "fa" && p.ft !== s.me && under(p)).sort((a, b) => mv(b).d - mv(a).d));
  const oMine = top5(s.players.filter((p) => p.ft === s.me && over(p)).sort((a, b) => mv(a).d - mv(b).d));
  const uMine = top5(s.players.filter((p) => p.ft === s.me && under(p)));
  const mvInfo = (p) => { const x = mv(p); return <span className={x.d > 0 ? "text-green-700" : "text-red-600"}>· model {f1(x.mb)} vs ESPN {f1(x.e)} pts/g</span>; };
  const lineNote = (p) => <span className={ln(p).chg === "up" ? "text-green-700" : "text-red-600"}>· {ln(p).chg === "up" ? "moved up to " + (LBL[ln(p).grp] || "a bigger role") : "moved down the lineup"}</span>;
  const None = ({ t }) => <div className="text-slate-400">{t}</div>;
  const Grp = ({ t, list, note }) => (list.length ? (
    <div className="mt-3"><div className="text-xs uppercase tracking-wide text-slate-500 mb-1">{t}</div>{list.map((p) => <PlayerLine key={p.id} s={s} p={p} extra={note ? note(p) : null} />)}</div>
  ) : null);
  const promoAny = promoFA.length + promoOther.length + mineChg.length;
  const luckAny = sellHigh.length + myUnlucky.length + buyLow.length + buyFA.length;
  const mvAny = uFA.length + uOther.length + oMine.length + uMine.length;
  return (
    <div className="space-y-4">
      <Section title="Line promotions" sub="Top-6 forwards and top-4 D get more minutes. Points usually follow within a week.">
        {!S.lines ? <None t="Line data appears after the next sync." /> : promoAny ? (<>
          <Grp t="Free agents: pickup targets" list={promoFA} note={lineNote} />
          <Grp t="Your players" list={mineChg} note={lineNote} />
          <Grp t="Other teams: trade targets" list={promoOther} note={lineNote} />
        </>) : <None t="No line changes since yesterday." />}
      </Section>
      <Section title="Luck" sub="Shooting % and save % this season vs career. Luck evens out, so trade on it.">
        {!S.luck || !Object.keys(S.luck).length ? <None t="Fills in once players have enough shots, usually by late October." /> : luckAny ? (<>
          <Grp t="Sell high: your lucky players" list={sellHigh} note={luckInfo} />
          <Grp t="Buy low: unlucky players on other teams" list={buyLow} note={luckInfo} />
          <Grp t="Unlucky free agents" list={buyFA} note={luckInfo} />
          <Grp t="Your unlucky players: don't sell low" list={myUnlucky} note={luckInfo} />
        </>) : <None t="Nobody is running unusually lucky or unlucky." />}
      </Section>
      <Section title="Model vs ESPN" sub="Where your GM model and ESPN disagree by 15% or more. Most managers only see ESPN's number.">
        {!M ? <None t="Needs the GM model in the sync." /> : mvAny ? (<>
          <Grp t="Undervalued free agents" list={uFA} note={mvInfo} />
          <Grp t="Undervalued on other teams: trade targets" list={uOther} note={mvInfo} />
          <Grp t="Yours that ESPN overrates: sell" list={oMine} note={mvInfo} />
          <Grp t="Yours that ESPN underrates: keep" list={uMine} note={mvInfo} />
          <div className="text-xs text-slate-500 mt-3">Early in the season the model leans on last year's stats, so check why before acting.</div>
        </>) : <None t="The model and ESPN agree on everyone right now." />}
      </Section>
    </div>
  );
}

// ---------- Bench fixer ----------
function BenchFixer({ s }) {
  const K = s.blend;
  const [H, setH] = useState(4);
  const mine = s.players.filter((p) => p.ft === s.me);
  const mins = { F: s.minF ?? 10, D: s.minD ?? 5, G: s.minGo ?? 2 };
  const ranked = mine.filter((p) => !p.ir).sort((a, b) => effAvg(b, K) - effAvg(a, K));
  const prot = new Set([...ranked.slice(0, s.protectTop ?? 8).map((p) => p.id), ...mine.filter((p) => p.keep).map((p) => p.id)]);
  const cnt = { F: 0, D: 0, G: 0 }; mine.forEach((p) => { if (!p.ir) cnt[p.p]++; });
  const res = useMemo(() => {
    const wks = s.weeks.slice(s.wk, s.wk + H).map((w, i) => { const dw = deriveWeek(w, s.autoDone); return { dw, from: i === 0 ? dw.done : 0 }; });
    const tot = (roster, a) => wks.slice(a).reduce((t, x) => t + weekProj(roster, x.dw, K, x.from).total, 0);
    const chronic = {};
    const out = wks.map(({ dw, from }, i) => {
      const wasted = {}; const empty = { F: 0, D: 0, UTIL: 0, G: 0 }; let total = 0;
      dw.days.forEach((dl, d) => {
        if (d < from) return;
        const L = dayLineup(mine, dw, d, K); total += L.total;
        L.bench.forEach((p) => { const w = (wasted[p.id] = wasted[p.id] || { p, g: 0, pts: 0, days: [] }); w.g++; w.pts += p.x; w.days.push(dl.split(",")[0]); const c = (chronic[p.id] = chronic[p.id] || { p, g: 0, pts: 0, wk: 0 }); c.g++; c.pts += p.x; });
        const c = { F: 0, D: 0, UTIL: 0, G: 0 }; L.start.forEach((x) => c[x.slot]++);
        empty.F += 9 - c.F; empty.D += 5 - c.D; empty.UTIL += 1 - c.UTIL; empty.G += 2 - c.G;
      });
      Object.values(wasted).forEach((w) => chronic[w.p.id].wk++);
      const wl = Object.values(wasted).sort((a, b) => b.pts - a.pts);
      let fix = null;
      const openPos = ["F", "D", "G"].filter((k) => (k === "F" ? empty.F + empty.UTIL : k === "D" ? empty.D + empty.UTIL : empty.G) > 0);
      if (wl.length && openPos.length) {
        const drops = wl.map((w) => w.p).filter((p) => !p.ir && !prot.has(p.id)).slice(0, 5);
        const weekPts = (p) => (dw.games[p.t] || []).filter((d) => d >= from).reduce((t, d) => { const dt = dw.dates[d]; return t + effAvg(p, K, dt) * (p.p === "G" ? gStart(p, dt).v : p.prob) * avail(p, dt); }, 0);
        const pool = s.players.filter((p) => p.ft === "fa" && p.prob > 0 && openPos.includes(p.p) && (p.proj !== false || p.gp > 0)).map((p) => ({ p, v: weekPts(p) })).filter((x) => x.v > 0).sort((a, b) => b.v - a.v).slice(0, 25).map((x) => x.p);
        const base = weekProj(mine, dw, K, from).total, baseRest = tot(mine, i);
        drops.forEach((d) => pool.forEach((f) => {
          if (d.p !== f.p && cnt[d.p] - 1 < mins[d.p]) return;
          const r2 = timedMove(mine, s.me, [{ add: f, drop: d }]);
          const g = weekProj(r2, dw, K, from).total - base;
          if (!fix || g > fix.gain) fix = { d, f, gain: g, r2 };
        }));
        if (fix) fix.rest = tot(fix.r2, i) - baseRest;
        if (fix && fix.gain < 1) fix = null;
      }
      return { dw, wl, empty, total, fix, openPos };
    });
    return { weeks: out, chronic: Object.values(chronic).sort((a, b) => b.g - a.g) };
  }, [s.players, s.wk, H, K]);
  const totW = res.weeks.reduce((a, w) => a + w.wl.reduce((x, y) => x + y.g, 0), 0);
  const totP = res.weeks.reduce((a, w) => a + w.wl.reduce((x, y) => x + y.pts, 0), 0);
  const totE = res.weeks.reduce((a, w) => ({ F: a.F + w.empty.F, D: a.D + w.empty.D, UTIL: a.UTIL + w.empty.UTIL, G: a.G + w.empty.G }), { F: 0, D: 0, UTIL: 0, G: 0 });
  const slotTxt = (e) => ["F", "D", "UTIL", "G"].filter((k) => e[k] > 0).map((k) => `${e[k]} ${k}`).join(" · ") || "none";
  return (
    <div className="space-y-4">
      <Section title="Bench fixer" sub="Finds the games your players waste on the bench (more players than slots on busy nights) and the lineup slots you leave empty — then suggests the swap that turns wasted games into points.">
        <div className="flex flex-wrap gap-3 items-center">
          <label>Look ahead <select className={inp} value={H} onChange={(e) => setH(+e.target.value)}><option value={1}>This week</option><option value={2}>2 weeks</option><option value={4}>4 weeks</option><option value={8}>8 weeks</option></select></label>
        </div>
        <div className="grid grid-cols-2 md:grid-cols-3 gap-3 mt-3">
          <Card label="Games wasted on bench" value={totW} sub={`≈ ${f1(totP)} pts lost`} tone={totW ? "bg-red-50 border-red-200" : "bg-green-50 border-green-200"} />
          <Card label="Empty lineup slots" value={totE.F + totE.D + totE.UTIL + totE.G} sub={slotTxt(totE)} />
          <Card label="Moves available" value="3 / week" sub="Each fix below uses one" />
        </div>
      </Section>
      {res.weeks.map((w, i) => (
        <Section key={i} title={w.dw.label} sub={`Projected ${f1(w.total)} pts · wasted ${w.wl.reduce((a, x) => a + x.g, 0)} games · empty slots: ${slotTxt(w.empty)}`}>
          {w.wl.length ? (
            <div className="mb-2">
              <div className="text-xs text-slate-500 mb-1">Sitting on your bench:</div>
              {w.wl.map((x) => <div key={x.p.id} className="flex flex-wrap gap-2 py-1 border-t border-slate-100"><span className="font-medium">{x.p.n}</span><span className="text-xs text-slate-400">{x.p.p} · <TeamLogo t={x.p.t} /></span><span className="text-xs text-red-600">{x.g} game{x.g > 1 ? "s" : ""} wasted ({x.days.join(", ")}) ≈ {f1(x.pts)} pts</span>{prot.has(x.p.id) && <span className="text-xs text-slate-500">protected</span>}</div>)}
            </div>
          ) : <div className="text-green-700 text-sm">No wasted games this week.</div>}
          {w.fix ? (
            <div className="bg-green-50 border border-green-200 rounded-lg p-3 mt-2">
              <div className="font-semibold">Fix: drop <b>{w.fix.d.n}</b> <span className="text-xs text-slate-500 font-normal">({w.fix.d.p})</span> → add <b>{w.fix.f.n}</b> <span className="text-xs text-slate-500 font-normal">{w.fix.f.p} · <TeamLogo t={w.fix.f.t} /></span> <span className="text-green-700 ml-2">+{f1(w.fix.gain)} this week</span>{H > 1 && i < res.weeks.length - 1 ? <span className="text-xs text-slate-500 ml-2">(+{f1(w.fix.rest)} through week {s.wk + res.weeks.length})</span> : null}</div>
              <div className="text-xs text-slate-500 mt-1">Fills your empty {w.openPos.join("/")} slots with a player who actually gets into your lineup.{effAvg(w.fix.f, K) < effAvg(w.fix.d, K) ? ` Long-term ${w.fix.f.n} is ${f1(effAvg(w.fix.d, K) - effAvg(w.fix.f, K))}/game worse — treat it as a stream.` : " He's also as good or better per game — a keeper."} <Tags p={w.fix.f} K={K} /></div>
            </div>
          ) : w.wl.length && !w.openPos.length ? <div className="text-xs text-slate-500 mt-1">No empty slots elsewhere this week — the wasted games are just a busy schedule. A 2-for-1 trade is the long-term fix.</div>
            : w.wl.length ? <div className="text-xs text-slate-500 mt-1">No free agent at an open position beats keeping your bench player this week.</div> : null}
        </Section>
      ))}
      <Section title="Chronic bench players" sub="Players who keep getting squeezed out week after week — the best candidates to trade 2-for-1 or swap for a position you're short on.">
        {res.chronic.filter((c) => c.wk >= 2).length ? res.chronic.filter((c) => c.wk >= 2).map((c) => (
          <PlayerLine key={c.p.id} s={s} p={c.p} extra={<span className="text-xs text-red-600">benched {c.g} games across {c.wk} weeks ≈ {f1(c.pts)} pts{prot.has(c.p.id) ? " · protected — package him in a trade rather than dropping" : ""}</span>} />
        )) : <div className="text-slate-400 text-xs">Nobody is stuck on your bench more than one week in this window.</div>}
      </Section>
    </div>
  );
}

// ---------- Playoff planner ----------
function PlayoffPlanner({ s, setS }) {
  const K = s.blend;
  const st = s.poStart ?? 24, nW = s.poWeeks ?? 3;
  const [who, setWho] = useState("fa"); const [pos, setPos] = useState("all"); const [q, setQ] = useState(""); const [showTeams, setShowTeams] = useState(false);
  const weeks = useMemo(() => s.weeks.slice(st, st + nW).map((w) => deriveWeek(w, false)), [s.weeks, st, nW]);
  const dates = weeks.flatMap((w) => w.dates || []);
  const perDay = {}; dates.forEach((d) => (perDay[d] = NHL.filter((t) => SCHED[t] && SCHED[t].has(d)).length / 2));
  const light = new Set(dates.filter((d) => perDay[d] > 0 && perDay[d] <= 5));
  const teamRows = NHL.map((t) => { const per = weeks.map((w) => gms(w, t)); const tot = per.reduce((a, b) => a + b, 0); const off = dates.filter((d) => light.has(d) && SCHED[t].has(d)).length; return { t, per, tot, off }; }).sort((a, b) => b.tot - a.tot || b.off - a.off);
  const avgGames = teamRows.reduce((a, r) => a + r.tot, 0) / teamRows.length;
  const tg = {}; teamRows.forEach((r) => (tg[r.t] = r));
  const val = (p) => { let v = 0; dates.forEach((d) => { if (SCHED[p.t] && SCHED[p.t].has(d)) v += effAvg(p, K, d) * p.prob * avail(p, d); }); return v; };
  const rows = useMemo(() => s.players
    .filter((p) => (who === "all" || (who === "fa" ? p.ft === "fa" : who === "mine" ? p.ft === s.me : p.ft !== "fa" && p.ft !== s.me)) && (pos === "all" || p.p === pos) && p.n.toLowerCase().includes(q.toLowerCase()) && p.prob > 0)
    .map((p) => { const v = val(p); const r = tg[p.t] || { tot: 0, off: 0, per: [] }; return { p, v, g: r.tot, off: r.off, per: r.per, bonus: (r.tot - avgGames) * effAvg(p, K) * p.prob }; })
    .sort((a, b) => b.v - a.v).slice(0, 100), [s.players, who, pos, q, st, nW, K]);
  const league = useMemo(() => s.teams.map((t) => { const r = s.players.filter((p) => p.ft === t.id); return { t, tot: weeks.reduce((a, w) => a + weekProj(r, w, K, 0).total, 0) }; }).sort((a, b) => b.tot - a.tot), [s.players, weeks, K]);
  const myRank = league.findIndex((x) => x.t.id === s.me) + 1;
  const mine = s.players.filter((p) => p.ft === s.me && !p.ir).map((p) => ({ p, g: (tg[p.t] || {}).tot || 0 })).sort((a, b) => a.g - b.g);
  const weakSched = mine.filter((x) => x.g <= avgGames - 1.5);
  const set = (k, v) => setS((x) => ({ ...x, [k]: v }));
  const gCls = (g, avg) => (g >= avg + 1.5 ? "text-green-700 font-semibold" : g <= avg - 1.5 ? "text-red-600" : "");
  const today = todayISO();
  const deadline = "2027-02-26";
  return (
    <div className="space-y-4">
      <Section title="Fantasy playoff planner" sub={`${weeks.length ? `${mdL(weeks[0].dates[0])} – ${mdL(dates[dates.length - 1])}` : ""} · trade deadline ${mdL(deadline)}${today <= deadline ? ` (${Math.round((fromIso(deadline) - fromIso(today)) / 864e5)} days away)` : " (passed)"}`}>
        <div className="flex flex-wrap gap-2 items-center">
          <label>Playoffs start <select className={inp} value={st} onChange={(e) => set("poStart", +e.target.value)}>{s.weeks.map((w, i) => <option key={i} value={i}>{w.label}</option>)}</select></label>
          <label>Weeks <select className={inp} value={nW} onChange={(e) => set("poWeeks", +e.target.value)}>{[1, 2, 3, 4].map((n) => <option key={n} value={n}>{n}</option>)}</select></label>
        </div>
        <div className="text-xs text-slate-500 mt-2">Players are valued on <b>games in your playoff weeks × projection</b>. Average team plays {avgGames.toFixed(1)} games in this window. "Light nights" = 5 or fewer NHL games — easier to fit everyone into your lineup.</div>
      </Section>
      <div className="grid md:grid-cols-2 gap-4">
        <Section title="Your playoff outlook">
          <div className="text-2xl font-bold">#{myRank} <span className="text-sm font-normal text-slate-500">of {league.length} in projected playoff-week points</span></div>
          <div className="mt-2">{league.map((x, i) => <div key={x.t.id} className={"flex justify-between py-1 border-t border-slate-100 " + (x.t.id === s.me ? "text-blue-700 font-semibold" : "")}><span>{i + 1}. {x.t.name}</span><span>{f1(x.tot)}</span></div>)}</div>
          <div className="text-xs text-slate-500 mt-2">Lineup-aware totals for all {nW} weeks with current rosters and projections.</div>
        </Section>
        <Section title="Your players with weak playoff schedules">
          {weakSched.length ? weakSched.map(({ p, g }) => (
            <div key={p.id} className="flex gap-2 py-1.5 border-t border-slate-100"><span className="font-medium">{p.n}</span><span className="text-xs text-slate-400">{p.p} · <TeamLogo t={p.t} /></span><span className="ml-auto text-red-600 text-xs">{g} games ({(g - avgGames).toFixed(1)} vs avg)</span></div>
          )) : <div className="text-green-700">None of your players have a clearly light playoff schedule.</div>}

// ---------- 2-for-1 builder ----------
function TwoForOne({ s, initPartner }) {
  const K = s.blend;
  const today = todayISO();
  const others = s.teams.filter((t) => t.id !== s.me);
  const [partner, setPartner] = useState(initPartner || (others[0] || {}).id || "");
  const [give, setGive] = useState([]); const [get, setGet] = useState([]);
  const [faPick, setFaPick] = useState({});
  const [sugg, setSugg] = useState(null); const [busy, setBusy] = useState(false);

  const nR = s.weeks.length - s.wk;
  const gl = (p) => [...(SCHED[p.t] || [])].filter((d) => d >= today && avail(p, d) > 0).length;
  const tv = useMemo(() => { const o = {}; s.players.forEach((p) => { if (p.ft !== "fa" || p.proj !== false || p.gp > 0) o[p.id] = rosRaw(p, K); }); return o; }, [s.players, K, window.__PMODE]);
  const vv = (p) => effAvg0(p, K) * (p.p === "G" ? p.prob : 1);
  const rep = useMemo(() => { const o = {}; ["F", "D", "G"].forEach((k) => { const l = s.players.filter((p) => p.ft === "fa" && p.p === k && p.prob > 0 && (p.proj !== false || p.gp > 0)).map(vv).sort((a, b) => b - a).slice(0, 5); o[k] = l.length ? l.reduce((a, b) => a + b, 0) / l.length : 0; }); return o; }, [s.players, K]);
  const pe = (p) => Math.max(0, vv(p) - (rep[p.p] || 0)) * gl(p);
  const mine = s.players.filter((p) => p.ft === s.me);
  const theirs = s.players.filter((p) => p.ft === partner);
  const fas = useMemo(() => s.players.filter((p) => p.ft === "fa" && p.prob > 0 && tv[p.id] > 0).sort((a, b) => tv[b.id] - tv[a.id]).slice(0, 40), [tv]);
  const posOK = (roster) => { const c = { F: 0, D: 0, G: 0 }; roster.forEach((p) => { if (!p.ir) c[p.p]++; }); return ["F", "D", "G"].every((k) => c[k] >= mins[k]); };
  const valueFlags = (p) => {
    const f = [], g = sigOf(p), l = g.luck, id = typeof p.id === "string" && p.id[0] === "e" ? p.id.slice(1) : null;
    const mb = window.__MODEL && id ? (window.__MODEL.base || {})[id] : null;
    if (mb != null && p.proj && p.avg > 0) {
      if (mb / p.avg <= 0.85 && p.avg - mb >= 1) f.push({ t: "ESPN overrates", sell: true });

    }
    if (l && ((l.t === "s" && l.d >= 2) || (l.t === "g" && l.d >= 4))) f.push({ t: "lucky", sell: true });
    if (l && ((l.t === "s" && l.d <= -2) || (l.t === "g" && l.d <= -4))) f.push({ t: "unlucky", sell: false });
    if ((formRatio(p, K) || 0) >= 1.25) f.push({ t: "hot streak", sell: true });
    const t = g.toi;

    if (g.lines && g.lines.chg === "up") f.push({ t: "↑ promoted", sell: false });

  };
  const sellFlags = (p) => valueFlags(p).filter((x) => x.sell).map((x) => x.t);
  const buyFlags = (p) => valueFlags(p).filter((x) => !x.sell).map((x) => x.t);
  const toggle = (arr, set, id) => set(arr.includes(id) ? arr.filter((x) => x !== id) : [...arr, id]);
  const G = mine.filter((p) => give.includes(p.id)), Rr = theirs.filter((p) => get.includes(p.id));
  const extra = Math.max(0, G.length - Rr.length);
  const manual = useMemo(() => {
    if (!G.length || !Rr.length) return null;

    for (let k = 0; k < extra; k++) {

      if (!ch) { let best = null; fas.filter((f) => !fills.includes(f)).slice(0, 15).forEach((f) => { const v = horizonTotal([...after, { ...f, ft: s.me }], s, nR); if (!best || v > best.v) best = { f, v }; }); ch = best && best.f; }
      if (ch) { fills.push(ch); after = [...after, { ...ch, ft: s.me }]; }

    return { fills, myR: horizonTotal(after, s, nR) - base, my4: horizonTotal(after, s, 4) - base4, noFill, thR: horizonTotal(thAfter, s, nR) - horizonTotal(theirs, s, nR), ok: posOK(after) };
  }, [give.join(), get.join(), partner, JSON.stringify(faPick), s.players, s.wk]);
  const findTrades = () => {
    setBusy(true);
    setTimeout(() => {
      const mineR = mine.filter((p) => !p.ir);
      const keep = new Set([...mineR].sort((a, b) => tv[b.id] - tv[a.id]).slice(0, 2).map((p) => p.id));
      const bestFA = {}; ["F", "D", "G"].forEach((k) => (bestFA[k] = fas.find((f) => f.p === k)));
      const cands = [];
      others.forEach((t) => {
        s.players.filter((p) => p.ft === t.id && !p.ir).sort((a, b) => (tv[b.id] || 0) - (tv[a.id] || 0)).slice(0, 4).forEach((T) => {
          const pool = mineR.filter((p) => !keep.has(p.id) && (tv[p.id] || 0) < (tv[T.id] || 0));

            const short = ["F", "D", "G"].filter((k) => c[k] < mins[k]);

        const perc = (pe(c.A) + pe(c.B) - pe(c.T)) / Math.max(1, pe(c.T));
        return { ...c, myR: horizonTotal(after, s, nR) - base, thR: horizonTotal(thAfter, s, nR) - horizonTotal(th, s, nR), perc };
      }).filter((x) => x.myR > 0).sort((a, b) => b.myR - a.myR).slice(0, 8);
      setSugg(out); setBusy(false);
    }, 30);
  };
  const load = (x) => { setPartner(x.t.id); setGive([x.A.id, x.B.id]); setGet([x.T.id]); setFaPick({ 0: x.fa.id }); window.scrollTo(0, document.body.scrollHeight); };
  const order = { F: 0, D: 1, G: 2 };
  const Pick = ({ list, sel, set, title }) => (
    <Section title={title}>
      {list.sort((a, b) => order[a.p] - order[b.p] || (tv[b.id] || 0) - (tv[a.id] || 0)).map((p) => (
        <label key={p.id} className={"flex items-center gap-2 py-1 px-1 rounded " + (sel.includes(p.id) ? "bg-blue-50" : "")}>
          <input type="checkbox" checked={sel.includes(p.id)} onChange={() => toggle(sel, set, p.id)} />
          <span className="flex-1">{p.n} <span className="text-xs text-slate-400">{p.p} · <TeamLogo t={p.t} />{p.ir ? " · IR" : ""}</span> {valueFlags(p).map((f) => <span key={f.t} className={"text-xs ml-1 " + (f.sell ? "text-amber-600" : "text-green-700")}>{f.t}</span>)}</span>
          <span className="text-xs text-slate-500 whitespace-nowrap" title="Per game: your model vs what other managers see (ESPN projection + actual points)">{f1(effAvg(p, K) * (p.p === "G" ? p.prob : 1))} <span className="text-slate-400">vs {f1(vv(p))}</span>/g</span>
        </label>
      ))}
    </Section>
  );

  const peG = G.reduce((a, p) => a + pe(p), 0), peR = Rr.reduce((a, p) => a + pe(p), 0);
  const tvG = G.reduce((a, p) => a + (tv[p.id] || 0), 0), tvR = Rr.reduce((a, p) => a + (tv[p.id] || 0), 0) + (manual ? manual.fills.reduce((a, f) => a + tv[f.id], 0) : 0);

// ---------- Trade analyzer ----------
const rosRaw = (p, K) => {
  if (p.ir && !effBack(p).d) return 0;
  const t = todayISO(); let v = 0;
  (SCHED[p.t] ? [...SCHED[p.t]] : []).forEach((d) => { if (d >= t) v += effAvg(p, K, d) * p.prob * avail(p, d); });
  return v;
};
const horizonTotal = (roster, s, n) => { let t = 0; s.weeks.slice(s.wk, s.wk + n).forEach((w, i) => { const dw = deriveWeek(w, s.autoDone); t += weekProj(roster, dw, s.blend, i === 0 ? dw.done : 0).total; }); return t; };
function TradeAnalyzer({ s, initPartner }) {
  const K = s.blend;
  const others = s.teams.filter((t) => t.id !== s.me);
  const [partner, setPartner] = useState(initPartner || (others[0] || {}).id || "");
  const [give, setGive] = useState([]); const [get, setGet] = useState([]);
  const mine = s.players.filter((p) => p.ft === s.me), theirs = s.players.filter((p) => p.ft === partner);
  const order = { F: 0, D: 1, G: 2 };
  const vals = useMemo(() => { const o = {}; [...mine, ...theirs].forEach((p) => (o[p.id] = rosRaw(p, K))); return o; }, [s.players, partner, K]);
  const toggle = (arr, set, id) => set(arr.includes(id) ? arr.filter((x) => x !== id) : [...arr, id]);
  const G = mine.filter((p) => give.includes(p.id)), Rr = theirs.filter((p) => get.includes(p.id));
  const ready = G.length > 0 && Rr.length > 0;
  const res = useMemo(() => {
    if (!ready) return null;
    const myAfter = [...mine.filter((p) => !give.includes(p.id)), ...Rr.map((p) => ({ ...p, ft: s.me }))];
    const thAfter = [...theirs.filter((p) => !get.includes(p.id)), ...G.map((p) => ({ ...p, ft: partner }))];

function PowerRankings({ s, setS }) {

        const v = weekProj(r, dw, K, from).total; ros += v; if (i < 4) n4 += v; days += Math.max(0, dw.days.length - from);
      });

      const grp = { F: perGame("F", 10), D: perGame("D", 5), G: perGame("G", 2) };
      const out = r.filter((p) => p.ir || avail(p, today) === 0).length;
      return { t, ros, n4, strength: days ? (ros / days) * 7 : 0, grp, out };
    });

    });
    rows.forEach((x) => (x.rec = rec[x.t.id]));

    const grpRank = {}; ["F", "D", "G"].forEach((k) => { [...rows].sort((a, b) => b.grp[k] - a.grp[k]).forEach((x, i) => { grpRank[x.t.id] = { ...(grpRank[x.t.id] || {}), [k]: i + 1 }; }); });
    return { rows, avg, grpRank, max: rows.length ? rows[0].strength : 1 };
  }, [s.players, s.weeks, s.wk, K, s.autoDone, window.__PMODE]);

  const prevKey = Object.keys(hist).map(Number).filter((k) => k < s.wk).sort((a, b) => b - a)[0];

  const tier = (x) => { const d = (x.strength - data.avg) / (data.avg || 1); return d >= 0.06 ? ["Title contender", "bg-green-100 text-green-800"] : d >= 0 ? ["Playoff team", "bg-blue-50 text-blue-700"] : d >= -0.06 ? ["Bubble", "bg-amber-100 text-amber-800"] : ["Long shot", "bg-red-100 text-red-800"]; };
  const games = data.rows.reduce((a, x) => Math.max(a, x.rec.n), 0);
  return (
    <div className="space-y-4">
      <Section title="Power rankings" sub={`Every team measured the same way: projected points per 7 days for the rest of the season, with optimized daily lineups, real NHL schedules, injuries and return dates, goalie start chances and your projection mode (${window.__PMODE === "model" ? "GM model" : window.__PMODE === "blend" ? "Blend" : "ESPN"}). As games are played, projections shift to players' actual averages automatically.`}>
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead className="text-left"><tr>{["#", "", "Team", "Strength / wk", "", "Next 4 wks", "Rest of season", "F / D / G rank", "Out", "Record", "Actual / wk"].map((h, i) => <th key={i} className="px-2 py-2 whitespace-nowrap">{h}</th>)}</tr></thead>
            <tbody>
              {data.rows.map((x, i) => {
                const mv = prev && prev[x.t.id] ? prev[x.t.id] - (i + 1) : 0;
                const [tl, tc] = tier(x); const gr = data.grpRank[x.t.id] || {};
                return (

          : <>You lead #2 {below ? below.t.name : ""} by <b className="text-green-700">{f1(me.strength - (below ? below.strength : 0))} pts/week</b> — a small edge, so keep improving.</>}

    if (!cands.length) cands = r.filter(ok);
    const b = lineupAware ? total(r) : 0;
    let best = null;
    cands.forEach((d) => { const g = lineupAware ? total(timedMove(r, s.me, [{ add: f, drop: d }])) - b : rawPts(f) - rawPts(d, f); if (!best || g > best.g) best = { d, g }; });

  };
  const setAdd = (i, id) => {
    const f = byId(id);

  const removeMove = (i) => { setMoves((ms) => ms.filter((_, k) => k !== i)); setFocus(0); setOpenI(-1); };

    return fas.filter((p) => p.prob > 0 && !used.has(p.id) && nrm(p.n).includes(q)).sort((a, b) => effAvg(b, K) - effAvg(a, K)).slice(0, 8);
  };

// ---------- Setup ----------
function Bulk({ s, setS }) {
  const [mode, setMode] = useState("team"); const [txt, setTxt] = useState(""); const [msg, setMsg] = useState("");
  const help = {
    add: "Name | NHL | Pos | ProjAvg | Play% | Fantasy team (or FA)", avg: "Name | ProjAvg", season: "Name | GP | Season total pts",
    play: "Name | Play% (goalies: start %)   e.g.  Kevin Lankinen | 85", team: "Name | Fantasy team (or FA)   e.g.  Colton Parayko | FA",
  };
  const run = () => {
    const lines = txt.split("\n").map((l) => l.trim()).filter(Boolean);
    let players = [...s.players]; let upd = 0, add = 0; const miss = [];
    const find = (n) => players.findIndex((p) => p.n.toLowerCase() === n.toLowerCase());
    const teamId = (x) => { const v = (x || "").trim().toLowerCase(); if (!v || v === "fa" || v === "free agent") return "fa"; const t = s.teams.find((t) => t.name.toLowerCase() === v || t.id === v); return t ? t.id : null; };
    lines.forEach((l, k) => {
      const f = l.split(/\t|\|/).map((x) => x.trim());
      if (f.length < 2) { miss.push(l); return; }
      const i = find(f[0]);
      if (mode === "add") {
        const tid = teamId(f[5]); const pos = (f[2] || "F").toUpperCase(); const nhl = (f[1] || "").toUpperCase();
        if (tid === null || !NHL.includes(nhl) || !["F", "D", "G"].includes(pos)) { miss.push(l); return; }
        const rec = { n: f[0], t: nhl, p: pos, avg: parseFloat(f[3]) || 0, prob: f[4] === undefined || f[4] === "" ? 1 : (parseFloat(f[4]) || 0) / 100, ft: tid, est: false };
        if (i >= 0) { players[i] = { ...players[i], ...rec }; upd++; } else { players.push({ id: "p" + Date.now() + "_" + k, ir: false, gp: 0, tot: 0, ...rec }); add++; }
        return;
      }
      if (i < 0) { miss.push(f[0]); return; }
      if (mode === "avg") players[i] = { ...players[i], avg: parseFloat(f[1]) || 0, est: false };
      if (mode === "season") players[i] = { ...players[i], gp: parseInt(f[1]) || 0, tot: parseFloat(f[2]) || 0 };
      if (mode === "play") players[i] = { ...players[i], prob: Math.max(0, Math.min(100, parseFloat(f[1]) || 0)) / 100 };
      if (mode === "team") { const tid = teamId(f[1]); if (tid === null) { miss.push(l); return; } players[i] = { ...players[i], ft: tid, ir: false }; }
      upd++;
    });
    setS({ ...s, players });
    setMsg(`Updated ${upd}, added ${add}.` + (miss.length ? ` Not matched (${miss.length}): ${miss.slice(0, 8).join("; ")}` : ""));
  };
  return (
    <div className={box}>
      <div className="font-semibold text-base mb-2">Bulk update</div>
      <div className="flex flex-wrap gap-2 items-center mb-2">
        <select className={inp} value={mode} onChange={(e) => setMode(e.target.value)}>
          <option value="team">Move players (adds, drops, trades)</option>
          <option value="play">Injuries / goalie start %</option>
          <option value="season">Season GP & total</option>
          <option value="avg">Projected averages</option>
          <option value="add">Add or replace players</option>
        </select>
        <button className="bg-blue-600 rounded-lg px-3 py-1.5" onClick={run}>Apply</button>

function PhoneFeed() {
  const [box, setBox] = useState(null);
  const [err, setErr] = useState("");
  const [show, setShow] = useState(5);
  const load = () => fetch("notify_outbox.json?t=" + Date.now())
    .then((r) => (r.ok ? r.json() : Promise.reject(r.status)))
    .then((b) => { setBox(b); setErr(""); })
    .catch(() => setErr("No notification history yet. It appears after the next sync."));
  useEffect(() => { load(); const id = setInterval(load, 2 * 60 * 1000); return () => clearInterval(id); }, []);
  const when = (iso) => { const d = toDate(iso); return d ? d.toLocaleString("en-US", { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : ""; };
  const SEC = { lineup: "Lineup", mine: "Your players", pickup: "Pickup idea", other: "Other" };
  const items = (box && box.items) || [];
  const waiting = items.filter((i) => !i.sent).reverse();
  const urgent = items.filter((i) => i.sent && (i.via === "urgent" || (!i.via && i.urgent))).map((i) => ({ at: i.sent_at || i.at, kind: "urgent", title: i.title, body: i.text }));
  const sent = [...urgent, ...((box && box.log) || [])].sort((a, b) => (a.at < b.at ? 1 : -1));
  const label = { urgent: "Sent right away", morning: "Morning summary", pregame: "Pre-game summary" };
  return (
    <Section title="Phone notifications" sub="Everything your phone gets from ntfy, newest first. Checks for new ones every 2 minutes.">
      {err ? <div className="text-slate-400">{err}</div> : !box ? <div className="text-slate-400">Loading…</div> : (
        <div className="space-y-5 mt-2">
          <div>
            <div className="text-xs uppercase tracking-wide text-slate-400 mb-1">Waiting for the next summary ({waiting.length})</div>
            {waiting.length ? waiting.map((i) => (
              <div key={i.k} className="flex flex-wrap items-baseline gap-2 py-2 border-t border-slate-100">
                <span className={"text-xs px-2 py-0.5 rounded " + (i.urgent ? "bg-red-100 text-red-600" : "bg-slate-200 text-slate-500")}>{i.urgent ? "Urgent (quiet hours)" : SEC[i.section] || "Other"}</span>
                <span className="text-sm text-slate-700 flex-1 min-w-[200px]">{i.text}</span>
                <span className="text-xs text-slate-400">{when(i.at)}</span>
              </div>
            )) : <div className="text-sm text-slate-400">Nothing waiting.</div>}
          </div>
          <div>
            <div className="text-xs uppercase tracking-wide text-slate-400 mb-1">Sent to your phone</div>
            {sent.length ? sent.slice(0, show).map((m, i) => (
              <div key={i} className="py-3 border-t border-slate-100">
                <div className="flex flex-wrap items-baseline gap-2">
                  <span className={"text-xs px-2 py-0.5 rounded " + (m.kind === "urgent" ? "bg-red-100 text-red-600" : "bg-blue-50 text-blue-600")}>{label[m.kind] || m.kind}</span>
                  <span className="font-medium">{m.title}</span>
                  <span className="text-xs text-slate-400 ml-auto">{when(m.at)}</span>
                </div>
                <div className="text-sm text-slate-600 mt-1 whitespace-pre-wrap">{m.body}</div>
              </div>
            )) : <div className="text-sm text-slate-400">Nothing sent yet. Your first summary arrives after 8 AM.</div>}
            {sent.length > show && <button className="text-sm text-blue-600 mt-2" onClick={() => setShow(show + 12)}>Show older</button>}
          </div>
        </div>
      )}
    </Section>
  );
}
// ---------- team logos, game times and news filter (news_logos.py) ----------
const NHL_LOGO = { LA: "LAK", NJ: "NJD", SJ: "SJS", TB: "TBL" };
function TeamLogo({ t, size }) {
  const [bad, setBad] = useState(false);
  if (!t) return null;
  const z = size || 28;
  if (bad) return <span>{t}</span>;
  return <img src={"https://assets.nhle.com/logos/nhl/svg/" + (NHL_LOGO[t] || t) + "_dark.svg"} alt={t} title={t} loading="lazy" onError={() => setBad(true)} style={{ width: z, height: z, objectFit: "contain", display: "inline-block", verticalAlign: "middle" }} />;
}
const gameOf = (t, dt) => { const G = (window.GAMES_DATA || {}).games || {}; return dt && G[dt] ? G[dt][t] || null : null; };
const gameTime = (g) => { const d = g && g.st ? new Date(g.st) : null; return d && !isNaN(d) ? d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "time TBD"; };
const NEWS_JUNK = /highlights|draft board|rankings|mailbag|podcast|give me a reason|league-winners|sleepers|\bbusts\b|best bets|predictions|betting|\bodds\b|takeaways|\bgrades\b|cheat sheet|start.?sit|waiver wire|what we learned/i;
const NEWS_KINDS = [
  ["trade", "Trade", /\btrade|traded|acquir|deal sends/i],
  ["scratch", "Scratched", /scratch/i],
  ["susp", "Suspended", /suspen/i],
  ["injury", "Injury", /injur|\bIR\b|surgery|day-to-day|week-to-week|month-to-month|out for|out indefinitely|will miss|expected to miss|sidelined|concussion|upper-body|lower-body|leaves game|left the game|ruled out|won't play|will not play|questionable|doubtful/i],
  ["roster", "Roster move", /waive|claimed|recall|reassign|sent down|assigned to|loaned|signs|signed|extension|contract|released|buyout|activated|returns|back in the lineup|cleared/i],
  ["hot", "Hot", /streak|hat trick|multi-point|career-high|promot|top line|top-line|first line|pp1|two goals|three points|four points|scores twice|milestone|\brecord\b/i],
];
const NEWS_DAYS = { trade: 7, scratch: 7, susp: 7, injury: 7, roster: 7, hot: 3, news: 1 };
const NEWS_RANK = { injury: 0, scratch: 0, susp: 0, trade: 1, roster: 2, hot: 3, news: 4 };
const NEWS_BIG = new Set(["trade", "scratch", "susp", "injury", "roster"]);
const NEWS_OUT = new Set(["injury", "scratch", "susp"]);
const NEWS_CLS = { injury: "text-red-600", scratch: "text-red-600", susp: "text-red-600", trade: "text-blue-600", roster: "text-blue-600", hot: "text-orange-600" };
const NEWS_BADGE = { injury: "bg-red-100 text-red-600", scratch: "bg-red-100 text-red-600", susp: "bg-red-100 text-red-600", trade: "bg-blue-50 text-blue-600", roster: "bg-slate-200 text-slate-600", hot: "bg-amber-100 text-orange-600" };
const newsAge = (d) => { if (!d) return 0; const a = Math.round((fromIso(todayISO()) - fromIso(String(d).slice(0, 10))) / 864e5); return isNaN(a) ? 0 : Math.max(0, a); };
const newsOf = (p) => {
  const last = nrm(p.n).split(" ").pop();
  return (sigOf(p).news || []).map((n) => {
    const h = n.h || "";
    if (!h || NEWS_JUNK.test(h) || !nrm(h).includes(last)) return null;
    const k = NEWS_KINDS.find((x) => x[2].test(h));
    const kind = k ? k[0] : "news", age = newsAge(n.d);
    return age < NEWS_DAYS[kind] ? { ...n, kind, label: k ? k[1] : "", age } : null;
  }).filter(Boolean).sort((a, b) => NEWS_RANK[a.kind] - NEWS_RANK[b.kind] || a.age - b.age);
};

  const vv = (p) => effAvg0(p, K) * (p.p === "G" ? p.prob : 1);
  const gl = (p) => [...(SCHED[p.t] || [])].filter((d) => d >= today && avail(p, d) > 0).length;
  const cnt = (r) => { const c = { F: 0, D: 0, G: 0 }; r.forEach((p) => { if (!p.ir) c[p.p]++; }); return c; };
  const tv = useMemo(() => { const o = {}; s.players.forEach((p) => { if (p.ft !== "fa" || p.proj !== false || p.gp > 0) o[p.id] = rosRaw(p, K); }); return o; }, [s.players, K, window.__PMODE]);

                {edit === p.id ? <div className="flex items-center gap-2 mt-2"><input type="date" className={inp} value={eb.d} onChange={(e) => upd(p.id, { back: e.target.value })} /><button className="text-sm text-blue-600" onClick={() => setEdit(null)}>Done</button></div> : null}
              </div>
              {edit === p.id ? null : <button className="text-sm text-blue-600 whitespace-nowrap" onClick={() => setEdit(p.id)}>Change</button>}
            </div>
          ); }) : <div className="text-green-700">Everyone is healthy.</div>}
        </Section>
        <Section title="Protected players" sub="Never suggested as drops anywhere in the app. Players on IR are never dropped.">
          <label className="flex flex-wrap items-center gap-2 text-sm"><span>Always protect my top</span>
            <select className={inp} value={top} onChange={(e) => setS((st) => ({ ...st, protectTop: +e.target.value }))}>{[...Array(13)].map((_, n) => <option key={n} value={n}>{n}</option>)}</select>
            <span>players</span></label>
          {auto.length ? (
            <div className="mt-3 flex flex-wrap gap-2">{auto.map((p) => <span key={p.id} className={chip + "border-slate-200 text-slate-600"}><TeamLogo t={p.t} size={18} />{p.n}</span>)}</div>
          ) : null}
          <div className="text-xs uppercase tracking-wide text-slate-500 mt-4 mb-2">Also protect</div>
          <div className="flex flex-wrap gap-2 items-center">
            {mine.map((p) => <span key={p.id} className={chip + "border-green-300 bg-green-50"}><TeamLogo t={p.t} size={18} />{p.n}<button className="text-slate-500 ml-1 text-base leading-none" aria-label={"Unprotect " + p.n} onClick={() => upd(p.id, { keep: false })}>×</button></span>)}
            {addable.length ? <select className={inp} value="" onChange={(e) => { if (e.target.value) upd(e.target.value, { keep: true }); }}><option value="">+ Add a player</option>{addable.map((p) => <option key={p.id} value={p.id}>{p.n} ({p.p})</option>)}</select> : null}
          </div>
        </Section>
      </div>
      <div className="px-1">
        <button className="text-sm text-blue-600" onClick={() => setAdv(!adv)}>{adv ? "Hide the full editor" : "Edit every player: projections, play %, IR"}</button>
        {adv ? <div className="mt-3"><RosterTable s={s} setS={setS} wk={wk} team={s.me} /></div> : null}
      </div>
    </div>
  );
}

// ---------- round 16: live and final points from ESPN (news_logos.py) ----------
const ESLOT = { 3: "F", 4: "D", 6: "UTIL", 5: "G" };
const CAPK = { F: "F", D: "D", UTIL: "U", G: "G" };
let __PB = null, __NG = null;
const pby = () => { const L = window.__PLAYERS || []; if (!__PB || __PB.k !== L) __PB = { k: L, m: Object.fromEntries(L.map((p) => [p.id, p])) }; return __PB.m; };
const actDay = (tid, dt) => { const D = ((window.ESPN_DATA || {}).daily || {})[dt]; return D ? D[String(tid).replace(/^t/, "")] || null : null; };
const gState = (t, dt) => {
  const x = ((window.__LIVESC || {})[dt] || {})[t] || ((((window.ESPN_DATA || {}).gstate || {})[dt]) || {})[t];
  if (x && x.s === "F") return { s: "F", f: 1 };
  if (x && x.s === "L") return { s: "L", f: x.f || 0 };
  const g = gameOf(t, dt), st = g && g.st ? Date.parse(g.st) : NaN;
  if (!isNaN(st)) { const el = (Date.now() - st) / 36e5; return el < 0 ? { s: "P", f: 0 } : el > 3.5 ? { s: "F", f: 1 } : { s: "L", f: Math.min(0.95, el / 2.6) }; }
  return dt && dt < todayISO() ? { s: "F", f: 1 } : { s: "P", f: 0 };
};
const gScore = (t, dt) => { const L = ((window.__LIVESC || {})[dt] || {})[t]; return L || ((((window.ESPN_DATA || {}).gstate || {})[dt]) || {})[t] || null; };
const LiveTag = ({ st, t, dt }) => {
  // live tag v21: pill + score from the player's team's side (news_logos.py)
  if (st !== "L" && st !== "F") return null;
  const sc = t && dt ? gScore(t, dt) : null;
  const has = !!(sc && sc.my != null && sc.op != null);
  const res = has && st === "F" ? (sc.my > sc.op ? "W" : sc.my < sc.op ? "L" : "") : "";
  const tail = !sc ? "" : st === "F" ? (sc.per === "OT" || sc.per === "SO" ? " " + sc.per : "") : sc.int ? " · " + sc.per + " int." : sc.per ? " · " + sc.per + (sc.clk ? " " + sc.clk : "") : "";
  return (
    <span className="inline-flex items-center gap-1.5 whitespace-nowrap align-middle">
      {st === "L" ? <span className="gm-pill inline-flex items-center gap-1 bg-red-100 text-red-600"><span className="gm-dot"></span>LIVE</span> : <span className="gm-pill bg-slate-200 text-slate-500">FINAL</span>}
      {has ? <span className={"text-xs font-semibold " + (res === "W" ? "text-green-700" : res === "L" ? "text-red-600" : "text-slate-700")}>{res ? res + " " : ""}{sc.my}–{sc.op}<span className="font-normal text-slate-500">{tail}</span></span> : null}
    </span>
  );
};
// players who beat or missed their projection get 10% of the average miss per game, capped at 15%
function liveNudges(K) {
  const E = window.ESPN_DATA || {}, key = [E.generated, K, window.__PMODE, window.__PLAYERS];
  if (__NG && __NG.k.every((v, i) => v === key[i])) return __NG.m;
  const P = pby(), acc = {};
  Object.entries(E.daily || {}).forEach(([dt, T]) => Object.values(T || {}).forEach((tm) => Object.entries(tm || {}).forEach(([pid, v]) => {
    const p = P["e" + pid];
    if (!p || !v || v[0] == null || !(SCHED[p.t] && SCHED[p.t].has(dt)) || gState(p.t, dt).s !== "F") return;
    const a = (acc[p.id] = acc[p.id] || { s: 0, n: 0, seen: {} });
    if (a.seen[dt]) return;
    a.seen[dt] = 1; a.s += v[0] - effAvg(p, K, dt); a.n++;
  })));
  const m = {};
  Object.entries(acc).forEach(([id, a]) => { const b = effAvg(P[id], K); if (!(b > 0) || !a.n) return; const adj = Math.max(-0.15, Math.min(0.15, (0.1 * a.s / a.n) / b)); if (Math.abs(adj) >= 0.005) m[id] = 1 + adj; });
  __NG = { k: key, m };
  return m;
}
function weekLive(roster, wk, K, tid, opt) {
  // live week v16: real points for games that started (ESPN lineup), projection for everything still to come
  const dates = wk.dates || [], ng = liveNudges(K), P = pby(), today = todayISO();
  const r = roster.map((p) => (ng[p.id] ? { ...p, gwMul: (p.gwMul || 1) * ng[p.id] } : p));
  const byId = {}; r.forEach((p) => (byId[p.id] = p));
  let actSoFar = 0, projSoFar = 0;
  const days = wk.days.map((_, d) => {
    const dt = dates[d];
    const plays = (p) => (wk.games[p.t] || []).includes(d);
    const lk = (p) => !!dt && plays(p) && gState(p.t, dt).s !== "P";
    const full = opt && opt.detail ? dayLineup(roster.filter((p) => onEspnDay(dt ? actDay(tid, dt) : null, p)), wk, d, K).total : null;
    const AD = dt ? actDay(tid, dt) : null;
    const adAct = AD ? Object.entries(AD).filter(([, v]) => v && ESLOT[v[1]]) : [];
    if (!dt || (!r.some(lk) && !adAct.some(([, v]) => v[0] != null))) {
      const L = dayLineup(r.filter((p) => onEspnDay(AD, p)), wk, d, K);
      return { ...L, act: 0, proj: full != null ? full : L.total, locked: 0, liveN: 0, openN: L.start.length, allDone: !!dt && dt < today, benchAct: [], empty: dt && dt < today ? 0 : L.empty };
    }
    const cap = { F: 9, D: 5, U: 1, G: 2 }, rows = [], done = new Set();
    let act = 0;
    const take = (p, pp, slot, a, assume) => {
      const g = gState(p.t, dt), gs = p.p === "G" ? gStart(p, dt) : null;
      const base = (q) => effAvg(q, K, dt) * (a != null ? 1 : (gs ? gs.v : p.prob) * avail(p, dt));
      const x0 = base(pp), playing = assume || a != null || (g.s === "L" && g.f < 0.3);
      const vf = g.s === "L" && playing ? 1 - g.f : 0;
      rows.push({ ...pp, slot, st: g.s, a, x0, x: x0 * vf, vf, dt, gs: gs ? gs.l : "" });
      if (a != null) { act += a; actSoFar += a; projSoFar += base(p) * (g.s === "F" ? 1 : g.f); }
      done.add(p.id);
      if (CAPK[slot]) cap[CAPK[slot]]--;
    };
    if (AD) {
      adAct.forEach(([pid, v]) => {
        const p = P["e" + pid];
        if (!p) { if (v[0] != null) { act += v[0]; actSoFar += v[0]; } return; }
        if (plays(p) ? gState(p.t, dt).s === "P" : !v[0]) return;
        take(p, byId[p.id] || p, ESLOT[v[1]], v[0], false);
      });
    } else {
      dayLineup(r, wk, d, K).start.filter(lk).forEach((q) => { const raw = roster.find((x) => x.id === q.id) || q; take(raw, byId[q.id] || raw, q.slot, null, true); });
    }
    const benchAct = AD ? Object.entries(AD).filter(([, v]) => v && v[1] === 7 && v[0]).map(([pid, v]) => ({ p: P["e" + pid], a: v[0] })).filter((x) => x.p && gState(x.p.t, dt).s !== "P") : [];
    Object.keys(cap).forEach((k) => (cap[k] = Math.max(0, cap[k])));
    const L = dayLineup(r.filter((p) => onEspnDay(AD, p) && !done.has(p.id) && !lk(p)), wk, d, K, cap);
    const liveN = rows.filter((x) => x.vf > 0).length;
    return { start: [...rows, ...L.start].sort((a, b) => ({ F: 0, D: 1, UTIL: 2, G: 3 }[a.slot] ?? 4) - ({ F: 0, D: 1, UTIL: 2, G: 3 }[b.slot] ?? 4)), bench: L.bench, total: rows.reduce((s2, x) => s2 + x.x, 0) + L.total, act, proj: full, locked: rows.length, liveN, openN: L.start.length, allDone: !rows.some((x) => x.st === "L") && !L.start.length, benchAct, empty: dt < today ? 0 : L.empty, sched: L.sched + liveN };
  });
  const sum = (f) => days.reduce((a, x) => a + f(x), 0);
  return { days, total: sum((x) => x.total), act: sum((x) => x.act), actSoFar, projSoFar, used: sum((x) => x.openN + x.liveN), wasted: sum((x) => x.bench.length), empty: sum((x) => x.empty), sched: sum((x) => x.sched) };
}

// ---------- round 22: NHL box-score stat lines (news_logos.py) ----------
const pStat = (p, dt) => { const id = String((p && p.id) || "").replace(/^e/, ""); return ((((window.ESPN_DATA || {}).pstat || {})[dt]) || {})[id] || null; };
const statLine = (x) => {
  if (!x) return "";
  if (x.sv != null) return [x.dec || null, x.sv + " SV", x.ga + " GA", x.toi ? x.toi + " TOI" : null].filter(Boolean).join(", ");
  const n = (v, l) => (v ? (v > 1 ? v + " " + l : l) : null);
  return [n(x.g, "G"), n(x.a, "A"), (x.pm > 0 ? "+" : "") + (x.pm || 0), n(x.sog, "SOG"), n(x.pim, "PIM"), n(x.hit, "HIT"), n(x.blk, "BLK"), x.toi ? x.toi + " TOI" : null].filter(Boolean).join(", ");
};

// ---------- round 24: a player counts on a day only if ESPN has him on that day's roster (news_logos.py) ----------
const onEspnDay = (AD, p) => !AD || !Object.keys(AD).length || AD[String(p.id).replace(/^e/, "")] != null;

// ---------- round 25: pickups start after the daily lock (news_logos.py) ----------
// ESPN locks the whole day at the first puck drop, so anyone added after that plays from tomorrow.
// Players on waivers (1-day waivers) can play from tomorrow at the earliest.
let __LK = null;
const lockedToday = () => {
  const today = todayISO(), k = today + ":" + Math.floor(Date.now() / 30000);
  if (__LK && __LK.k === k) return __LK.v;
  const G = ((window.GAMES_DATA || {}).games || {})[today] || {};
  const first = Object.values(G).reduce((m, g) => { const t = g && g.st ? Date.parse(g.st) : NaN; return isNaN(t) ? m : Math.min(m, t); }, Infinity);
  const live = Object.values((window.__LIVESC || {})[today] || {}).some((x) => x && x.s && x.s !== "P");
  const espn = Object.values((((window.ESPN_DATA || {}).gstate || {})[today]) || {}).some((x) => x && x.s && x.s !== "P");
  const v = live || espn || first <= Date.now();
  __LK = { k, v };
  return v;
};
const pickStart = (p) => ((p && p.wv) || lockedToday() ? addDays(todayISO(), 1) : todayISO());
const onDay = (p, dt) => !dt || ((!p.fromD || dt >= p.fromD) && (!p.untilD || dt < p.untilD));
const timedMove = (roster, me, moves) => {
  let r = roster;
  moves.forEach(({ add, drop }) => { const a = pickStart(add); r = r.map((p) => (drop && p.id === drop.id ? { ...p, untilD: a } : p)).concat([{ ...add, ft: me, fromD: a }]); });
  return r;
};
const PickNote = () => { const a = pickStart(null); return a === todayISO() ? null : <div className="w-full text-xs text-amber-600 mt-1">Today's first game has started, so anyone you add now plays from {dayLabel(a)}. Players on waivers show a Waivers tag and can't play before tomorrow.</div>; };

// ---------- round 26: planner win chance (news_logos.py) ----------
const planRoster = (s, wk, steps) => {
  let r = s.players.filter((p) => p.ft === s.me);
  steps.forEach((st) => { const a = wk.dates[st.day]; r = r.map((p) => (p.id === st.drop.id ? { ...p, untilD: a } : p)).concat([{ ...st.add, ft: s.me, fromD: a }]); });
  return r;
};
const PlanWin = ({ a, b }) => {
  if (a == null || b == null) return null;
  const d = Math.round(b * 100) - Math.round(a * 100);
  return <span className={"text-sm whitespace-nowrap " + (d > 0 ? "text-green-700" : d < 0 ? "text-red-600" : "text-slate-500")} title="Your chance to win this week before and after this move">win {wpTxt(a)} → {wpTxt(b)} <span className="font-semibold">{d > 0 ? "+" : ""}{d}%</span></span>;
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
