name: Install AI mode
on:
  workflow_dispatch:
    inputs:
      target:
        description: "test = make a test copy (fantasy-gm-test.html) · live = update your real app · undo = restore the backup"
        type: choice
        options: [test, live, undo]
        default: test
permissions:
  contents: write
concurrency:
  group: ai-mode-install
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch the app
        env:
          TARGET: ${{ inputs.target }}
        run: |
          python - <<'PY'
          import os, shutil, sys
          T = os.environ.get("TARGET", "test")
          APP, TEST, BAK = "fantasy-gm.html", "fantasy-gm-test.html", "fantasy-gm.backup.html"
          if T == "undo":
              if not os.path.exists(BAK):
                  sys.exit("No backup found - nothing to undo.")
              shutil.copy(BAK, APP)
              print("Restored fantasy-gm.html from the backup made before AI mode was installed.")
              sys.exit(0)
          text = open(APP, encoding="utf-8").read()
          if "window.__AIAVG" in text:
              print("AI mode is already installed in fantasy-gm.html - nothing to change.")
              if T == "test":
                  shutil.copy(APP, TEST)
              sys.exit(0)
          EDITS = [
              ("1 load AI projections",
               r'''window.__SIG = (E && E.signals) || null;''',
               r'''window.__SIG = (E && E.signals) || null; useEffect(() => { fetch("ai/models/ai_proj.json?t=" + Date.now()).then((r) => (r.ok ? r.json() : null)).then((A) => { if (!A || !A.proj || !((Date.now() - Date.parse(A.asof)) / 36e5 < 36)) return; const avg = {}; Object.entries(A.proj).forEach(([id, m]) => { const v = Object.values(m).filter((x) => x != null); if (v.length) avg[id] = v.reduce((a, b) => a + b, 0) / v.length; }); window.__AI = A; window.__AIAVG = avg; setS((st) => ({ ...st, players: [...st.players] })); }).catch(() => {}); }, []);'''),
              ("2 use AI numbers in AI mode",
               r'''const M = window.__MODEL, mode = window.__PMODE || "espn";''',
               r'''const M = window.__MODEL, mode = window.__PMODE || "espn"; { const A = window.__AI, aid = mode === "ai" && typeof p.id === "string" && p.id[0] === "e" ? p.id.slice(1) : null, ap = aid && A ? (A.proj || {})[aid] : null, av = ap ? (dt && ap[dt] != null ? ap[dt] : (window.__AIAVG || {})[aid]) : null; if (av != null) return av * (p.gwMul || 1); }'''),
              ("3 AI goalie start chance",
               r'''const fallback = b2bAdj(p, dt) || { v: p.prob, l: "" };''',
               r'''const aiG = window.__PMODE === "ai" && dt && typeof p.id === "string" && p.id[0] === "e" ? (((window.__AI || {}).gstart || {})[p.id.slice(1)] || {})[dt] : null; const fallback = aiG != null ? { v: aiG, l: `AI start chance (${Math.round(aiG * 100)}%)` } : b2bAdj(p, dt) || { v: p.prob, l: "" };'''),
              ("4 AI in the projection menu",
               r'''<option value="model" disabled={!window.__MODEL}>Proj: GM model</option>''',
               r'''<option value="model" disabled={!window.__MODEL}>Proj: GM model</option><option value="ai" disabled={!window.__MODEL || !window.__AI}>Proj: AI (beta)</option>'''),
              ("5 AI Lab link",
               r'''<span className="text-xs text-slate-500 ml-auto">{status}</span>''',
               r'''<a href="ai-dashboard.html" className="text-xs text-blue-600 ml-auto">🧪 AI Lab</a><span className="text-xs text-slate-500">{status}</span>'''),
          ]
          for name, find, rep in EDITS:
              n = text.count(find)
              if n != 1:
                  sys.exit(f"STOPPED at edit {name}: expected the original line exactly once, found it {n} times. Nothing was changed.")
          for name, find, rep in EDITS:
              text = text.replace(find, rep, 1)
              print(f"OK   edit {name}")
          if T == "live":
              shutil.copy(APP, BAK)
              print("Backup of your current app saved as fantasy-gm.backup.html")
          out = TEST if T == "test" else APP
          with open(out, "w", encoding="utf-8") as f:
              f.write(text)
          print(f"DONE wrote {out}")
          PY
      - name: Save
        run: |
          git config user.name "fantasy-bot"
          git config user.email "fantasy-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "AI mode: ${{ inputs.target }}"
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep 10; done
          exit 1
