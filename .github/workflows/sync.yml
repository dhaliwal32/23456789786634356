name: Fantasy sync
on:
  schedule:
    - cron: "*/30 * * * *"
    - cron: "5-55/10 22,23,0,1,2,3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fantasy-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run sync
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python espn_sync.py
      - name: AI learning engine (safe to fail)
        continue-on-error: true
        timeout-minutes: 5
        run: python ai_engine.py
      - name: Lines and roster tracker (safe to fail)
        continue-on-error: true
        timeout-minutes: 5
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python gm_lines.py
