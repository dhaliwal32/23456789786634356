name: Game times
on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: game-times
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download game times
        run: python game_times.py
      - name: Save results
        run: |
          git config user.name "fantasy-bot"
          git config user.email "fantasy-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "game times $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep 10
          done
          exit 1
