name: Tidy Actions
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Keep runs from the last this many days (runs of deleted workflows are always removed)"
        required: true
        default: "7"
  schedule:
    - cron: "40 10 * * 1"
permissions:
  actions: write
  contents: read
jobs:
  tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Remove old workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DAYS: ${{ github.event.inputs.days }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.parse, urllib.request
          from datetime import datetime, timedelta, timezone
          API = "https://api.github.com/repos/" + os.environ["REPO"]
          HDR = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"}
          ME = os.environ.get("GITHUB_RUN_ID", "")
          days = int(os.environ.get("DAYS") or 7)

          def call(method, path):
              req = urllib.request.Request(API + path, method=method, headers=HDR)
              with urllib.request.urlopen(req, timeout=30) as r:
                  body = r.read()
              return json.loads(body) if body else {}

          wfs = call("GET", "/actions/workflows?per_page=100").get("workflows") or []
          print("Workflows: " + ", ".join(w["name"] + " (" + w["state"] + ")" for w in wfs))
          todo = []
          for w in [w for w in wfs if w.get("state") == "deleted"]:
              for page in range(1, 11):
                  runs = call("GET", f"/actions/workflows/{w['id']}/runs?per_page=100&page={page}").get("workflow_runs") or []
                  todo += [r["id"] for r in runs]
                  if len(runs) < 100:
                      break
          cut = (datetime.now(timezone.utc) - timedelta(days=days)).strftime("%Y-%m-%d")
          q = urllib.parse.quote("<" + cut)
          for page in range(1, 11):
              runs = call("GET", f"/actions/runs?per_page=100&page={page}&created={q}").get("workflow_runs") or []
              todo += [r["id"] for r in runs if r.get("status") == "completed" and str(r["id"]) != ME]
              if len(runs) < 100:
                  break
          todo = list(dict.fromkeys(todo))
          print(f"{len(todo)} old runs found (deleted workflows, or older than {days} days)")
          done = 0
          for rid in todo[:800]:
              try:
                  call("DELETE", f"/actions/runs/{rid}")
                  done += 1
              except Exception as ex:
                  print(f"could not remove run {rid}: {ex}")
          left = len(todo) - done
          print(f"Removed {done} runs." + (f" About {left} left - run this again in an hour." if left > 0 else " All tidy."))
          EOF
