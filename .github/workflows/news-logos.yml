name: News and logos
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "test = make fantasy-gm-test.html, live = change the real app, undo = put the old app back, games = only refresh game times"
        required: true
        default: test
        type: choice
        options: [test, live, undo, games]
  schedule:
    - cron: "15 */6 * * *"
permissions:
  contents: write
concurrency:
  group: news-logos
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh game times
        continue-on-error: true
        run: python news_logos.py games
      - uses: actions/setup-node@v4
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'games'
        with:
          node-version: "20"
      - name: Get the syntax checker
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'games'
        continue-on-error: true
        run: npm install --prefix /tmp/babel @babel/standalone
      - name: Install app changes
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'games'
        run: python news_logos.py ${{ github.event.inputs.mode }}
      - name: Save results
        run: |
          git config user.name "fantasy-bot"
          git config user.email "fantasy-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "news/logos $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep 10
          done
          exit 1
