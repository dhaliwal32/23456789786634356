name: AI history test
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ai-history-exp
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy scikit-learn
      - name: Download older seasons and test
        run: python ai_history_exp.py
      - name: Save results
        if: always()
        run: |
          git config user.name "fantasy-bot"
          git config user.email "fantasy-bot@users.noreply.github.com"
          git add ai/older ai/research
          git diff --cached --quiet && exit 0
          git commit -m "ai history test $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5 6 7 8; do
            if git pull --rebase -X theirs; then git push && exit 0; else git rebase --abort || true; fi
            sleep 20
          done
          exit 1
