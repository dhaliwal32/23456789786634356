name: Sync watch
# Sends one alert to the app (gm_push.py) when the Fantasy sync has stopped saving new data.
on:
  schedule:
    - cron: "8,38 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 60
      - name: Alert if the last sync is old
        env:
          SWID: ${{ secrets.SWID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          last=$(git log -1 --grep='^sync ' --format=%ct)
          if [ -z "$last" ]; then echo "no sync commit in the last 60 commits"; last=0; fi
          age=$(( ( $(date +%s) - last ) / 60 ))
          echo "last sync was $age minutes ago"
          # this runs every 30 minutes, so each window below is hit once: after about 1 hour and again after about 6 hours
          if { [ $age -ge 50 ] && [ $age -lt 80 ]; } || { [ $age -ge 360 ] && [ $age -lt 390 ]; }; then
            pip install -q requests cryptography
            AGE=$age python -c "import os, gm_push; gm_push.send('Fantasy sync has stopped', 'No new data for ' + os.environ['AGE'] + ' minutes. Lineup alerts and autopilot are not running.', '#setup')"
          fi
