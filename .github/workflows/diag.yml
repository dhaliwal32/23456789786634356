name: Diagnose
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Who allows the app to read live data
        run: |
          mkdir -p ai/research
          curl -s "https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard" > ai/research/espn_scoreboard.json
          for ev in $(python3 -c "import json; j=json.load(open('ai/research/espn_scoreboard.json')); print(' '.join(e['id'] for e in j['events']))"); do curl -s "https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/summary?event=$ev" > ai/research/espn_sum_$ev.json; done
          git config user.name "fantasy-bot"; git config user.email "fantasy-bot@users.noreply.github.com"
          git add ai/research/; git commit -qm "diag" && (git pull -q --rebase && git push -q || true)
