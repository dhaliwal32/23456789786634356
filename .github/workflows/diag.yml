name: Diagnose
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Who allows the app to read live data
        run: |
          mkdir -p ai/research
          curl -s "https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard" > ai/research/espn_scoreboard.json
          ev=$(python3 -c "import json; j=json.load(open('ai/research/espn_scoreboard.json')); ev=[e for e in j['events'] if e['status']['type']['state']=='in'] or j['events']; print(ev[0]['id'])")
          curl -s "https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/summary?event=$ev" > ai/research/espn_summary.json
          git config user.name "fantasy-bot"; git config user.email "fantasy-bot@users.noreply.github.com"
          git add ai/research/espn_scoreboard.json ai/research/espn_summary.json; git commit -qm "diag" && (git pull -q --rebase && git push -q || true)
