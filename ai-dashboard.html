<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fantasy Islands GM — AI Lab</title>
<style>
:root{--bg:#0c0d0f;--card:#141518;--card2:#0c0d0f;--line:#232529;--tx:#f4f5f6;--mu:#8a8d93;--ok:#5fd08a;--warn:#f5c451;--bad:#f06a6a;--acc:#f4f5f6}
html[data-t="light"]{--bg:#f5f5f4;--card:#ffffff;--card2:#f5f5f4;--line:#e4e4e1;--tx:#111111;--mu:#6b6b68;--ok:#16a34a;--warn:#b45309;--bad:#dc2626;--acc:#111111}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0}
header a,header button{color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;text-decoration:none;font-size:13px;cursor:pointer}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav a{background:transparent;border:none;color:var(--mu);padding:4px 6px}
nav a:hover{color:var(--tx)}
main{max-width:1150px;margin:0 auto;padding:18px}
section{background:var(--card);padding:16px 18px;margin-bottom:12px;position:relative}
h2{font-size:16px;margin:0 0 4px}
h3{font-size:14px;margin:16px 0 6px}
.muted{color:var(--mu)}
.small{font-size:12px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:10px}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-size:13px}
.kpi span{font-size:12px;color:var(--mu)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.ok{background:var(--ok)}.warn{background:var(--warn)}.bad{background:var(--bad)}.na{background:#4b5563}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mu);font-weight:600}
tr.best td{background:color-mix(in srgb,var(--ok) 14%,transparent)}
.tag{display:inline-block;font-size:11px;border-radius:999px;padding:1px 8px;border:1px solid var(--line);color:var(--mu)}
.tag.good{color:var(--ok);border-color:#065f46}.tag.exp{color:var(--warn);border-color:#78350f}.tag.bad{color:var(--bad);border-color:#7f1d1d}
.empty{background:var(--card2);border:1px dashed var(--line);border-radius:10px;padding:14px;color:var(--mu);margin-top:8px}
.over{color:var(--bad)}.under{color:var(--acc)}
select,input{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px}
.chart{width:100%;height:auto;margin-top:8px}
.chart .grid{stroke:var(--line)}.chart .ax{fill:#6b7280;font-size:11px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-top:4px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer;font-size:12px;color:var(--tx)}
.chip:hover{border-color:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.two{grid-template-columns:1fr}th,td{padding:5px}}
details summary{cursor:pointer;color:var(--acc)}
.scroll{overflow-x:auto}
/* AI Lab v2 (news_logos.py) */
section::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(var(--tx),var(--tx)) 0 0/10px 1.5px no-repeat,linear-gradient(var(--tx),var(--tx)) 0 0/1.5px 10px no-repeat,linear-gradient(var(--tx),var(--tx)) 100% 0/10px 1.5px no-repeat,linear-gradient(var(--tx),var(--tx)) 100% 0/1.5px 10px no-repeat,linear-gradient(var(--tx),var(--tx)) 0 100%/10px 1.5px no-repeat,linear-gradient(var(--tx),var(--tx)) 0 100%/1.5px 10px no-repeat,linear-gradient(var(--tx),var(--tx)) 100% 100%/10px 1.5px no-repeat,linear-gradient(var(--tx),var(--tx)) 100% 100%/1.5px 10px no-repeat}
.lab{font-size:12px;color:var(--mu);letter-spacing:.06em}
.vd{font-size:17px;font-weight:600;margin:8px 0 10px}
.rk{display:grid;grid-template-columns:86px minmax(0,1fr) 48px;gap:10px;align-items:center;padding:6px 0;font-variant-numeric:tabular-nums}
.rk .bar{height:8px;background:var(--line)}.rk .bar i{display:block;height:8px}.rk b{text-align:right}
.r{display:flex;align-items:baseline;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}.r>span:first-child{flex:1}
details.grp{margin-bottom:12px}
details.grp>summary{list-style:none;padding:12px 0;border-top:1px solid var(--line);color:var(--tx);font-size:14px}
details.grp[open]>summary{margin-bottom:12px}
/* r52 no corners */
section::before{display:none}
</style>
</head>
<body>
<header>
  <h1>AI Lab</h1>
  <span style="flex:1"></span>
  <button onclick="location.reload()">Refresh</button>
  <a href="fantasy-gm.html">Back to the app</a>
</header>
<main id="app"><section><p class="muted">Loading the AI's data…</p></section></main>

<script>
(function () {
  try {
    var p = localStorage.getItem("fantasy-islands-gm-theme") || "auto";
    var dark = p === "dark" || (p !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-t", dark ? "dark" : "light");
  } catch (e) {}
})();
const M = ["espn", "gm", "blend", "ai"];
const NAME = {espn: "ESPN", gm: "GM model", blend: "Blend", ai: "AI"};
const COL = {espn: "#f87171", gm: "#60a5fa", blend: "#a78bfa", ai: "#34d399"};
const FAM = {baseline: "Simple baseline (recent form)", ridge_fp: "Linear model → points", poisson_stats: "Statistical model, stat by stat",
  gbm_fp: "Boosted trees → points", gbm_stats: "Boosted trees, stat by stat", logit: "Logistic model", gbm: "Boosted trees"};
const FCOL = ["#9ca3af", "#60a5fa", "#a78bfa", "#fbbf24", "#34d399"];
const TASKS = {skater: "Skaters — points when he plays", goalie_if_start: "Goalies — points when he starts",
  goalie_expected: "Goalies — expected points including start chance"};
const W = {G: 6, A: 4, PM: 2, PPP: 2, SHP: 3, SOG: 1, HIT: 0.1, BLK: 1};
const STAT = {G: "goals", A: "assists", PM: "plus/minus", PPP: "power-play points", SHP: "shorthanded points",
  SOG: "shots on goal", HIT: "hits", BLK: "blocked shots"};
const T0 = Date.now();

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const f = (x, d = 2) => x == null || isNaN(x) ? "—" : Number(x).toFixed(d);
const hoursAgo = iso => iso ? (Date.now() - Date.parse(iso)) / 3.6e6 : null;
function ago(iso) {
  const h = hoursAgo(iso);
  if (h == null) return "never";
  if (h < 1 / 60) return "just now";
  if (h < 1) return Math.round(h * 60) + " min ago";
  if (h < 48) return Math.round(h) + " h ago";
  return Math.round(h / 24) + " days ago";
}
const local = iso => iso ? new Date(iso).toLocaleString([], {month: "short", day: "numeric", hour: "numeric", minute: "2-digit"}) : "—";
const lvl = (h, okH, warnH) => h == null ? "na" : h <= okH ? "ok" : h <= warnH ? "warn" : "bad";
function bias(b) {
  if (b == null) return "—";
  if (Math.abs(b) < 0.005) return "0.00";
  return b > 0 ? `<span class="over">+${f(b)}</span>` : `<span class="under">${f(b)}</span>`;
}

async function j(path) {
  try {
    const r = await fetch(path + "?t=" + T0, {cache: "no-store"});
    return r.ok ? await r.json() : null;
  } catch (e) { return null; }
}
function loadScript(src) {
  return new Promise(res => {
    const s = document.createElement("script");
    s.src = src + "?t=" + T0;
    s.onload = () => res(true);
    s.onerror = () => res(false);
    document.head.appendChild(s);
  });
}

function lineChart(series, labels, dec = 2) {
  const Wd = 720, Ht = 220, L = 46, R = 12, T = 12, B = 28;
  const ys = series.flatMap(s => s.values.filter(v => v != null && !isNaN(v)));
  if (!ys.length || labels.length < 2) return '<div class="empty">Not enough data points yet to draw a chart.</div>';
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (hi === lo) { hi += 0.5; lo -= 0.5; }
  const pad = (hi - lo) * 0.1; lo -= pad; hi += pad;
  const x = i => L + (Wd - L - R) * i / (labels.length - 1);
  const y = v => T + (Ht - T - B) * (1 - (v - lo) / (hi - lo));
  let g = "";
  for (let k = 0; k <= 4; k++) {
    const v = lo + (hi - lo) * k / 4;
    g += `<line x1="${L}" x2="${Wd - R}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${L - 6}" y="${y(v) + 4}" class="ax" text-anchor="end">${v.toFixed(dec)}</text>`;
  }
  const step = Math.ceil(labels.length / 8);
  labels.forEach((lb, i) => {
    if (i % step === 0 || i === labels.length - 1) g += `<text x="${x(i)}" y="${Ht - 8}" class="ax" text-anchor="middle">${esc(lb)}</text>`;
  });
  for (const s of series) {
    let d = "";
    s.values.forEach((v, i) => { if (v != null && !isNaN(v)) d += (d ? "L" : "M") + x(i).toFixed(1) + "," + y(v).toFixed(1); });
    if (d) g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5"/>`;
    s.values.forEach((v, i) => {
      if (v != null && !isNaN(v)) g += `<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${s.color}"><title>${esc(s.name)} · ${esc(labels[i])}: ${Number(v).toFixed(3)}</title></circle>`;
    });
  }
  return `<svg viewBox="0 0 ${Wd} ${Ht}" class="chart">${g}</svg><div class="legend">${series.map(s => `<span class="lg"><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>`;
}

// ------------------------------------------------------------ sections
function secHealth(D) {
  const h = (D.rep && D.rep.health) || {}, reg = D.reg || {}, proj = D.proj || {}, st = D.status || {};
  const errs = (h.recent_errors || []).filter(e => hoursAgo(e.at) < 24);
  const items = [
    ["Sync + ledger ran", h.last_run, lvl(hoursAgo(h.last_run), 1.5, 6), "Runs every 10–30 min with your sync"],
    ["Pregame predictions saved", h.last_snapshot_written, h.last_snapshot_written ? lvl(hoursAgo(h.last_snapshot_written), 24, 72) : "na", "Only on days with NHL games"],
    ["Results graded", h.last_results_graded, h.last_results_graded ? lvl(hoursAgo(h.last_results_graded), 30, 72) : "na", "The morning after games"],
    ["AI projections made", proj.asof, lvl(hoursAgo(proj.asof), 30, 36), "Daily 4:20 AM; ignored if over 36 h old"],
    ["AI models retrained", reg.last_train, lvl(hoursAgo(reg.last_train), 24 * 8, 24 * 10), "Whenever they are a week old"],
  ];
  let html = `<section id="health"><h2>System health</h2><p class="muted small">Green = on schedule · amber = late · red = something is probably broken · grey = not started yet (normal before games).</p><div class="grid4">`;
  for (const [t, iso, l, note] of items) html += `<div class="kpi"><b><span class="dot ${l}"></span>${t}</b>${iso ? `${ago(iso)} <span>(${local(iso)})</span>` : "<span>not yet</span>"}<br><span>${note}</span></div>`;
  html += `<div class="kpi"><b><span class="dot ${errs.length ? "bad" : "ok"}"></span>Errors (last 24 h)</b>${errs.length}<br><span>${st.history_rows ? st.history_rows.toLocaleString() + " past player-games learned from" : ""}</span></div></div>`;
  if (errs.length) html += `<h3>Recent errors</h3><table><tr><th>When</th><th>What</th></tr>${errs.map(e => `<tr><td>${local(e.at)}</td><td style="text-align:left;white-space:normal">${esc(e.error)}</td></tr>`).join("")}</table>`;
  if ((st.errors || []).length) html += `<h3>Last AI training problems</h3><ul>${st.errors.map(e => `<li>${esc(e)}</li>`).join("")}</ul>`;
  if (!D.rep) html += `<div class="empty">Could not load <code>ai/report.json</code>. It appears after the first sync run with the AI engine.</div>`;
  return html + "</section>";
}

function secLive(D) {
  const rep = D.rep;
  let html = `<section id="live"><h2>Live accuracy — real games, pregame predictions</h2>
  <p class="muted small">Every number compares the projection saved <b>before puck drop</b> with the points actually scored. "Average miss" = how far off, on average, in fantasy points (lower is better). "±" is the uncertainty (95% range). "Lean" shows a habit of projecting too high (<span class="over">red +</span>) or too low (<span class="under">blue −</span>).</p>`;
  if (!rep || !rep.counts || !rep.counts.graded_days) {
    return html + `<div class="empty">No finished games graded yet. The first results appear the morning after the first regular-season games.${rep && rep.counts && rep.counts.days_waiting ? ` (${rep.counts.days_waiting} day(s) of predictions waiting for results.)` : ""}</div></section>`;
  }
  const c = rep.counts;
  html += `<p class="small muted">${c.graded_days} game day(s) graded · ${c.official.toLocaleString()} player-games · ${c.leak_blocked} late prediction(s) blocked · ${c.void} postponed</p>`;
  for (const [task, title] of Object.entries(TASKS)) {
    const t = rep.tasks[task] || {}, best = (rep.best || {})[task] || {};
    if (!M.some(m => t[m])) continue;
    html += `<h3>${title}</h3><div class="scroll"><table><tr><th>Projection</th><th>Games</th><th>Average miss</th><th>±</th><th>Lean</th></tr>`;
    for (const m of M) {
      const s = t[m];
      if (!s) { html += `<tr><td>${NAME[m]}</td><td colspan="4" class="muted">no projections yet</td></tr>`; continue; }
      html += `<tr class="${best.model === m ? "best" : ""}"><td><span class="dot" style="background:${COL[m]}"></span>${NAME[m]}</td><td>${s.n}</td><td><b>${f(s.mae)}</b></td><td>${f(2 * s.mae_se)}</td><td>${bias(s.bias)}</td></tr>`;
    }
    html += `</table></div><p class="small">${best.model ? `Leader: <b>${NAME[best.model]}</b> — ${esc(best.note)}.` : `<span class="muted">${esc(best.note || "")}</span>`}</p>`;
  }
  const pr = (rep.paired || {}).skater || {};
  const rows = Object.entries(pr).filter(([, v]) => v);
  if (rows.length) {
    html += `<h3>Head to head (skaters, same games)</h3><table><tr><th>Matchup</th><th>Games</th><th>Difference</th><th>Verdict</th></tr>`;
    for (const [k, v] of rows) {
      const [a, b] = k.split("_vs_");
      const txt = v.diff < 0 ? `${NAME[a]} misses ${f(-v.diff)} less (±${f(2 * v.se)})` : `${NAME[a]} misses ${f(v.diff)} more (±${f(2 * v.se)})`;
      const cls = v.verdict.endsWith("more accurate") ? "good" : "exp";
      html += `<tr><td>${NAME[a]} vs ${NAME[b]}</td><td>${v.n}</td><td>${txt}</td><td><span class="tag ${cls}">${esc(v.verdict.replace(a, NAME[a]).replace(b, NAME[b]))}</span></td></tr>`;
    }
    html += `</table>`;
  }
  const ar = rep.ai_range || {};
  if (ar.n) html += `<h3>Are the AI's ranges honest?</h3><p>${Math.round(ar.coverage * 100)}% of ${ar.n} actual results landed inside the AI's 80% range. <span class="muted">About 80% means the ranges are honest; much lower means overconfident; much higher means too wide.</span></p>`;
  return html + "</section>";
}

function secTime(D) {
  const daily = (D.rep && D.rep.daily) || [];
  let html = `<section id="time"><h2>Accuracy over time (skaters)</h2><p class="muted small">7-day rolling average miss per game — lower is better. Single days jump around a lot; watch the trend.</p>`;
  if (daily.length < 2) return html + `<div class="empty">Needs at least two graded game days.</div></section>`;
  const labels = daily.map(d => d.date.slice(5));
  const series = M.map(m => ({name: NAME[m], color: COL[m], values: daily.map((d, i) => {
    let s = 0, n = 0;
    for (let k = Math.max(0, i - 6); k <= i; k++) { const x = daily[k][m]; if (x) { s += x.mae * x.n; n += x.n; } }
    return n ? s / n : null;
  })}));
  return html + lineChart(series, labels) + "</section>";
}

function secWhere(D) {
  const rep = D.rep;
  let html = `<section id="where"><h2>Where the projections miss (skaters)</h2><p class="muted small">Lean by situation: <span class="over">+ = projects too high</span>, <span class="under">− = too low</span>. With few games these bounce around; the flags below only fire when a lean is large relative to its uncertainty. They are <b>clues to investigate, not proven causes.</b></p>`;
  if (!rep || !rep.segments || !Object.keys(rep.segments).length || !rep.counts.graded_days) return html + `<div class="empty">Available once games are graded.</div></section>`;
  const segs = Object.keys(rep.segments);
  html += `<p>Split by: <select id="segSel">${segs.map(s => `<option>${esc(s)}</option>`).join("")}</select></p><div id="segOut" class="scroll"></div>`;
  const flags = rep.flags || [];
  html += `<h3>Flags</h3>` + (flags.length ? `<ul>${flags.map(x => `<li>${esc(x.text)} <span class="tag exp">exploratory</span></li>`).join("")}</ul>` : `<div class="empty">No persistent lean detected yet.</div>`);
  return html + "</section>";
}
function drawSeg(D) {
  const sel = document.getElementById("segSel");
  if (!sel) return;
  const seg = D.rep.segments[sel.value] || {};
  const vals = Object.entries(seg).sort((a, b) => ((b[1].blend || b[1].gm || b[1].espn || {}).n || 0) - ((a[1].blend || a[1].gm || a[1].espn || {}).n || 0));
  let h = `<table><tr><th>${esc(sel.value)}</th><th>Games</th>${M.map(m => `<th>${NAME[m]} miss</th><th>lean</th>`).join("")}</tr>`;
  for (const [v, ms] of vals) {
    const n = Math.max(...M.map(m => (ms[m] || {}).n || 0));
    h += `<tr><td>${esc(v)}</td><td>${n}</td>${M.map(m => ms[m] ? `<td>${f(ms[m].mae)}</td><td>${bias(ms[m].bias)}</td>` : `<td>—</td><td>—</td>`).join("")}</tr>`;
  }
  document.getElementById("segOut").innerHTML = h + "</table>";
}

function calTable(cal, title) {
  if (!cal || !cal.n) return `<div><h3>${title}</h3><div class="empty">No graded goalie games yet.</div></div>`;
  return `<div><h3>${title}</h3><p class="small muted">Brier score ${f(cal.brier, 3)} (lower is better) · ${cal.n} goalie-games</p><table><tr><th>Said</th><th>Games</th><th>Predicted</th><th>Actually started</th></tr>${(cal.bins || []).map(b => `<tr><td>${b.range}</td><td>${b.n}</td><td>${Math.round(b.predicted * 100)}%</td><td><b>${Math.round(b.actual * 100)}%</b></td></tr>`).join("")}</table></div>`;
}
function secGoalies(D) {
  const rep = D.rep || {};
  const v = ((D.val || {}).groups || {}).G_start;
  let html = `<section id="goalies"><h2>Goalie start chances — are they calibrated?</h2><p class="muted small">If a goalie is given 70%, he should start about 70% of those games. Your app's rule uses Daily Faceoff (best on game day); the AI learns from rest, back-to-backs and recent starts (useful days ahead). The app's rule is graded on its last reading before puck drop, when most starters are already confirmed, so its table says little about how good it is days ahead.</p><div class="two">${calTable(rep.calibration, "Your app's rule (Daily Faceoff + start share)")}${calTable(rep.calibration_ai, "AI start model")}</div>`;
  if (v && v.calibration) html += `<h3>AI start model on past games it never saw</h3><table><tr><th>Said</th><th>Games</th><th>Predicted</th><th>Actually started</th></tr>${v.calibration.map(b => `<tr><td>${b.range}</td><td>${b.n}</td><td>${Math.round(b.predicted * 100)}%</td><td><b>${Math.round(b.actual * 100)}%</b></td></tr>`).join("")}</table>`;
  return html + "</section>";
}

function secLab(D) {
  const val = D.val, reg = D.reg || {};
  let html = `<section id="lab"><h2>Model lab — how the AI chose its models</h2><p class="muted small">Each week the AI trains several model types and tests them <b>walk-forward</b>: learn from everything before a month, get scored on that month, repeat. A new model goes live only if it is clearly better (beyond the ± range and at least 0.5%). Scores here are on past NHL games the model never saw.</p>`;
  if (!val || !val.groups) return html + `<div class="empty">No training results yet.</div></section>`;
  html += `<p class="small muted">Last trained ${ago(val.trained)} · code ${esc(val.version)}</p>`;
  for (const [g, v] of Object.entries(val.groups)) {
    const dec = v.decision || {};
    const cls = dec.event === "rollback" ? "bad" : dec.event === "promote" ? "good" : "";
    html += `<h3>${esc(v.what)} <span class="tag ${cls}">${esc(dec.event || "")}: ${esc(FAM[dec.family] || dec.family)}</span></h3><p class="small">${esc(dec.reason || "")}</p>`;
    html += `<div class="scroll"><table><tr><th>Model type</th><th>Tested on</th><th>${g === "G_start" ? "Brier score" : "Average miss (pts)"}</th><th>±</th><th>vs baseline</th></tr>`;
    const fams = Object.entries(v.families || {}).sort((a, b) => a[1].loss - b[1].loss);
    for (const [fm, s] of fams) {
      const rel = v.families.baseline && v.families.baseline.loss ? -s.vs_baseline / v.families.baseline.loss * 100 : null;
      html += `<tr class="${fm === dec.family ? "best" : ""}"><td>${esc(FAM[fm] || fm)}</td><td>${s.n.toLocaleString()}</td><td><b>${f(s.loss, g === "G_start" ? 4 : 3)}</b></td><td>${f(2 * s.se, g === "G_start" ? 4 : 3)}</td><td>${fm === "baseline" ? "—" : (rel >= 0 ? `<span style="color:var(--ok)">${f(rel, 1)}% better</span>` : `<span class="over">${f(-rel, 1)}% worse</span>`)}</td></tr>`;
    }
    html += `</table></div>`;
    if ((v.folds || []).length > 1) {
      const names = Object.keys(v.families || {});
      html += `<details><summary>Month by month</summary>${lineChart(names.map((fm, i) => ({name: FAM[fm] || fm, color: FCOL[i % FCOL.length], values: v.folds.map(x => x.loss[fm])})), v.folds.map(x => x.from.slice(0, 7)), g === "G_start" ? 3 : 2)}</details>`;
    }
    if (v.intervals) html += `<p class="small muted">80% ranges: ${Math.round(v.intervals.coverage_80 * 100)}% of results fell inside on ${v.intervals.checked_on} test games${v.intervals.honest_check ? " (checked on a month not used to set them)" : ""}.</p>`;
  }
  const hist = (reg.history || []).slice(-15).reverse();
  if (hist.length) html += `<h3>Decision log</h3><div class="scroll"><table><tr><th>When</th><th>Group</th><th>Decision</th><th>Model</th><th style="text-align:left">Why</th></tr>${hist.map(x => `<tr><td>${local(x.at)}</td><td>${esc(x.group)}</td><td>${esc(x.event)}</td><td>${esc(FAM[x.family] || x.family)}</td><td style="text-align:left;white-space:normal">${esc(x.reason)}</td></tr>`).join("")}</table></div>`;
  const runs = reg.runs || [];
  const groups = [...new Set(runs.map(r => r.group))];
  const dates = [...new Set(runs.map(r => r.at.slice(0, 10)))];
  if (dates.length > 1) {
    html += `<h3>Learning history (live model vs baseline, per retrain)</h3>` + lineChart(groups.flatMap((g, i) => [
      {name: g + " live", color: FCOL[(i + 1) % FCOL.length], values: dates.map(d => { const r = runs.filter(x => x.group === g && x.at.startsWith(d)).pop(); return r ? r.live_loss : null; })},
    ]), dates.map(d => d.slice(5)), 3) + `<p class="small muted">Different retrains are tested on different months, so compare the live model with its baseline within the same run rather than across dates.</p>`;
  }
  return html + "</section>";
}

function espnEff(p) {
  if (!p) return null;
  if (p.pavg > 0) return (p.pavg * 10 + (p.tot || 0)) / (10 + (p.gp || 0));
  return p.gp > 0 ? p.tot / p.gp : null;
}
function secPlayers(D) {
  const ED = D.ED || {}, players = ED.players || [];
  const mine = players.filter(p => p.ft && p.ft === ED.myTeamId);
  let html = `<section id="players"><h2>Players — projections vs reality</h2><p class="muted small">Pick a player to see the AI's upcoming projections, how its number is built, and (once games are played) every pregame projection next to what actually happened.</p>`;
  html += `<input id="pSearch" list="pList" placeholder="Type a player name…" style="min-width:260px"><datalist id="pList">${players.map(p => `<option value="${esc(p.n)} (${esc(p.t)} ${esc(p.p)})">`).join("")}</datalist>`;
  if (mine.length) html += `<div class="chips">${mine.map(p => `<span class="chip" data-id="${p.id}">${esc(p.n)}</span>`).join("")}</div>`;
  return html + `<div id="pOut"></div></section>`;
}
function drawPlayer(D, id) {
  const ED = D.ED || {}, proj = D.proj || {}, rep = D.rep || {};
  const p = (ED.players || []).find(x => String(x.id) === String(id));
  if (!p) return;
  const eid = String(p.id);
  const ai = (proj.proj || {})[eid] || {}, rng = (proj.range || {})[eid] || {}, gs = (proj.gstart || {})[eid] || {};
  const gm = ((ED.model || {}).proj || {})[eid] || {};
  const eff = espnEff(p);
  const dates = [...new Set([...Object.keys(ai), ...Object.keys(gm)])].sort().slice(0, 10);
  let h = `<h3>${esc(p.n)} · ${esc(p.t)} · ${p.p === "G" ? "Goalie" : p.p === "D" ? "Defense" : "Forward"}</h3>`;
  if ((proj.unmatched || []).includes(p.n)) h += `<p class="small"><span class="tag exp">no NHL history found</span> The AI is using a league-average starting point for this player.</p>`;
  if (!dates.length) h += `<div class="empty">No upcoming games in the next 7 days.</div>`;
  else {
    h += `<div class="scroll"><table><tr><th>Date</th><th>AI</th><th>AI 80% range</th><th>GM model</th><th>ESPN (per game)</th>${p.p === "G" ? "<th>AI start chance</th>" : ""}</tr>`;
    for (const d of dates) h += `<tr><td>${d}</td><td><b>${f(ai[d], 1)}</b></td><td>${rng[d] ? f(rng[d][0], 1) + " – " + f(rng[d][1], 1) : "—"}</td><td>${f(gm[d], 1)}</td><td>${f(eff, 1)}</td>${p.p === "G" ? `<td>${gs[d] != null ? Math.round(gs[d] * 100) + "%" : "—"}</td>` : ""}</tr>`;
    h += `</table></div>`;
    if (p.p === "G") h += `<p class="small muted">Goalie AI and GM numbers are points <b>if he starts</b>. Expected points = start chance × that number.</p>`;
  }
  const det = (proj.detail || {})[eid] || {};
  const dd = Object.keys(det).sort()[0];
  if (dd) {
    const x = det[dd];
    h += `<h3>How the AI builds its ${dd} number</h3><table><tr><th>Stat</th><th>Expected</th><th>× points</th><th>= fantasy pts</th></tr>`;
    let tot = 0;
    for (const k of Object.keys(W)) { const v = x[k] || 0; tot += v * W[k]; h += `<tr><td>${STAT[k]}</td><td>${f(v, 2)}</td><td>${W[k]}</td><td>${f(v * W[k], 2)}</td></tr>`; }
    h += `<tr><td><b>Total</b></td><td></td><td></td><td><b>${f(tot, 2)}</b></td></tr></table><p class="small muted">This is what the model expects for each stat — it explains the arithmetic of the projection, not proven reasons for it.</p>`;
  }
  const hist = ((rep.players || {})[eid] || {}).games || [];
  h += `<h3>Past games: pregame projections vs actual</h3>`;
  if (!hist.length) h += `<div class="empty">No graded games for this player yet${p.ft ? "" : " (history is kept for rostered players)"}.</div>`;
  else {
    h += `<div class="scroll"><table><tr><th>Date</th><th>Opp</th><th>Line</th><th>ESPN</th><th>GM</th><th>Blend</th><th>AI</th><th>Actual</th></tr>`;
    for (const g of hist.slice().reverse()) h += `<tr><td>${g.date}</td><td>${g.home ? "vs" : "@"} ${esc(g.opp)}</td><td>${esc(g.line || "")}</td><td>${f(g.espn, 1)}</td><td>${f(g.gm, 1)}</td><td>${f(g.blend, 1)}</td><td>${f(g.ai, 1)}</td><td><b>${g.played ? f(g.fp, 1) : "DNP"}</b></td></tr>`;
    h += `</table></div>`;
  }
  document.getElementById("pOut").innerHTML = h;
}

function secResearch(D) {
  const res = D.research;
  let html = `<section id="research"><h2>Research — what the AI is investigating</h2><p class="muted small">Ideas for new inputs are tested on held-out games. Only ideas that clearly improve accuracy are adopted; the rest are logged as rejected.</p>`;
  if (!res || !(res.experiments || []).length) return html + `<div class="empty">No experiments have run yet. The research step runs with the Monday retrain once it is installed.</div></section>`;
  html += `<div class="scroll"><table><tr><th>When</th><th>Idea</th><th>Group</th><th>Result</th><th style="text-align:left">Plain English</th></tr>`;
  for (const e of res.experiments.slice().reverse().slice(0, 30)) {
    const cls = e.status === "adopted" ? "good" : e.status === "rejected" ? "bad" : "exp";
    html += `<tr><td>${local(e.at)}</td><td>${esc(e.name)}</td><td>${esc(e.group)}</td><td><span class="tag ${cls}">${esc(e.status)}</span></td><td style="text-align:left;white-space:normal">${esc(e.summary)}</td></tr>`;
  }
  return html + `</table></div></section>`;
}

function secHelp(D) {
  const um = (D.proj || {}).unmatched || [];
  return `<section id="help"><h2>How to read this page</h2>
  <ul>
    <li><b>Average miss</b>: how many fantasy points a projection is off by, on average. Single games are mostly luck, so even a great model misses by several points; what matters is which projection misses <i>less</i> over hundreds of games.</li>
    <li><b>±</b>: the uncertainty. If two projections' difference is smaller than the ±, the "winner" could just be luck so far.</li>
    <li><b>Lean</b>: a habit of projecting too high (+) or too low (−).</li>
    <li><b>Pregame only</b>: projections are saved before puck drop and never changed afterwards; anything recorded after a game started is thrown out.</li>
    <li><b>Skaters</b> are graded on games they played (injuries and scratches are handled separately). <b>Goalies</b> are graded on games they started, plus separately on whether the start chance was right.</li>
    <li><b>Flags and explanations</b> are patterns in the numbers, not proof of why something happens.</li>
  </ul>
  <details><summary>Players the AI could not match to NHL history (${um.length})</summary><p class="small muted">Mostly prospects and minor-leaguers. If you see an established NHL player here, it's a name mismatch — tell Claude.</p><p class="small">${um.map(esc).join(" · ") || "none"}</p></details>
  </section>`;
}

// ---- AI Lab v2: the answer first, in plain words
function secVerdict(D) {
  const rep = D.rep || {}, t = (rep.tasks || {}).skater || {}, c = rep.counts || {}, pr = (rep.paired || {}).skater || {};
  let html = `<section id="verdict"><div class="lab">Which projection is most accurate</div>`;
  const rows = M.filter(m => t[m]).map(m => [m, t[m].mae, t[m].n]).sort((a, b) => a[1] - b[1]);
  if (!rows.length) return html + `<div class="empty">No finished games graded yet.</div></section>`;
  const best = rows[0], second = rows[1], last = rows[rows.length - 1];
  const k = second ? (pr[best[0] + "_vs_" + second[0]] || pr[second[0] + "_vs_" + best[0]]) : null;
  const level = !!(k && !/more accurate$/.test(k.verdict));
  let line = level ? `${NAME[best[0]]} and ${NAME[second[0]]} are level.` : `${NAME[best[0]]} is the most accurate so far.`;
  if (rows.length > 2) line += ` ${level ? "Both beat" : "It beats"} ${NAME[last[0]]} by ${f(last[1] - best[1], 1)} points a game.`;
  html += `<p class="vd">${line}</p>`;
  for (const [m, mae] of rows) html += `<div class="rk"><span>${NAME[m]}</span><div class="bar"><i style="width:${Math.round(mae / last[1] * 100)}%;background:${m === best[0] ? "var(--tx)" : m === last[0] ? "var(--bad)" : "var(--mu)"}"></i></div><b>${f(mae)}</b></div>`;
  return html + `<p class="muted small">How many fantasy points each projection is off by per game, on average, for skaters. Shorter is better. ${c.graded_days || 0} game days, ${(best[2] || 0).toLocaleString()} player-games. Goalies need more games before there is a winner.</p></section>`;
}
function secOff(D) {
  const seg = (D.rep || {}).segments || {}, out = [];
  const LAB = {venue: {away: "Players on the road", home: "Players at home"},
    "power play": {"not on PP1": "Players off the top power play", "on PP1": "Players on the top power play"},
    rest: {"back-to-back": "Players on the second night of a back-to-back"},
    line: {D1: "Top-pair defencemen", F1: "First-line forwards", "lower lines": "Lower-line players"}};
  const add = (label, m, s) => { if (s && s.n >= 40 && s.bias_se > 0 && Math.abs(s.bias) >= 0.4 && Math.abs(s.bias) >= 2.4 * s.bias_se) out.push({label, m, b: s.bias}); };
  for (const [key, vals] of Object.entries(LAB)) for (const [v, label] of Object.entries(vals)) for (const m of ["ai", "espn"]) add(label, m, ((seg[key] || {})[v] || {})[m]);
  for (const [tm, ms] of Object.entries(seg.team || {})) add(tm + " skaters", "ai", ms.ai);
  out.sort((a, b) => Math.abs(b.b) - Math.abs(a.b));
  let html = `<section id="off"><div class="lab">Where the projections are off</div>`;
  if (!out.length) return html + `<div class="empty">No pattern is large enough to trust yet.</div></section>`;
  html += out.slice(0, 10).map((x, i) => `<div class="r"${i ? "" : ' style="border-top:0"'}><span>${esc(x.label)}</span><span class="muted small">${NAME[x.m]} projects them</span><b class="${x.b > 0 ? "over" : "under"}" style="min-width:86px;text-align:right">${f(Math.abs(x.b), 1)} too ${x.b > 0 ? "high" : "low"}</b></div>`).join("");
  return html + `<p class="muted small" style="margin-top:8px">Points a game. Only patterns too large to be luck are listed. They are clues, not proven causes.</p></section>`;
}

// ------------------------------------------------------------ boot
(async () => {
  const [rep, val, reg, proj, status, research] = await Promise.all([
    j("ai/report.json"), j("ai/models/validation.json"), j("ai/models/registry.json"),
    j("ai/models/ai_proj.json"), j("ai/models/status.json"), j("ai/research/log.json")]);
  await loadScript("espn-data.js");
  const D = {rep, val, reg, proj, status, research, ED: window.ESPN_DATA || {}};
  const run = fns => fns.map(fn => { try { return fn(D); } catch (e) { return `<section><div class="empty">This section failed to load: ${esc(e.message)}</div></section>`; } }).join("");
  document.getElementById("app").innerHTML = run([secVerdict, secHealth, secOff, secPlayers])
    + `<details class="grp"><summary>Goalie start chances: did 70% mean 70%</summary>${run([secGoalies])}</details>`
    + `<details class="grp"><summary>Under the hood: accuracy tables, model tests, research log</summary>${run([secLive, secTime, secWhere, secLab, secResearch, secHelp])}</details>`;
  const sel = document.getElementById("segSel");
  if (sel) { sel.onchange = () => drawSeg(D); drawSeg(D); }
  document.querySelectorAll(".chip").forEach(c => c.onclick = () => drawPlayer(D, c.dataset.id));
  const inp = document.getElementById("pSearch");
  if (inp) inp.onchange = () => {
    const p = (D.ED.players || []).find(x => inp.value.startsWith(x.n + " ("));
    if (p) drawPlayer(D, p.id);
  };
})();
</script>
