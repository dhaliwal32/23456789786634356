<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>3D Player Test</title>
<style>
  :root { --bg: #0b0c0f; --card: #15171b; --ink: #f4f5f6; --mute: #8a8d93; --line: #26282d; }
  @media (prefers-color-scheme: light) { :root { --bg: #f2f4f6; --card: #ffffff; --ink: #14161a; --mute: #5f6670; --line: #dde1e6; } }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px -apple-system, Inter, Arial, sans-serif; }
  .wrap { max-width: 460px; margin: 0 auto; padding: 12px 16px 40px; }
  h1 { font-size: 18px; margin: 4px 0 10px; }
  #st { height: 420px; border-radius: 18px; overflow: hidden; background: radial-gradient(ellipse at 50% 92%, #C8102E99, transparent 62%), linear-gradient(180deg, #0b0c0f, #15171b); }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  button { padding: 11px 6px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 14px; font-weight: 600; }
  button.on { background: var(--ink); color: var(--bg); }
  pre { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; white-space: pre-wrap; font-size: 12.5px; line-height: 1.5; }
  .hint { color: var(--mute); font-size: 12px; margin-top: 6px; }
</style>
<script src="vendor/gx3d.js"></script><script src="vendor/gx3d-player.js"></script>
</head><body><div class="wrap">
<h1>3D player test</h1>
<div id="st"></div>
<div class="hint">Drag the player to spin him. Pick a model size, then tap Run speed test.</div>
<div class="row" id="lv"><button data-m="hi" class="on">High 4.3 MB</button><button data-m="mid">Medium 1.3 MB</button><button data-m="low">Low 0.4 MB</button></div>
<div class="row"><button id="bench" style="grid-column: 1 / -1">Run speed test</button></div>
<pre id="out">Loading...</pre>
</div>
<script>
(function () {
  var out = document.getElementById("out"), st = document.getElementById("st"), cur = "hi", v = null, info = {};
  var SZ = { hi: "4.3 MB, 123,000 triangles", mid: "1.3 MB, 44,000 triangles", low: "0.37 MB, 10,600 triangles" };
  var FLA = { body: "#C8102E", trim: "#041E42", pants: "#041E42", helmet: "#C8102E", glove: "#C8102E", num: "#FFFFFF" };
  function gpu() { try { var c = document.createElement("canvas"), g = c.getContext("webgl2") || c.getContext("webgl"); if (!g) return "no WebGL"; var e = g.getExtension("WEBGL_debug_renderer_info"); return e ? g.getParameter(e.UNMASKED_RENDERER_WEBGL) : "WebGL ok"; } catch (e) { return "error"; } }
  function show() {
    out.textContent = "Model: " + cur + " (" + SZ[cur] + ")\n" +
      "Download + open: " + (info.ms != null ? info.ms + " ms" + (info.cached ? " (from cache)" : "") : "...") + "\n" +
      (info.fps ? "Spinning speed: " + info.fps + " frames a second (slowest frame " + info.worst + " ms)\n" : "") +
      (info.mem ? "Memory used by the page: " + info.mem + " MB\n" : "") +
      "Screen: " + innerWidth + " x " + innerHeight + " at " + (devicePixelRatio || 1) + "x\nGraphics: " + gpu();
  }
  function load(m) {
    if (v) v.dispose(); info = { cached: !!window.__seen && window.__seen[m] }; window.__seen = window.__seen || {}; show();
    var t0 = performance.now();
    v = gxPl3D.mount(st, { url: "models3d/standing_" + m + ".glb", colors: FLA, name: "LUNDELL", no: "15", light: false, start: Math.PI });
    v.ready.then(function () { info.ms = Math.round(performance.now() - t0); window.__seen[m] = 1; show(); }, function (e) { out.textContent = "Could not load the model: " + e; });
  }
  document.querySelectorAll("#lv button").forEach(function (b) { b.onclick = function () { document.querySelectorAll("#lv button").forEach(function (x) { x.classList.remove("on"); }); b.classList.add("on"); cur = b.getAttribute("data-m"); load(cur); }; });
  document.getElementById("bench").onclick = function () {
    if (!v) return; var t = [], a = Math.PI, last = performance.now(), end = last + 5000;
    (function f(now) { t.push(now - last); last = now; a += 0.02; v.setAngle(a); if (now < end) requestAnimationFrame(f); else {
      t.shift(); t.sort(function (x, y) { return x - y; }); var avg = t.reduce(function (s, x) { return s + x; }, 0) / t.length;
      info.fps = Math.round(1000 / avg); info.worst = Math.round(t[t.length - 1]);
      if (performance.memory) info.mem = Math.round(performance.memory.usedJSHeapSize / 1048576);
      show(); } })(performance.now());
  };
  if (!window.GX3D || !window.gxPl3D) { out.textContent = "3D library did not load."; return; }
  load(cur);
})();
</script>
</body></html>
